<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner 事务官设计稿</title>
<style>

:root{color-scheme:dark;--bg:#191b1e;--pane:#202226;--pane2:#25282d;--edge:#383c42;--ink:#eceef1;--muted:#a6aeb9;--dim:#7d8590;--blue:#79bfff;--bluebg:#1f3347;--amber:#f2c786;--amberbg:#3a3020;--green:#8ed4af;--greenbg:#1e3329;--red:#f29a9a;--redbg:#3d2224;--violet:#c3b5ff;--violetbg:#2c2843}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:var(--pane2);border:1px solid var(--edge);border-radius:5px;padding:4px 10px}
button:hover{border-color:#566070}
button.pri{background:#2b6cb0;border-color:#3b82c4;color:#fff}
button.on{background:var(--bluebg);border-color:#43627f;color:#cfe6ff}
.top{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--edge);background:var(--pane)}
.brand{font-weight:600}
.ex{display:flex;gap:6px}
.ex button{font-size:12px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;height:calc(100vh - 46px);min-height:720px}
.side{border-right:1px solid var(--edge);padding:14px 12px;overflow:auto;background:var(--pane)}
.main{overflow:auto;padding:18px 26px 40px}
.chat{border-left:1px solid var(--edge);display:flex;flex-direction:column;background:var(--pane)}
.k{font-size:11px;letter-spacing:.08em;color:var(--dim);margin:14px 0 6px}
.k:first-child{margin-top:0}
.file{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:4px;font-size:13px;color:#d6dae0}
.file:hover,.file.sel{background:#2c3138}
.file small{margin-left:auto;color:var(--dim);font-size:11px}
.h1{font-size:22px;font-weight:600;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px}
.stages{display:flex;gap:0;margin:14px 0 16px;border-bottom:1px solid var(--edge)}
.stages button{border:0;background:none;border-radius:0;padding:6px 14px 8px;color:var(--muted);border-bottom:2px solid transparent}
.stages button.on{color:#cfe6ff;border-bottom-color:#56aff8}
.card{background:var(--pane);border:1px solid var(--edge);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap}
.t-direct{background:var(--greenbg);border-color:#2f5a45;color:var(--green)}
.t-ask{background:var(--amberbg);border-color:#5e4c2c;color:var(--amber)}
.t-never{background:var(--redbg);border-color:#5e3236;color:var(--red)}
.t-blue{background:var(--bluebg);border-color:#43627f;color:#a8d7ff}
.t-violet{background:var(--violetbg);border-color:#4a4275;color:var(--violet)}
.auth{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.col{background:var(--pane2);border-radius:6px;padding:10px}
.col .hd{font-weight:600;font-size:13px;margin-bottom:2px}
.col .ds{font-size:11px;color:var(--dim);margin-bottom:8px}
.cap{display:block;width:100%;text-align:left;margin:0 0 6px;font-size:12px;padding:6px 8px;background:var(--pane)}
.cap b{font-weight:600;display:block}
.cap span{color:var(--muted)}
.cap.lock{cursor:default;opacity:.85}
.cap.lock:hover{border-color:var(--edge)}
.unused{font-size:12px;color:var(--dim);margin-top:8px}
.steps{list-style:none;margin:0;padding:0}
.step{border:1px solid var(--edge);border-radius:6px;margin:0 0 6px;background:var(--pane)}
.step .row{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
.step .n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:#30353c;color:var(--muted);flex:none}
.st-done .n{background:var(--greenbg);color:var(--green)}
.st-run .n{background:var(--bluebg);color:#a8d7ff}
.st-ask .n,.st-wait .n{background:var(--amberbg);color:var(--amber)}
.st-skip .n{background:var(--redbg);color:var(--red)}
.step .tt{flex:1;min-width:0}
.step .who{font-size:12px;color:var(--muted);white-space:nowrap}
.step .det{display:none;border-top:1px solid var(--edge);padding:8px 10px 10px 40px;font-size:12px}
.step.open .det{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px}
.det .l{color:var(--dim)}
.stx{font-size:11px;white-space:nowrap}
.prompt{border:1px solid #5e4c2c;background:#2a251c;border-radius:8px;padding:12px 14px;margin:0 0 12px}
.prompt .bar{height:4px;background:#3a3326;border-radius:2px;margin:8px 0}
.prompt .bar i{display:block;height:4px;background:var(--amber);border-radius:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.decide{border-color:#5e3236;background:#2a1e20}
.ok{border-color:#2f5a45;background:#1c2a23}
.note{font-size:12px;color:var(--muted)}
pre.doc{white-space:pre-wrap;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--pane);border:1px solid var(--edge);border-radius:8px;padding:16px 18px;margin:0;color:#d9dde3}
.msgs{flex:1;overflow:auto;padding:14px}
.m{margin:0 0 12px;font-size:13px}
.m .who{font-size:11px;color:var(--dim);margin-bottom:2px}
.m .bd{background:var(--pane2);border-radius:6px;padding:8px 10px}
.m.me .bd{background:var(--bluebg)}
.inp{border-top:1px solid var(--edge);padding:10px 12px;color:var(--dim);font-size:13px}
table.set{width:100%;border-collapse:collapse;font-size:13px}
table.set td,table.set th{border-top:1px solid var(--edge);padding:8px 6px;text-align:left;vertical-align:top}
table.set th{color:var(--dim);font-weight:500;font-size:12px;border-top:0}
select{background:var(--pane2);color:var(--ink);border:1px solid var(--edge);border-radius:5px;padding:3px 6px;font:inherit;font-size:12px}
.banner{background:var(--greenbg);border:1px solid #2f5a45;color:var(--green);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@media(max-width:1100px){.app{grid-template-columns:180px minmax(0,1fr) 280px}}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr) 260px}.side{display:none}.auth{grid-template-columns:1fr}.main{padding:16px}.top{flex-wrap:wrap;height:auto;padding:8px 16px}}
.chat{position:sticky;top:0;height:calc(100vh - 46px);min-height:0}
.chead{height:40px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--edge);font-size:13px}
.inp input{width:calc(100% - 58px);background:var(--pane2);border:1px solid var(--edge);border-radius:5px;color:var(--ink);padding:6px 8px;font:inherit;font-size:13px}
.inp button{width:52px;margin-left:4px}
.act{border:1px solid #5e4c2c;background:#2a251c;border-radius:6px;padding:8px 10px;margin-top:8px}
.act .bar{height:4px;background:#3a3326;border-radius:2px;margin:8px 0}.act .bar i{display:block;height:4px;background:var(--amber);border-radius:2px}
.pointer{display:flex;justify-content:space-between;background:var(--amberbg);border:1px solid #5e4c2c;color:var(--amber);border-radius:6px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin:0 0 8px}
</style>
</head>

 if(stage===0&&!a.quick)ask('请确认约定 v1。',`<div class="act"><div style="font-weight:600">确认约定 v1</div><div class="note">直接做 ${a.auth.filter(x=>x.l==='direct').length} 项 · 先问我 ${a.auth.filter(x=>x.l==='ask').length} 项 · 不做 ${a.auth.filter(x=>x.l==='never').length} 项；共 ${a.steps.length} 步。确认即授权。</div><div class="btns"><button class="pri" data-a="confirm">确认并开始</button><button data-a="file">打开 事务配置.md</button></div></div>`);
 if(stage>=1&&!a.quick)m.push(['me','确认']);
 if(stage>=1&&a.prompt&&!outcome[cur])ask('第 '+(cur==='ibex'?5:7)+' 步要做一件约定外的事，需要你批准。我先继续做其余步骤。',`<div class="act"><div style="font-weight:600">${esc(a.prompt.text)}</div><div class="note">${esc(a.prompt.why)}授权范围：${esc(a.prompt.grant)}。${a.prompt.req?'这是必需步骤。':'这是可选步骤。'}</div><div class="bar"><i id="bar" style="width:${left/60*100}%"></i></div><div class="note"><span id="left">${left}</span> 秒后无回应就跳过这一步</div><div class="btns"><button class="pri" data-a="allow">允许</button><button data-a="skip">跳过</button><button data-a="ff" style="margin-left:auto;font-size:11px">演示：快进</button></div></div>`);
 if(outcome[cur]==='allow')m.push(['me','允许']);
 if(outcome[cur]==='skip')m.push(['me','跳过']);
 if(outcome[cur]==='skip'||outcome[cur]==='timeout'){if(cur==='ibex'){ask((outcome.ibex==='skip'?'':'你没有回应，')+'第 5 步已跳过，其余步骤做完了。它是必需步骤，所以报告存成草稿，没有交付。',granted.ibex||stage<2?'':`<div class="act"><div style="font-weight:600">待你决定：第 5 步被跳过</div><div class="note">允许后只读这一个文件，只重跑第 5、6、7 步，第 3、4 步的证据保持有效。</div><div class="btns"><button class="pri" data-a="grant">允许读取此文件并补查</button><button data-a="file2">打开 事务.md</button></div></div>`)}
  else m.push(['o','示意图跳过了。它是可选步骤，不影响交付，我会写进未完成项。'])}
 if(granted.ibex)m.push(['me','允许读取此文件并补查'],['o','只读入了 decoder-review.md，重跑了第 5、6、7 步，已交付。']);
 if(stage===2&&cur==='article')ask('草稿已存好，没有发布。',`<div class="act"><div class="btns" style="margin-top:0">${outcome.article!=='allow'?'<button data-a="lateImg">现在允许上传示意图</button>':''}<button data-a="pub">我要发布这篇</button></div><div class="note" id="pubNote"></div></div>`);
 if(stage===2&&cur==='quick')m.push(['o','默认两级，写回级默认关闭。依据已存进 资料/，回答写在 交付物/回答.md。']);
 const n=pending();$('chead').innerHTML=`<b>事务官</b><span class="note" style="margin-left:6px">${esc(a.name)}</span>${n?`<span class="tag t-ask" style="margin-left:auto">等你 ${n}</span>`:'<span class="tag" style="margin-left:auto">无待办</span>'}`;
 $('msgs').innerHTML=m.map(([w,t,c])=>`<div class="m ${w==='me'?'me':''}"><div class="who">${w==='me'?'你':'Owner'}</div><div class="bd">${esc(t)}${c||''}</div></div>`).join('');
 $('msgs').scrollTop=1e5;
 $('msgs').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a))}
function act(k){if(k==='confirm'){stage=1;left=60;view='board';render()}
 if(k==='allow'||k==='skip')decideP(k);if(k==='ff')left=1;
 if(k==='file'){view='file:事务配置.md';render()}if(k==='file2'){view='file:事务.md';render()}
 if(k==='grant'){granted.ibex=1;render()}if(k==='lateImg'){outcome.article='allow';render()}
 if(k==='pub')$('pubNote').textContent='这件事没有发布授权。我会起草约定 v2：点名博客园账号和这篇文章，把"对外发布"改为先问我。你确认 v2 后，发布前还会再问你一次。'}
function send(){const v=$('say').value.trim();if(!v)return;(said[cur]=said[cur]||[]).push(v);$('say').value='';chat()}
function stop(){if(timer){clearInterval(timer);timer=null}}
function tick(){if(stage!==1||!A[cur].prompt||outcome[cur]){stop();return}if(timer)return;timer=setInterval(()=>{left--;if($('left'))$('left').textContent=left;if($('bar'))$('bar').style.width=(left/60*100)+'%';if(left<=0){decideP('timeout')}},1000)}
function decideP(o){stop();outcome[cur]=o;left=60;stage=2;render()}
function render(){ex();side();chat();const M=$('main');
 tick();if(view==='settings'){M.innerHTML=settings();M.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{RT[b.dataset.tg].ok=!RT[b.dataset.tg].ok;render()});M.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{RT[x.dataset.m].model=x.value;render()});M.querySelectorAll('[data-wt]').forEach(x=>x.onchange=()=>{const l=WT[x.dataset.wt];l[+x.dataset.k]=x.value;WT[x.dataset.wt]=l.filter(Boolean);render()});M.querySelectorAll('[name=wk]').forEach(x=>x.onchange=()=>{weakMode=x.value;render()});M.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=DEF[+b.dataset.d];if(d.lock)return;d.l={direct:'ask',ask:'never',never:'direct'}[d.l];render()});return}
 if(view.startsWith('file:')){const n=view.slice(5);M.innerHTML=`<div class="sub">事务文件</div><div class="h1">${n}</div><div class="sub" style="margin-bottom:14px">由 Owner 写入；看板就是从这里生成的。</div><pre class="doc">${esc(doc(n))}</pre>`;return}
 M.innerHTML=board();
 M.querySelectorAll('.stages button').forEach(b=>b.onclick=()=>{stage=+b.dataset.s;render()});
 M.querySelectorAll('.step').forEach(li=>li.querySelector('.row').onclick=()=>{const i=+li.dataset.i;open=open===i?-1:i;render()});
 M.querySelectorAll('.cap[data-i]').forEach(b=>b.onclick=()=>{if(stage!==0)return;const x=A[cur].auth[+b.dataset.i];if(x.lock)return;x.l={direct:'ask',ask:'never',never:'direct'}[x.l];render()});
 M.querySelectorAll('[data-ov]').forEach(x=>{x.onclick=e=>e.stopPropagation();x.onchange=()=>{over[cur+':'+x.dataset.ov]=x.value;render()}});
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('toEnd',()=>{stage=2;render()});
 tick()}
$('sendBtn').onclick=send;$('say').onkeydown=e=>{if(e.key==='Enter')send()};
$('setBtn').onclick=()=>{view='settings';render()};
render();
</script>
</body>
</html>
