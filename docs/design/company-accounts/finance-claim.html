<style>
.finance-v2{color-scheme:light dark;--f-bg:light-dark(#ffffff,#202124);--f-side:light-dark(#f1f3f5,#27292d);--f-text:light-dark(#212631,#e8ebf0);--f-dim:light-dark(#667181,#adb6c5);--f-line:light-dark(#dce1e8,#404650);--f-blue:light-dark(#155db7,#91bdff);--f-soft:light-dark(#edf4ff,#293a52);--f-green:light-dark(#168066,#79d8b6);--f-amber:light-dark(#966109,#efc373);background:var(--f-bg);color:var(--f-text);border:1px solid var(--f-line);border-radius:8px;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;margin:0 0 24px}
.finance-v2 *{box-sizing:border-box}.finance-v2 .chrome{padding:12px 110px 12px 16px;border-bottom:1px solid var(--f-line);background:var(--f-side);display:flex;gap:14px;flex-wrap:wrap}.finance-v2 .workspace{display:grid;grid-template-columns:130px minmax(0,1fr)}.finance-v2 nav{background:var(--f-side);border-right:1px solid var(--f-line);padding:14px 8px}.finance-v2 nav span{display:block;padding:8px;border-radius:4px;margin:4px 0}.finance-v2 nav .selected{background:var(--f-soft);color:var(--f-blue)}.finance-v2 main{padding:24px;min-width:0}.finance-v2 h2{font-size:23px;font-weight:500;margin:0 0 4px}.finance-v2 h3{font-size:16px;font-weight:500;margin:18px 0 10px}.finance-v2 p{margin:8px 0}.finance-v2 .dim{color:var(--f-dim)}.finance-v2 button,.finance-v2 input,.finance-v2 textarea,.finance-v2 select{font:inherit;color:inherit}.finance-v2 button{border:1px solid var(--f-line);background:var(--f-bg);border-radius:5px;padding:7px 12px}.finance-v2 button.primary,.finance-v2 button[aria-pressed=true]{color:light-dark(#fff,#182539);background:var(--f-blue);border-color:var(--f-blue)}.finance-v2 button:disabled{opacity:.5}.finance-v2 input:not([type=checkbox]),.finance-v2 select,.finance-v2 textarea{border:1px solid var(--f-line);border-radius:4px;padding:8px;background:var(--f-bg);width:100%;min-width:0}.finance-v2 label{display:block}.finance-v2 .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.finance-v2 .between{justify-content:space-between}.finance-v2 .filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin:15px 0}.finance-v2 .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.finance-v2 .stat,.finance-v2 .panel{padding:16px;border:1px solid var(--f-line);border-radius:6px;background:var(--f-bg)}.finance-v2 .num{font-size:25px;font-weight:500;font-variant-numeric:tabular-nums;margin:3px 0}.finance-v2 .note{background:var(--f-soft);border-radius:5px;padding:11px 14px;margin:14px 0}.finance-v2 .warning{color:var(--f-amber)}.finance-v2 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.finance-v2 .twocol{display:grid;grid-template-columns:.9fr 1.4fr;gap:20px;margin-top:18px}.finance-v2 .bubble{background:var(--f-side);padding:13px;border-radius:6px;margin:12px 0}.finance-v2 .attachment{border:1px dashed var(--f-line);padding:12px;border-radius:4px}.finance-v2 .tablewrap{overflow-x:auto}.finance-v2 table{width:100%;border-collapse:collapse;margin:10px 0}.finance-v2 th,.finance-v2 td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--f-line);font-weight:400;vertical-align:top}.finance-v2 th{color:var(--f-dim)}.finance-v2 .money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.finance-v2 .line{padding:12px 0;border-bottom:1px solid var(--f-line)}.finance-v2 .pill{background:var(--f-side);border-radius:5px;padding:3px 7px;display:inline-block}.finance-v2 .track{height:8px;background:var(--f-side);border-radius:4px;margin:8px 0 16px}.finance-v2 .track b{height:100%;display:block;background:var(--f-blue);border-radius:4px}.finance-v2 .bands{display:grid;gap:12px}.finance-v2 .band{display:grid;grid-template-columns:75px 1fr;gap:8px;align-items:center}.finance-v2 .mark{background:var(--f-blue);height:13px;min-width:0;border-radius:2px}.finance-v2 .mark.out{background:var(--f-amber)}.finance-v2 .barrow{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}.finance-v2 .footer{padding:9px 16px;border-top:1px solid var(--f-line);background:var(--f-side);font-size:12px;color:var(--f-dim)}.finance-v2 .modal{max-width:620px;margin:auto;border:1px solid var(--f-line);padding:20px;border-radius:7px;background:var(--f-bg)}.finance-v2 [hidden]{display:none!important}.finance-v2 .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.finance-v2 .full{grid-column:1/-1}@media(max-width:650px){.finance-v2 .workspace{display:block}.finance-v2 nav{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--f-line)}.finance-v2 nav span{padding:5px 8px}.finance-v2 .twocol,.finance-v2 .grid2{grid-template-columns:1fr}.finance-v2 main{padding:16px}.finance-v2 .filters{grid-template-columns:1fr}.finance-v2 .chrome{padding-right:16px}.finance-v2 .stats{grid-template-columns:1fr}.finance-v2 .formgrid{grid-template-columns:1fr}.finance-v2 .band{grid-template-columns:60px 1fr}}
</style>
<article id="finance-claim" class="finance-v2" data-page="claim">
<header class="chrome"><span>CCLink Studio</span><span>公司账目 / 报销申请</span><span class="dim">对话准备，表单提交 · 演示</span></header><div class="workspace"><nav aria-label="账目导航"><span>报表中心</span><span>项目账</span><span class="selected">报销申请</span><span>审批与付款</span><span>流水与凭证</span><span>导出与交接</span></nav><main>
<h2>说一句话，准备报销单</h2><p class="dim">AI 先生成草稿，用户核对后提交审批。</p><div class="twocol"><div class="panel"><h3 style="margin-top:0">AI 对话</h3><label>描述垫付事项<textarea id="claim-chat" rows="4">我昨天替眼镜 A 买了测试连接器，个人微信付了 800 元，帮我准备报销。</textarea></label><p class="attachment">演示附件：订单截图、付款截图、电子发票</p><button class="primary cursor-interaction" id="claim-prepare">生成草稿</button><div class="bubble" id="claim-ai">我会检查金额和附件是否一致，并把日期、项目和用途填入草稿。审批人需要你核对。</div></div><div class="modal" role="region" aria-label="报销申请表单"><div class="row between"><h3 style="margin:0">报销申请</h3><span class="pill" id="claim-state">草稿</span></div><form id="claim-form"><div class="formgrid"><label>申请人<input value="你（本地操作者，演示）" readonly></label><label>发生日期<input type="date" value="2026-10-08" required></label><label>项目<select><option>眼镜 A</option><option>眼镜 B</option></select></label><label>垫付方式<select><option>个人微信</option><option>个人银行卡</option><option>个人支付宝</option></select></label><label class="full">用途<input value="研发测试连接器采购" required></label><label>申请金额（元）<input id="claim-amount" type="number" min="0.01" step="0.01" value="800" required></label><label>审批人<select required><option value="">请选择</option><option>负责人（演示角色）</option></select></label></div><p>费用明细：测试连接器 × 10 个</p><p class="dim">附件仍需核验原件；AI 不代表发票已验真。</p><label><input id="claim-check" type="checkbox" required> 我已检查金额、用途、项目和凭证</label><div class="row" style="margin-top:15px"><button class="cursor-interaction" type="button" data-feedback="演示：保留草稿，不进入审批和已确认账。">保存草稿</button><button class="primary cursor-interaction" type="submit">提交审批</button></div></form></div></div><p class="feedback note" hidden aria-live="polite"></p>
</main></div><footer class="footer">提交不等于批准 · 不执行转账 · 多人提交与审批身份方案待定</footer></article>
<script>
(()=>{
const fmt=n=>'¥'+n.toLocaleString('zh-CN');
document.querySelectorAll('.finance-v2').forEach(root=>root.querySelectorAll('[data-feedback]').forEach(b=>b.addEventListener('click',()=>{const p=root.querySelector('.feedback');p.hidden=false;p.textContent=b.dataset.feedback;})));
const r=document.getElementById('finance-reports');
if(r){let period='month';const tx=[['09-03','服务收入','公共',30000,0,'bank'],['09-08','器件采购','A',0,2000,'bank'],['09-12','外壳打样','A',0,8000,'bank'],['09-16','光学服务','B',0,6000,'bank'],['09-22','服务收入','公共',50000,0,'bank'],['09-24','测试器件','B',0,2000,'cash'],['09-24','公司公共费用','公共',0,4800,'bank'],['09-28','研发服务','A',0,10000,'bank']];const periods={year:['2026-01-01 至 2026-12-31',1,30],month:['2026-09-01 至 2026-09-30',1,30],week:['2026-09-21 至 2026-09-27',21,27],day:['2026-09-28',28,28]};function render(){const [range,start,end]=periods[period],project=r.querySelector('#report-project').value,account=r.querySelector('#report-account').value;const rows=tx.filter(d=>Number(d[0].slice(3))>=start&&Number(d[0].slice(3))<=end&&(project==='all'||d[2]===project)&&(account==='all'||d[5]===account));const income=rows.reduce((s,d)=>s+d[3],0),out=rows.reduce((s,d)=>s+d[4],0);r.querySelector('#report-range').textContent=range;r.querySelector('#report-in').textContent=fmt(income);r.querySelector('#report-out').textContent=fmt(out);r.querySelector('#report-net').textContent=fmt(income-out);r.querySelector('#report-coverage').textContent=period==='year'?'年度资料不完整：仅导入 9 月。其余月份未知，不能把这里的合计当完整年报。':'资料覆盖：已导入 9 月演示记录。仅统计已确认实际收付；待确认另列。';r.querySelectorAll('[data-period]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.period===period)));r.querySelector('#report-rows').innerHTML=rows.map(d=>`<tr><td>${d[0]}</td><td>${d[1]} / ${d[2]==='公共'?'公司公共':`眼镜 ${d[2]}`}</td><td class="money">${d[3]?fmt(d[3]):'—'}</td><td class="money">${d[4]?fmt(d[4]):'—'}</td></tr>`).join('')||'<tr><td colspan="4">此筛选下没有已确认记录</td></tr>';const groups=period==='month'?[['1–7 日',1,7],['8–14 日',8,14],['15–21 日',15,21],['22–30 日',22,30]]:[[period==='year'?'9 月已导入':period==='week'?'本周':'当日',start,end]];const vals=groups.map(g=>[g[0],rows.filter(d=>+d[0].slice(3)>=g[1]&&+d[0].slice(3)<=g[2]).reduce((s,d)=>s+d[3],0),rows.filter(d=>+d[0].slice(3)>=g[1]&&+d[0].slice(3)<=g[2]).reduce((s,d)=>s+d[4],0)]);const max=Math.max(1,...vals.flatMap(v=>v.slice(1)));r.querySelector('#report-bars').innerHTML=vals.map(g=>`<div class="band"><span>${g[0]}</span><div><div class="barrow"><div class="mark" style="width:${g[1]/max*100}%"></div><span class="money">${fmt(g[1])}</span></div><div class="barrow"><div class="mark out" style="width:${g[2]/max*100}%"></div><span class="money">${fmt(g[2])}</span></div></div></div>`).join('');}r.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{period=b.dataset.period;render();}));r.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();}
const p=document.getElementById('finance-projects');if(p){const data={A:{budget:50000,expense:20800,paid:20000,due:800,cats:[['器件（含已批准报销）',2800],['打样',8000],['服务',10000]],docs:[['测试连接器','员工报销',800,'已批准待付款'],['外壳打样','采购 / 打样',8000,'已付款']]},B:{budget:20000,expense:8000,paid:8000,due:0,cats:[['器件',2000],['服务',6000]],docs:[['光学设计','服务合同',6000,'已付款'],['测试器件','采购',2000,'已付款']]}};function draw(key){const d=data[key];p.querySelector('#project-budget').textContent=fmt(d.budget);p.querySelector('#project-expense').textContent=fmt(d.expense);p.querySelector('#project-left').textContent=fmt(d.budget-d.expense);p.querySelector('#project-payment').textContent=`公司已付 ${fmt(d.paid)} · 待付员工报销 ${fmt(d.due)}。归还垫付不再增加一次费用。`;p.querySelector('#project-categories').innerHTML=d.cats.map(c=>`<div class="row between"><span>${c[0]}</span><span>${fmt(c[1])}</span></div><div class="track"><b style="width:${c[1]/d.expense*100}%"></b></div>`).join('');p.querySelector('#project-docs').innerHTML=d.docs.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td class="money">${fmt(v[2])}</td><td>${v[3]}</td></tr>`).join('');p.querySelectorAll('[data-project]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.project===key)));}p.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>draw(b.dataset.project)));draw('A');}
const c=document.getElementById('finance-claim');if(c){c.querySelector('#claim-prepare').addEventListener('click',()=>{c.querySelector('#claim-ai').textContent='演示草稿已准备：眼镜 A、器件采购、个人垫付 ¥800。请核对右侧字段与原件，再选择审批人。';});c.querySelector('#claim-form').addEventListener('submit',e=>{e.preventDefault();c.querySelector('#claim-state').textContent='待审批（演示）';const f=c.querySelector('.feedback');f.hidden=false;f.textContent='示意：申请已提交，尚未批准、尚未付款，未写入真实账目。';});}
const a=document.getElementById('finance-approval');if(a){let approved=false;const state=a.querySelector('#approval-state'),pay=a.querySelector('#payment-btn');a.querySelector('#approve-btn').addEventListener('click',()=>{approved=true;state.textContent='已批准待付款（演示）';pay.disabled=false;});a.querySelector('#reject-btn').addEventListener('click',()=>{const reason=a.querySelector('#approval-reason').value.trim();const f=a.querySelector('.feedback');f.hidden=false;if(!reason){f.textContent='退回前请填写原因。';return;}approved=false;pay.disabled=true;state.textContent='已退回（演示）';f.textContent='演示：保留退回原因，等待修改后重新提交。';});a.querySelector('#payment-form').addEventListener('submit',e=>{e.preventDefault();if(!approved)return;const amount=Number(a.querySelector('input[type=number]').value);state.textContent=amount<800?`部分付款 ${fmt(amount)}（演示）`:'已付款（演示）';a.querySelector('.feedback').hidden=false;a.querySelector('.feedback').textContent='只登记示意状态，不转账；实际应用需验证付款凭证，并关联单据与现金流水。';});}
})();
</script>
