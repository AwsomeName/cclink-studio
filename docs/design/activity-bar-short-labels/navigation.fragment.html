<div id="studio-navigation-options" class="viz-carousel viz-dotted-background" aria-label="Studio 导航方案" data-previous-label="上一方案" data-next-label="下一方案">
  <section data-variant="图标下加短标签" aria-label="短标签导航方案">
    <div class="sn-window sn-compact">
      <div class="sn-titlebar"><span>CCLink Studio</span><span>研发日记</span></div>
      <div class="sn-layout">
        <nav class="sn-nav" aria-label="短标签导航"></nav>
        <section class="sn-content"><div class="sn-section-title"><h3>文章发布</h3><span>工作空间</span></div><div class="sn-list"></div><div class="sn-selection" aria-live="polite"></div></section>
      </div>
    </div>
  </section>
  <section data-variant="文字导航 · 推荐" aria-label="文字导航方案" hidden>
    <div class="sn-window sn-expanded">
      <div class="sn-titlebar"><span>CCLink Studio</span><span>研发日记</span></div>
      <div class="sn-layout">
        <nav class="sn-nav" aria-label="文字导航"></nav>
        <section class="sn-content"><div class="sn-section-title"><h3>文章发布</h3><span>工作空间</span></div><div class="sn-list"></div><div class="sn-selection" aria-live="polite"></div></section>
      </div>
    </div>
  </section>
</div>
<style>
  #studio-navigation-options{color-scheme:light dark;}
  #studio-navigation-options .sn-window{--sn-bg:light-dark(#f7f8fa,#202122);--sn-nav-bg:light-dark(#eef0f3,#28292b);--sn-fg:light-dark(#23262d,#e3e5e8);--sn-secondary:light-dark(#606773,#a2a8b1);--sn-border:light-dark(#d9dde3,#3b3f44);--sn-hover:light-dark(#e1e5eb,#35383c);--sn-active:light-dark(#e0edfc,#20374a);--sn-accent:light-dark(#005fae,#70b8f0);--sn-width:146px;background:var(--sn-bg);color:var(--sn-fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--sn-border);border-radius:10px;overflow:hidden;max-width:680px;margin:0 auto;}
  #studio-navigation-options .sn-titlebar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 18px;background:var(--sn-nav-bg);border-bottom:1px solid var(--sn-border);color:var(--sn-secondary);font-size:12px;}
  #studio-navigation-options .sn-titlebar span:last-child{padding-right:80px;}
  #studio-navigation-options .sn-layout{display:grid;grid-template-columns:var(--sn-width) minmax(0,1fr);min-height:600px;}
  #studio-navigation-options .sn-nav{padding:12px 8px;background:var(--sn-nav-bg);border-right:1px solid var(--sn-border);display:flex;flex-direction:column;gap:2px;}
  #studio-navigation-options .sn-nav button{display:flex;align-items:center;gap:10px;border:0;border-radius:5px;background:transparent;color:var(--sn-fg);font:inherit;padding:8px 10px;cursor:pointer;width:100%;min-height:34px;text-align:left;}
  #studio-navigation-options .sn-nav button:hover{background:var(--sn-hover);}
  #studio-navigation-options .sn-nav button[aria-pressed="true"]{background:var(--sn-active);color:var(--sn-accent);font-weight:500;box-shadow:inset 3px 0 var(--sn-accent);}
  #studio-navigation-options .sn-icon{width:19px;height:19px;flex-shrink:0;display:grid;place-items:center;}
  #studio-navigation-options svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  #studio-navigation-options .sn-group{font-size:11px;color:var(--sn-secondary);padding:10px 10px 4px;}
  #studio-navigation-options .sn-settings{margin-top:auto;padding-top:14px;}
  #studio-navigation-options .sn-content{min-width:0;padding:24px 22px;}
  #studio-navigation-options .sn-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;}
  #studio-navigation-options h3{font-size:19px;font-weight:500;margin:0;}
  #studio-navigation-options .sn-section-title>span{font-size:11px;color:var(--sn-secondary);}
  #studio-navigation-options .sn-row{border-bottom:1px solid var(--sn-border);padding:16px 0;}
  #studio-navigation-options .sn-row strong{font-weight:500;display:block;}
  #studio-navigation-options .sn-row small{display:block;color:var(--sn-secondary);font-size:12px;margin-top:6px;}
  #studio-navigation-options .sn-selection{padding-top:18px;color:var(--sn-secondary);font-size:12px;}
  #studio-navigation-options .sn-compact{--sn-width:84px;}
  #studio-navigation-options .sn-compact .sn-nav{padding:8px 5px;}
  #studio-navigation-options .sn-compact .sn-nav button{flex-direction:column;gap:3px;min-height:38px;padding:3px 4px;font-size:11px;text-align:center;}
  #studio-navigation-options .sn-compact .sn-group{text-align:center;padding:5px 0 2px;font-size:11px;}
  #studio-navigation-options .sn-compact .sn-settings{padding-top:8px;}
  @media(max-width:450px){#studio-navigation-options .sn-titlebar span:last-child{display:none;}#studio-navigation-options .sn-window{--sn-width:132px;}#studio-navigation-options .sn-compact{--sn-width:76px;}#studio-navigation-options .sn-content{padding:18px 12px;}#studio-navigation-options .sn-section-title{display:block;}#studio-navigation-options .sn-section-title>span{display:block;margin-top:8px;}#studio-navigation-options h3{font-size:16px;}#studio-navigation-options .sn-nav button{gap:7px;padding:8px 7px;}#studio-navigation-options .sn-compact .sn-nav button{padding:3px;gap:3px;} }
</style>
<script>
(() => {
  const root = document.getElementById('studio-navigation-options');
  const icon = (name) => `<span class="sn-icon" aria-hidden="true"><i data-lucide="${name}"></i></span>`;
  const shapes = {
    files:'folder', sessions:'messages-square', browser:'globe', terminal:'square-terminal',
    roles:'users', accounts:'contact', data:'database', ledger:'receipt-text', remote:'cloud-upload',
    article:'file-check', affairs:'git-branch', schedule:'calendar-clock', video:'clapperboard',
    production:'cpu', settings:'settings'
  };
  const groups = [
    ['工作', [['files','文件','文件'],['sessions','AI 会话','会话'],['browser','浏览器','浏览器'],['terminal','终端','终端']]],
    ['资源', [['roles','角色','角色'],['accounts','网站与账号','账号'],['data','数据源','数据'],['ledger','公司账目','账目'],['remote','CCLink 远程','远程']]],
    ['流程', [['article','文章发布','发布'],['affairs','事务','事务'],['schedule','定时任务','定时'],['video','视频创作','视频'],['production','硬件生产','硬件']]]
  ];
  const rows = {
    article:[['AIR眼镜体验记录','CSDN · 待发布'],['AIR眼镜使用心得','知乎 · 已保存草稿'],['做 AI 眼镜的一些思考','微博 · 待检查']],
    video:[['现有视频工程','从稿件生成口播与分镜'],['新建视频工程','选择 Markdown 稿件']],
    production:[['硬件生产检查','Gerber · BOM · 坐标'],['生产检查报告','本地生成与打开']],
    sessions:[['当前工作空间会话','继续与 Agent 协作']],
    accounts:[['网站与账号','管理已有登录环境']],
    ledger:[['公司账目','核对、汇总与导出']],
    files:[['丙午流光','自我介绍.md'],['研发日记','工作空间文件']],
    affairs:[['网页事务','查看执行进度与结果']],
    schedule:[['定时任务','查看任务与运行记录']]
  };
  function renderVariant(section) {
    const windowEl = section.querySelector('.sn-window');
    const compact = windowEl.classList.contains('sn-compact');
    const nav = section.querySelector('nav');
    groups.forEach(([group,items]) => {
      const heading = document.createElement('div'); heading.className='sn-group'; heading.textContent=group; nav.appendChild(heading);
      items.forEach(([id,label,short]) => {
        const button=document.createElement('button');button.type='button';button.dataset.id=id;button.setAttribute('aria-label',label);button.setAttribute('aria-pressed',String(id==='article'));
        button.innerHTML=icon(shapes[id])+`<span>${compact?short:label}</span>`;
        button.addEventListener('click',()=>select(id,label));nav.appendChild(button);
      });
    });
    const settings=document.createElement('div');settings.className='sn-settings';settings.innerHTML=`<button type="button" aria-label="设置" aria-pressed="false" data-id="settings">${icon(shapes.settings)}<span>设置</span></button>`;settings.querySelector('button').addEventListener('click',()=>select('settings','设置'));nav.appendChild(settings);
    function select(id,label) {
      nav.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.id===id)));
      section.querySelector('h3').textContent=label;
      const list=section.querySelector('.sn-list');list.replaceChildren();
      (rows[id]||[[label,'工作空间入口']]).forEach(([title,detail])=>{const row=document.createElement('div');row.className='sn-row';const strong=document.createElement('strong');strong.textContent=title;const small=document.createElement('small');small.textContent=detail;row.append(strong,small);list.appendChild(row);});
      section.querySelector('.sn-selection').textContent='';
    }
    select('article','文章发布');
    if(globalThis.Tweak && !compact){const state={width:146};const tweak=new Tweak({container:nav,onChange:()=>windowEl.style.setProperty('--sn-width',state.width+'px')});tweak.addSlider(state,'width',{label:'导航宽度',min:132,max:176,step:2,unit:'px'});}
  }
  root.querySelectorAll(':scope > section').forEach(renderVariant);
  lucide.createIcons({ attrs: { width: 18, height: 18 } });
})();
</script>
