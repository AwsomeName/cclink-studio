      const labels = {personal:&#x27;我的空间&#x27;, company:&#x27;我的公司&#x27;, project:&#x27;woniu-forward&#x27;};

      const button = (label, action, primary = false, ico = &#x27;&#x27;) =&gt; `&lt;button type=&quot;button&quot; class=&quot;s-button ${primary?&#x27;s-primary&#x27;:&#x27;&#x27;} cursor-interaction&quot; data-action=&quot;${action}&quot;&gt;${ico?icon(ico):&#x27;&#x27;}${label}&lt;/button&gt;`;

      const states = new Map();
      function initial(scene) {return {scene, active:[&#x27;company&#x27;,&#x27;project&#x27;].includes(scene)?scene:&#x27;personal&#x27;, panel:scene===&#x27;company&#x27;?&#x27;company&#x27;:scene===&#x27;project&#x27;?&#x27;files&#x27;:&#x27;home&#x27;, modal:[&#x27;legacy&#x27;,&#x27;new&#x27;,&#x27;missing&#x27;].includes(scene)?scene:null, companyName:&#x27;示例工作室&#x27;, companyPath:&#x27;~/CCLink Studio/默认工作空间&#x27;, compact:false, more:false, notice:&#x27;&#x27;, section:&#x27;公司总览&#x27;};}
      function mainContent(s) {
        if (s.active === &#x27;company&#x27; &amp;&amp; [&#x27;company&#x27;,&#x27;finance&#x27;].includes(s.panel)) {

          if (s.freshCompany) return `&lt;p class=&quot;s-eyebrow&quot;&gt;${escape(s.companyName)} · 独立公司资料&lt;/p&gt;&lt;h1&gt;公司总览&lt;/h1&gt;&lt;p class=&quot;s-caption&quot;&gt;公司空间已准备好，从第一项真实业务开始。&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;创建业务项目&#x27;,&#x27;new-business&#x27;,true,&#x27;plus&#x27;)}${button(&#x27;导入账目资料&#x27;,&#x27;sample&#x27;,false,&#x27;upload&#x27;)}&lt;/div&gt;&lt;section class=&quot;s-section&quot;&gt;&lt;div class=&quot;s-list&quot;&gt;${row(&#x27;folder-open&#x27;,&#x27;关联已有资料与会话&#x27;,&#x27;按需选择资料，不自动导入个人内容&#x27;,&#x27;sample&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;s-location&quot;&gt;&lt;p&gt;公司资料位置&lt;/p&gt;&lt;p class=&quot;s-path&quot;&gt;${escape(s.companyPath)}&lt;/p&gt;&lt;/div&gt;`;
          return `&lt;p class=&quot;s-eyebrow&quot;&gt;${escape(s.companyName)} · 本地经营资料&lt;/p&gt;&lt;div class=&quot;s-spread&quot;&gt;&lt;h1&gt;${section}&lt;/h1&gt;${button(&#x27;新建业务&#x27;,&#x27;new-business&#x27;,false,&#x27;plus&#x27;)}&lt;/div&gt;

            ${section===&#x27;财务&#x27;?`&lt;div class=&quot;s-section&quot;&gt;&lt;div class=&quot;s-spread s-section-title&quot;&gt;&lt;h2&gt;2026 年 11 月账目&lt;/h2&gt;&lt;span class=&quot;s-chip&quot;&gt;示意月份&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;s-list&quot;&gt;${row(&#x27;file-spreadsheet&#x27;,&#x27;账目与原件&#x27;,&#x27;沿用原公司资料中的账目记录&#x27;,&#x27;record&#x27;)}${row(&#x27;landmark&#x27;,&#x27;财务账户&#x27;,&#x27;与当前公司空间关联&#x27;,&#x27;record&#x27;)}&lt;/div&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;导入账目资料&#x27;,&#x27;sample&#x27;,true,&#x27;upload&#x27;)}${button(&#x27;查看原账目&#x27;,&#x27;record&#x27;)}&lt;/div&gt;&lt;/div&gt;`:
            section===&#x27;资料与会话&#x27;?`&lt;div class=&quot;s-list&quot;&gt;${row(&#x27;file-text&#x27;,&#x27;产品规格说明.md&#x27;,&#x27;来自原公司空间 · 文件保持原位置&#x27;,&#x27;record&#x27;)}${row(&#x27;messages-square&#x27;,&#x27;本月运营讨论&#x27;,&#x27;原会话与消息历史&#x27;,&#x27;record&#x27;)}${row(&#x27;file-check&#x27;,&#x27;产品介绍稿&#x27;,&#x27;关联原发布事务 · 未提交&#x27;,&#x27;record&#x27;)}&lt;/div&gt;`:
            section===&#x27;运营&#x27;?`&lt;div class=&quot;s-section&quot;&gt;&lt;h2&gt;原稿与发布事务&lt;/h2&gt;&lt;div class=&quot;s-list&quot;&gt;${row(&#x27;file-text&#x27;,&#x27;产品介绍稿.md&#x27;,&#x27;运营 / 原稿 · 示例资料&#x27;,&#x27;record&#x27;)}${row(&#x27;file-check&#x27;,&#x27;产品介绍稿发布准备&#x27;,&#x27;打开原事务查看真实执行状态&#x27;,&#x27;publish&#x27;,&#x27;未提交&#x27;)}&lt;/div&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;进入文章发布&#x27;,&#x27;publish&#x27;,true,&#x27;file-check&#x27;)}&lt;/div&gt;&lt;/div&gt;`:

        }
        if (s.panel === &#x27;home&#x27;) return `&lt;p class=&quot;s-eyebrow&quot;&gt;个人资料与日常工作&lt;/p&gt;&lt;h1&gt;我的空间&lt;/h1&gt;&lt;p class=&quot;s-caption&quot;&gt;随手记录、继续对话，开始今天的工作。&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;新建笔记&#x27;,&#x27;note&#x27;,true,&#x27;square-pen&#x27;)}${button(&#x27;新建会话&#x27;,&#x27;sessions&#x27;,false,&#x27;message-square-plus&#x27;)}${button(&#x27;打开网页&#x27;,&#x27;browser&#x27;,false,&#x27;globe&#x27;)}&lt;/div&gt;&lt;section class=&quot;s-section&quot;&gt;&lt;div class=&quot;s-spread s-section-title&quot;&gt;&lt;h2&gt;继续上次的工作&lt;/h2&gt;&lt;span class=&quot;s-muted&quot;&gt;仅当前空间&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;s-list&quot;&gt;${row(&#x27;file-text&#x27;,&#x27;今日随记.md&#x27;,&#x27;个人笔记 · 示例内容&#x27;,&#x27;note&#x27;)}${row(&#x27;messages-square&#x27;,&#x27;阅读与想法&#x27;,&#x27;个人会话 · 示例内容&#x27;,&#x27;sessions&#x27;)}${row(&#x27;folder&#x27;,&#x27;资料收集&#x27;,&#x27;我的空间 / 资料&#x27;,&#x27;files&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;s-section&quot;&gt;&lt;h2&gt;公司经营&lt;/h2&gt;&lt;p class=&quot;s-caption&quot;&gt;经营资料保存在独立的公司空间。&lt;/p&gt;&lt;div class=&quot;s-actions&quot;&gt;${button(&#x27;进入我的公司&#x27;,&#x27;company&#x27;,false,&#x27;building-2&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;div class=&quot;s-location&quot;&gt;&lt;span class=&quot;s-flex&quot;&gt;${icon(&#x27;folder&#x27;)}个人资料位置&lt;/span&gt;&lt;p class=&quot;s-path&quot;&gt;~/CCLink Studio/我的空间&lt;/p&gt;&lt;/div&gt;`;

      }
      function modal(s) {
        if (!s.modal) return &#x27;&#x27;;
        let body=&#x27;&#x27;;

        if (s.modal===&#x27;location&#x27;) body=`&lt;p class=&quot;s-eyebrow&quot;&gt;${escape(labels[s.active])}&lt;/p&gt;&lt;h1&gt;资料位置&lt;/h1&gt;&lt;div class=&quot;s-location&quot;&gt;&lt;p class=&quot;s-path&quot;&gt;${escape(s.active===&#x27;company&#x27;?s.companyPath:&#x27;~/CCLink Studio/我的空间&#x27;)}&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;s-dialog-intro&quot;&gt;入口名称与资料目录分别管理。修改公司显示名称不会移动文件。&lt;/p&gt;&lt;div class=&quot;s-dialog-footer&quot;&gt;${button(&#x27;知道了&#x27;,&#x27;dismiss&#x27;,true)}&lt;/div&gt;`;
        if (s.modal===&#x27;business&#x27;) body=`&lt;h1&gt;创建业务项目&lt;/h1&gt;&lt;p class=&quot;s-dialog-intro&quot;&gt;在当前公司中组织目标、资料和关联账目。&lt;/p&gt;&lt;label class=&quot;s-field&quot;&gt;业务项目名称&lt;input aria-label=&quot;业务项目名称&quot; placeholder=&quot;例如：新产品研发&quot;&gt;&lt;/label&gt;&lt;div class=&quot;s-dialog-footer&quot;&gt;${button(&#x27;取消&#x27;,&#x27;dismiss&#x27;)}${button(&#x27;保存示意&#x27;,&#x27;sample-save&#x27;,true)}&lt;/div&gt;`;

      function render(el,s) {
        el.classList.toggle(&#x27;s-compact&#x27;,s.compact);
        const isCompany = s.active===&#x27;company&#x27;;

          &lt;header class=&quot;s-topbar&quot;&gt;&lt;div class=&quot;s-fixed&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;s-space cursor-interaction&quot; data-space=&quot;personal&quot; aria-pressed=&quot;${s.active===&#x27;personal&#x27;}&quot;&gt;${icon(&#x27;house&#x27;)}我的空间${icon(&#x27;pin&#x27;,&#x27;s-pin&#x27;)}&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;s-space cursor-interaction&quot; data-space=&quot;company&quot; aria-pressed=&quot;${isCompany}&quot;&gt;${icon(&#x27;building-2&#x27;)}我的公司${icon(&#x27;pin&#x27;,&#x27;s-pin&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;s-ordinary&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;s-project cursor-interaction&quot; data-space=&quot;project&quot; aria-pressed=&quot;${s.active===&#x27;project&#x27;}&quot;&gt;${icon(&#x27;folder&#x27;)}woniu-forward&lt;span class=&quot;s-close&quot; aria-hidden=&quot;true&quot;&gt;×&lt;/span&gt;&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;s-project s-project-secondary cursor-interaction&quot; data-action=&quot;project&quot;&gt;研发日记 &lt;span class=&quot;s-close&quot; aria-hidden=&quot;true&quot;&gt;×&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;s-top-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;s-icon cursor-interaction&quot; data-action=&quot;open&quot; aria-label=&quot;打开其他工作空间&quot; data-tooltip=&quot;打开其他工作空间&quot;&gt;${icon(&#x27;folder-plus&#x27;)}&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;s-icon cursor-interaction&quot; data-action=&quot;history&quot; aria-label=&quot;历史空间与未归档&quot; data-tooltip=&quot;历史空间与未归档&quot;&gt;${icon(&#x27;history&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;

x27;围绕这家公司继续工作&#x27;:s.active===&#x27;project&#x27;?&#x27;继续当前研发工作&#x27;:&#x27;从一个想法开始&#x27;}&lt;/h3&gt;&lt;p&gt;${isCompany?&#x27;引用公司资料、查看原记录，再决定下一步。&#x27;:&#x27;当前会话与产物归属 &#x27;+escape(labels[s.active])+&#x27;。&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;s-composer&quot;&gt;&lt;textarea aria-label=&quot;Agent 输入示意&quot; placeholder=&quot;输入想法，@ 引用资料&quot;&gt;&lt;/textarea&gt;&lt;div class=&quot;s-composer-foot&quot;&gt;&lt;span&gt;@ 资料&lt;/span&gt;&lt;span&gt;本地 Agent&lt;/span&gt;${icon(&#x27;arrow-up&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;small class=&quot;s-muted&quot;&gt;设计预览 · 不运行 Agent&lt;/small&gt;&lt;/aside&gt;&lt;/div&gt;
          &lt;footer class=&quot;s-status&quot;&gt;&lt;span&gt;本地 · ${escape(labels[s.active])}${isCompany?&#x27; · &#x27;+escape(s.companyName):&#x27;&#x27;}&lt;/span&gt;&lt;span&gt;示意界面 · 不读取或修改真实资料&lt;/span&gt;&lt;/footer&gt;${modal(s)}`;

          const target=event.target.closest(&#x27;button&#x27;); if(!target) return;
          const space=target.dataset.space; const nav=target.dataset.nav; const action=target.dataset.action; const section=target.dataset.section;

          else if(section){s.section=section;s.panel=section===&#x27;财务&#x27;?&#x27;finance&#x27;:&#x27;company&#x27;;}
          else if(action===&#x27;bind&#x27;){const chosen=el.querySelector(&#x27;input[type=&quot;radio&quot;]:checked&#x27;)?.value;s.companyPath=chosen===&#x27;other&#x27;?&#x27;~/Documents/研发日记&#x27;:&#x27;~/CCLink Studio/默认工作空间&#x27;;s.companyName=chosen===&#x27;other&#x27;?&#x27;研发公司资料&#x27;:&#x27;示例工作室&#x27;;s.bound=true;company();s.notice=&#x27;已关联原公司资料（示意）；目录与原记录保持原位。&#x27;;}
          else if(action===&#x27;create&#x27;){s.companyName=el.querySelector(&#x27;.s-company-name&#x27;)?.value.trim()||&#x27;我的公司&#x27;;s.companyPath=&#x27;~/CCLink Studio/我的公司&#x27;;s.bound=true;s.freshCompany=true;company();}
          else if(action===&#x27;legacy&#x27;){s.modal=&#x27;legacy&#x27;;}

          else if(action===&#x27;locate&#x27;){s.bound=true;company();s.notice=&#x27;示意：定位原目录后，继续使用原公司资料。&#x27;;}
          else if(action===&#x27;new-business&#x27;){s.modal=&#x27;business&#x27;;}
          else if(action===&#x27;compact&#x27;){s.compact=!s.compact;}
          else if([&#x27;note&#x27;,&#x27;files&#x27;,&#x27;sessions&#x27;,&#x27;browser&#x27;,&#x27;publish&#x27;].includes(action)){s.panel=action;}
          else if(action===&#x27;history&#x27;){s.notice=&#x27;历史空间保留普通目录与“未归档”入口；固定入口始终在顶栏。&#x27;;}
          else if(action===&#x27;open&#x27;){s.notice=&#x27;打开其他本地或远程工作空间，不改变两个固定入口的资料归属。&#x27;;}
          else if(action===&#x27;sample-save&#x27;){s.modal=null;s.notice=&#x27;此处演示原业务创建表单；效果图不保存真实业务。&#x27;;}

          render(el,s);save();

      });

        const saved=event.detail?.globals?.widgetState?.privateContent?.scenes;
        if(!saved)return;
        states.forEach((s,el)=&gt;{if(saved[el.dataset.scene] &amp;&amp; [&#x27;personal&#x27;,&#x27;company&#x27;,&#x27;project&#x27;].includes(saved[el.dataset.scene].active)){Object.assign(s,saved[el.dataset.scene]);render(el,s);}});
      });

  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
