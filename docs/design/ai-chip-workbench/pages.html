&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;script&gt;
(function(){
  const root=document.getElementById(&#x27;ai-chip-workbench-design&#x27;);

  const agent=root.querySelector(&#x27;#acw-agent-body&#x27;);
  const names=[&#x27;芯片项目总览&#x27;,&#x27;规格与架构&#x27;,&#x27;设计工作台&#x27;,&#x27;实验与运行&#x27;,&#x27;波形与比较&#x27;,&#x27;实现与硬件入口&#x27;];

  const button=(label,primary=false,disabled=false)=&gt;`&lt;span class=&quot;acw-button ${primary?&#x27;primary&#x27;:&#x27;&#x27;}&quot; ${disabled?&#x27;aria-disabled=&quot;true&quot;&#x27;:&#x27;&#x27;}&gt;${label}&lt;/span&gt;`;

  const field=(label,value)=&gt;`&lt;div class=&quot;acw-field&quot;&gt;&lt;label&gt;${label}&lt;/label&gt;&lt;div class=&quot;acw-value&quot;&gt;${value}&lt;/div&gt;&lt;/div&gt;`;
  const panel=(title,body,classes=&#x27;&#x27;)=&gt;`&lt;section class=&quot;acw-panel ${classes}&quot;&gt;&lt;h3&gt;${title}&lt;/h3&gt;${body}&lt;/section&gt;`;
  const head=(title,subtitle,actions=&#x27;&#x27;)=&gt;`&lt;div class=&quot;acw-page-head&quot;&gt;&lt;div&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;p&gt;${subtitle}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;acw-actions&quot;&gt;${actions}&lt;/div&gt;&lt;/div&gt;`;
  const table=(heads,rows)=&gt;`&lt;table class=&quot;acw-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;${heads.map(h=&gt;`&lt;th&gt;${h}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(r=&gt;`&lt;tr&gt;${r.map(v=&gt;`&lt;td&gt;${v}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;`;

  const architectureSvg=()=&gt;`&lt;svg class=&quot;acw-diagram&quot; viewBox=&quot;0 0 560 245&quot; role=&quot;img&quot; aria-label=&quot;芯片系统架构示意&quot;&gt;&lt;title&gt;芯片系统架构示意&lt;/title&gt;
    &lt;rect class=&quot;module&quot; x=&quot;26&quot; y=&quot;86&quot; width=&quot;105&quot; height=&quot;58&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;78&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;模拟输入&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;78&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;pulse_in&lt;/text&gt;
    &lt;rect class=&quot;node&quot; x=&quot;176&quot; y=&quot;52&quot; width=&quot;145&quot; height=&quot;126&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;248&quot; y=&quot;82&quot; text-anchor=&quot;middle&quot;&gt;忆阻器计算核心&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;248&quot; y=&quot;105&quot; text-anchor=&quot;middle&quot;&gt;M1 · 行为模型&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;248&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;状态量 w&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;248&quot; y=&quot;151&quot; text-anchor=&quot;middle&quot;&gt;模拟域&lt;/text&gt;
    &lt;rect class=&quot;module&quot; x=&quot;366&quot; y=&quot;86&quot; width=&quot;142&quot; height=&quot;58&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;437&quot; y=&quot;110&quot; text-anchor=&quot;middle&quot;&gt;感测与读出&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;437&quot; y=&quot;130&quot; text-anchor=&quot;middle&quot;&gt;response_out&lt;/text&gt;
    &lt;path class=&quot;signal-a&quot; d=&quot;M131 115H176&quot;/&gt;&lt;path class=&quot;signal-a&quot; d=&quot;M321 115H366&quot;/&gt;
    &lt;text class=&quot;muted-text&quot; x=&quot;26&quot; y=&quot;26&quot;&gt;HTS-001 → REQ-001 → ARCH-003（待用户确认）&lt;/text&gt;
    &lt;text class=&quot;muted-text&quot; x=&quot;26&quot; y=&quot;222&quot;&gt;当前仅为逻辑架构，不是可制造版图&lt;/text&gt;

  const circuitSvg=()=&gt;`&lt;svg class=&quot;acw-diagram&quot; viewBox=&quot;0 0 560 245&quot; role=&quot;img&quot; aria-label=&quot;忆阻器脉冲响应电路拓扑&quot;&gt;&lt;title&gt;忆阻器脉冲响应电路拓扑&lt;/title&gt;
    &lt;path class=&quot;wire&quot; d=&quot;M70 115H155M225 115H318M388 115H475V202H70V148M70 82V35H475V82&quot;/&gt;
    &lt;circle class=&quot;node&quot; cx=&quot;70&quot; cy=&quot;115&quot; r=&quot;28&quot;/&gt;&lt;text x=&quot;70&quot; y=&quot;111&quot; text-anchor=&quot;middle&quot;&gt;V1&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;70&quot; y=&quot;129&quot; text-anchor=&quot;middle&quot;&gt;PULSE&lt;/text&gt;
    &lt;rect class=&quot;node&quot; x=&quot;155&quot; y=&quot;94&quot; width=&quot;70&quot; height=&quot;42&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;190&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot;&gt;M1&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;190&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot;&gt;MEM-A&lt;/text&gt;
    &lt;rect class=&quot;module&quot; x=&quot;318&quot; y=&quot;94&quot; width=&quot;70&quot; height=&quot;42&quot; rx=&quot;4&quot;/&gt;&lt;text x=&quot;353&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;R1 1k&lt;/text&gt;
    &lt;path class=&quot;wire&quot; d=&quot;M458 83H492M458 147H492M475 83V102M475 128V147&quot;/&gt;&lt;text x=&quot;475&quot; y=&quot;120&quot; text-anchor=&quot;middle&quot;&gt;C1&lt;/text&gt;
    &lt;circle cx=&quot;270&quot; cy=&quot;115&quot; r=&quot;5&quot; fill=&quot;var(--acw-accent)&quot;/&gt;&lt;text class=&quot;muted-text&quot; x=&quot;270&quot; y=&quot;91&quot; text-anchor=&quot;middle&quot;&gt;V(out)&lt;/text&gt;
    &lt;text class=&quot;muted-text&quot; x=&quot;20&quot; y=&quot;23&quot;&gt;模板化拓扑 · 参数可编辑 · 生成网表可检查&lt;/text&gt;
  &lt;/svg&gt;`;

  const waveformSvg=()=&gt;`&lt;svg class=&quot;acw-diagram&quot; viewBox=&quot;0 0 650 245&quot; role=&quot;img&quot; aria-label=&quot;两次运行的示意波形对比&quot;&gt;&lt;title&gt;两次运行的示意波形对比&lt;/title&gt;
    &lt;path class=&quot;wire&quot; d=&quot;M58 24V205H625&quot;/&gt;&lt;path class=&quot;wire&quot; opacity=&quot;.25&quot; d=&quot;M58 70H625M58 115H625M58 160H625&quot;/&gt;
    &lt;path class=&quot;signal-a&quot; d=&quot;M58 182L118 181L142 62L167 50L205 91L250 168L285 181L330 180L354 64L380 52L419 95L464 170L505 181L550 180L575 68L605 58L625 82&quot;/&gt;
    &lt;path class=&quot;signal-b&quot; d=&quot;M58 187L118 186L145 78L171 66L210 110L252 176L286 187L330 186L358 80L384 68L423 113L468 178L506 187L550 186L580 84L610 72L625 94&quot;/&gt;
    &lt;text x=&quot;74&quot; y=&quot;20&quot;&gt;Run A · Ron=1.0 kΩ&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;20&quot;&gt;Run B · Ron=1.2 kΩ&lt;/text&gt;
    &lt;text class=&quot;muted-text&quot; x=&quot;18&quot; y=&quot;28&quot;&gt;V&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;52&quot; y=&quot;225&quot;&gt;0&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;315&quot; y=&quot;225&quot;&gt;50&lt;/text&gt;&lt;text class=&quot;muted-text&quot; x=&quot;585&quot; y=&quot;225&quot;&gt;100 ms&lt;/text&gt;
    &lt;path class=&quot;wire&quot; d=&quot;M68 232H94&quot;/&gt;&lt;text class=&quot;muted-text&quot; x=&quot;101&quot; y=&quot;236&quot;&gt;时间&lt;/text&gt;
  &lt;/svg&gt;`;

  const pageOverview=()=&gt;head(&#x27;memristor-pulse&#x27;,&#x27;小型忆阻器脉冲响应电路 · 本地芯片项目&#x27;,button(&#x27;导入 HTS&#x27;)+button(&#x27;继续设计&#x27;,true))+`
    &lt;div class=&quot;acw-flow&quot;&gt;
      &lt;div class=&quot;acw-stage&quot;&gt;&lt;strong&gt;1 需求&lt;/strong&gt;&lt;small&gt;4 项已确认&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;acw-stage is-current&quot;&gt;&lt;strong&gt;2 架构&lt;/strong&gt;&lt;small&gt;1 项待审查&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;acw-stage&quot;&gt;&lt;strong&gt;3 设计&lt;/strong&gt;&lt;small&gt;模板已创建&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;acw-stage&quot;&gt;&lt;strong&gt;4 验证&lt;/strong&gt;&lt;small&gt;尚无真实运行&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;acw-stage&quot;&gt;&lt;strong&gt;5 实现&lt;/strong&gt;&lt;small&gt;入口未解锁&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;acw-grid&quot; style=&quot;margin-top:11px&quot;&gt;
      ${panel(&#x27;下一步&#x27;,row(&#x27;审查架构建议&#x27;,&#x27;ARCH-003 基于需求 revision 4&#x27;,&#x27;待用户确认&#x27;,&#x27;warn&#x27;)+row(&#x27;准备首次瞬态实验&#x27;,&#x27;需要确认 Testbench 和工具环境&#x27;,&#x27;未开始&#x27;))}
      ${panel(&#x27;工具环境&#x27;,row(&#x27;ngspice&#x27;,&#x27;/opt/homebrew/bin/ngspice · v45&#x27;,&#x27;已探测&#x27;,&#x27;good&#x27;)+row(&#x27;Xyce&#x27;,&#x27;首版不启用&#x27;,&#x27;未配置&#x27;)+row(&#x27;RTL / FPGA / PDK&#x27;,&#x27;仅保留架构入口&#x27;,&#x27;未接入&#x27;))}

      ${panel(&#x27;证据缺口&#x27;,row(&#x27;REQ-001 脉冲响应&#x27;,&#x27;已有参考向量，尚无 ToolRun&#x27;,&#x27;未验证&#x27;,&#x27;warn&#x27;)+row(&#x27;模型 MEM-A&#x27;,&#x27;来源已填，golden case 待运行&#x27;,&#x27;待验证&#x27;,&#x27;warn&#x27;)+row(&#x27;可制造性&#x27;,&#x27;无 PDK / DRC / LVS 证据&#x27;,&#x27;不可声明&#x27;,&#x27;bad&#x27;))}
    &lt;/div&gt;`;

  const pageArchitecture=()=&gt;head(&#x27;规格与架构&#x27;,&#x27;HTS 导入形成候选，只有用户确认后才成为架构基线。&#x27;,button(&#x27;导入 HTS&#x27;)+button(&#x27;生成架构建议&#x27;)+button(&#x27;确认 revision 3&#x27;,true))+`
    &lt;div class=&quot;acw-split wide-left&quot;&gt;

        ${panel(&#x27;需求&#x27;,`&lt;div class=&quot;acw-list&quot;&gt;&lt;div class=&quot;acw-list-item is-selected&quot;&gt;REQ-001 · 脉冲响应&lt;small&gt;来自 HTS-FUNC-001 · 有参考向量&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;acw-list-item&quot;&gt;REQ-002 · 输入范围&lt;small&gt;0–0.5 V · 单位已确认&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;acw-list-item&quot;&gt;REQ-003 · 输出误差&lt;small&gt;NRMSE ≤ 0.05 · 待验证&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;`)}
