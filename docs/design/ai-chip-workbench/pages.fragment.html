<style>

<script>
(function(){
  const root=document.getElementById('ai-chip-workbench-design');
  const screen=root.querySelector('#acw-screen');
  const picker=root.querySelector('#acw-page');
  const agent=root.querySelector('#acw-agent-body');
  const names=['芯片项目总览','规格与架构','设计工作台','实验与运行','波形与比较','实现与硬件入口'];

  const button=(label,primary=false,disabled=false)=>`<span class="acw-button ${primary?'primary':''}" ${disabled?'aria-disabled="true"':''}>${label}</span>`;

  const row=(title,detail,status,tone='')=>`<div class="acw-row"><div>${title}<small>${detail}</small></div><span class="acw-status"><i class="acw-dot ${tone}"></i>${status}</span></div>`;
  const field=(label,value)=>`<div class="acw-field"><label>${label}</label><div class="acw-value">${value}</div></div>`;
  const panel=(title,body,classes='')=>`<section class="acw-panel ${classes}"><h3>${title}</h3>${body}</section>`;
  const head=(title,subtitle,actions='')=>`<div class="acw-page-head"><div><h2>${title}</h2><p>${subtitle}</p></div><div class="acw-actions">${actions}</div></div>`;
  const table=(heads,rows)=>`<table class="acw-table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  const architectureSvg=()=>`<svg class="acw-diagram" viewBox="0 0 560 245" role="img" aria-label="芯片系统架构示意"><title>芯片系统架构示意</title>
    <rect class="module" x="26" y="86" width="105" height="58" rx="5"/><text x="78" y="110" text-anchor="middle">模拟输入</text><text class="muted-text" x="78" y="130" text-anchor="middle">pulse_in</text>
    <rect class="node" x="176" y="52" width="145" height="126" rx="5"/><text x="248" y="82" text-anchor="middle">忆阻器计算核心</text><text class="muted-text" x="248" y="105" text-anchor="middle">M1 · 行为模型</text><text class="muted-text" x="248" y="128" text-anchor="middle">状态量 w</text><text class="muted-text" x="248" y="151" text-anchor="middle">模拟域</text>
    <rect class="module" x="366" y="86" width="142" height="58" rx="5"/><text x="437" y="110" text-anchor="middle">感测与读出</text><text class="muted-text" x="437" y="130" text-anchor="middle">response_out</text>
    <path class="signal-a" d="M131 115H176"/><path class="signal-a" d="M321 115H366"/>
    <text class="muted-text" x="26" y="26">HTS-001 → REQ-001 → ARCH-003（待用户确认）</text>
    <text class="muted-text" x="26" y="222">当前仅为逻辑架构，不是可制造版图</text>
  </svg>`;

  const circuitSvg=()=>`<svg class="acw-diagram" viewBox="0 0 560 245" role="img" aria-label="忆阻器脉冲响应电路拓扑"><title>忆阻器脉冲响应电路拓扑</title>
    <path class="wire" d="M70 115H155M225 115H318M388 115H475V202H70V148M70 82V35H475V82"/>
    <circle class="node" cx="70" cy="115" r="28"/><text x="70" y="111" text-anchor="middle">V1</text><text class="muted-text" x="70" y="129" text-anchor="middle">PULSE</text>
    <rect class="node" x="155" y="94" width="70" height="42" rx="4"/><text x="190" y="112" text-anchor="middle">M1</text><text class="muted-text" x="190" y="128" text-anchor="middle">MEM-A</text>
    <rect class="module" x="318" y="94" width="70" height="42" rx="4"/><text x="353" y="120" text-anchor="middle">R1 1k</text>

  const waveformSvg=()=>`<svg class="acw-diagram" viewBox="0 0 650 245" role="img" aria-label="两次运行的示意波形对比"><title>两次运行的示意波形对比</title>

    <path class="signal-a" d="M58 182L118 181L142 62L167 50L205 91L250 168L285 181L330 180L354 64L380 52L419 95L464 170L505 181L550 180L575 68L605 58L625 82"/>
    <path class="signal-b" d="M58 187L118 186L145 78L171 66L210 110L252 176L286 187L330 186L358 80L384 68L423 113L468 178L506 187L550 186L580 84L610 72L625 94"/>
    <text x="74" y="20">Run A · Ron=1.0 kΩ</text><text x="270" y="20">Run B · Ron=1.2 kΩ</text>
    <text class="muted-text" x="18" y="28">V</text><text class="muted-text" x="52" y="225">0</text><text class="muted-text" x="315" y="225">50</text><text class="muted-text" x="585" y="225">100 ms</text>
    <path class="wire" d="M68 232H94"/><text class="muted-text" x="101" y="236">时间</text>
  </svg>`;

  const pageOverview=()=>head('memristor-pulse','小型忆阻器脉冲响应电路 · 本地芯片项目',button('导入 HTS')+button('继续设计',true))+`
    <div class="acw-flow">
      <div class="acw-stage"><strong>1 需求</strong><small>4 项已确认</small></div>
      <div class="acw-stage is-current"><strong>2 架构</strong><small>1 项待审查</small></div>
      <div class="acw-stage"><strong>3 设计</strong><small>模板已创建</small></div>
      <div class="acw-stage"><strong>4 验证</strong><small>尚无真实运行</small></div>
      <div class="acw-stage"><strong>5 实现</strong><small>入口未解锁</small></div>
    </div>
    <div class="acw-grid" style="margin-top:11px">
      ${panel('下一步',row('审查架构建议','ARCH-003 基于需求 revision 4','待用户确认','warn')+row('准备首次瞬态实验','需要确认 Testbench 和工具环境','未开始'))}
      ${panel('工具环境',row('ngspice','/opt/homebrew/bin/ngspice · v45','已探测','good')+row('Xyce','首版不启用','未配置')+row('RTL / FPGA / PDK','仅保留架构入口','未接入'))}
      ${panel('最近运行',`<div class="acw-empty"><div><i data-lucide="activity" aria-hidden="true"></i><br>还没有真实工具运行<br><small>先确认架构和 Testbench，再开始首次仿真。</small></div></div>`)}
      ${panel('证据缺口',row('REQ-001 脉冲响应','已有参考向量，尚无 ToolRun','未验证','warn')+row('模型 MEM-A','来源已填，golden case 待运行','待验证','warn')+row('可制造性','无 PDK / DRC / LVS 证据','不可声明','bad'))}
    </div>`;

  const pageArchitecture=()=>head('规格与架构','HTS 导入形成候选，只有用户确认后才成为架构基线。',button('导入 HTS')+button('生成架构建议')+button('确认 revision 3',true))+`
    <div class="acw-split wide-left">
      <div class="acw-grid">
        ${panel('系统架构',architectureSvg(),'wide')}
        ${panel('需求',`<div class="acw-list"><div class="acw-list-item is-selected">REQ-001 · 脉冲响应<small>来自 HTS-FUNC-001 · 有参考向量</small></div><div class="acw-list-item">REQ-002 · 输入范围<small>0–0.5 V · 单位已确认</small></div><div class="acw-list-item">REQ-003 · 输出误差<small>NRMSE ≤ 0.05 · 待验证</small></div></div>`)}
        ${panel('追踪关系',table(['需求','模块','验证'],[['REQ-001','mem-core','VC-001'],['REQ-002','input','VC-001'],['REQ-003','readout','VC-002']]))}
      </div>
      ${panel('AI Proposal · ARCH-003',field('基于','需求 revision 4 · HTS revision 3')+field('建议','把刺激输入、忆阻器核心、读出分为三个模块')+field('假设','MEM-A 可在 0–0.5 V 范围内使用')+`<div class="acw-warning">模型适用范围仍需 golden case 证明，不能随架构确认自动通过。</div><div class="acw-actions" style="margin-top:10px">${button('拒绝')}${button('查看差异')}${button('采用并编辑',true)}</div>`) }
    </div>`;

  const pageDesign=()=>head('设计工作台','pulse-response.schematic.json · revision 7 · 有未运行改动',button('结构检查')+button('保存')+button('创建 Testbench',true))+`
    <div class="acw-split wide-left">
      <div class="acw-panel flush">
        <div class="acw-toolbar"><span class="acw-tool">拓扑预览</span><span class="acw-tool">生成网表</span><span class="acw-tool">问题 1</span><span class="acw-tool">只读证据</span></div>
        ${circuitSvg()}
        <div class="acw-code"><span class="kw">* generated by cclink ngspice adapter</span>
V1 in 0 PULSE(0 0.5 0 10u 10u 2m 20m)
XM1 in out memristor_a PARAMS: RON=1k ROFF=100k
R1 out 0 1k
C1 out 0 10n
<span class="changed">.tran 10u 100m</span></div>
      </div>
      <div>
        ${panel('M1 · 忆阻器',field('模型','MEM-A · revision 2')+field('低阻状态','1.0 kΩ')+field('高阻状态','100 kΩ')+field('初始状态','w = 0.20')+button('查看来源与适用范围'))}
        <div style="height:10px"></div>
        ${panel('设计问题',row('模型 golden case','尚未运行真实求解器','阻止验证','warn')+row('电气拓扑','无悬空节点','通过','good'))}
      </div>
    </div>`;

  const pageRun=()=>head('实验与运行','pulse-response.experiment.yaml · 首次真实运行前检查',button('保存实验')+button('开始运行',true))+`
    <div class="acw-grid">
      ${panel('Testbench',field('分析','Transient · 0–100 ms')+field('刺激','0–0.5 V · 2 ms / 20 ms')+field('观测','V(in), V(out), I(M1), w(M1)')+field('用例','VC-001 · 脉冲响应'))}
      ${panel('运行前检查',row('输入快照','设计 r7 · 模型 r2 · Testbench r3','可冻结','good')+row('工具','ngspice 45 · adapter 0.1','示意 ready','good')+row('输出目录','runs/run-20261010-001','可写','good')+row('验证容差','NRMSE ≤ 0.05','已定义','good'))}
      ${panel('真实执行步骤',`<div class="acw-steps"><div class="acw-step"><span class="acw-step-index">1</span><span>冻结输入与计算哈希</span>${badge('已完成','good')}</div><div class="acw-step"><span class="acw-step-index">2</span><span>生成受控 SPICE 网表</span>${badge('已完成','good')}</div><div class="acw-step is-active"><span class="acw-step-index">3</span><span>启动 ngspice 外部进程</span>${badge('运行中','warn')}</div><div class="acw-step"><span class="acw-step-index">4</span><span>校验并解析 raw 输出</span>${badge('等待')}</div><div class="acw-step"><span class="acw-step-index">5</span><span>计算验证用例</span>${badge('等待')}</div></div><div class="acw-actions" style="margin-top:9px">${button('取消运行')}</div>`)}
      ${panel('工具日志',`<div class="acw-log">[tool] ngspice 45
[adapter] input manifest sha256: 4c2…e91
[run] transient analysis started
[run] 4,000 / 10,000 points
[notice] 当前为页面示意，不是真实进程输出</div>`)}
    </div>`;

  const pageWaveform=()=>head('波形与比较','Run A 与 Run B · 相同 Testbench · 参数 Ron 不同',button('选择运行')+button('保存比较报告',true))+`
    <div class="acw-grid">
      ${panel('V(out) · 两次运行叠加',waveformSvg(),'wide')}
      ${panel('比较度量',table(['度量','Run A','Run B','差异'],[['峰值','0.48 V','0.43 V','−10.4%'],['稳定时间','8.1 ms','9.6 ms','+1.5 ms'],['NRMSE vs REF','0.032','0.061',badge('B 失败','warn')]]))}
      ${panel('验证结果',row('VC-001 · Run A','全部必需断言有真实数据','Passed','good')+row('VC-001 · Run B','NRMSE 超过 0.05','Failed','bad')+row('可制造性','未运行 PPA / DRC / LVS / STA','无结论'))}
      ${panel('证据',field('Run A','run-20261010-001 · design r7')+field('Run B','run-20261010-002 · design r8')+field('共同环境','ngspice 45 · adapter 0.1 · parser 0.1')+field('原始输出','2 个 rawfile + SHA-256'),'wide')}
    </div>`;

  const pageImplementation=()=>head('实现与硬件入口','验证结果可以进入后续路径，但首版不执行这些流程。',button('创建实现草案',false,true))+`
    <div class="acw-grid">
      ${panel('数字 RTL 与综合',badge('架构入口')+`<div class="acw-gate"><strong>进入条件</strong><ul><li>数字模块与接口已确认</li><li>RTL Testbench 回归通过</li><li>固定综合与 STA 适配器</li></ul></div>${button('尚未接入',false,true)}`)}
      ${panel('芯片物理设计',badge('无制造结论','warn')+`<div class="acw-gate"><strong>进入条件</strong><ul><li>明确工艺与 PDK 授权</li><li>布局／提取／DRC／LVS 工具</li><li>corner 与 signoff 标准</li></ul></div>${button('尚未接入',false,true)}`)}
      ${panel('FPGA',badge('无板卡连接')+`<div class="acw-gate"><strong>进入条件</strong><ul><li>选定 part／board 与约束</li><li>真实工具链和 bitstream</li><li>下载确认与采样协议</li></ul></div>${button('尚未接入',false,true)}`)}
      ${panel('真实忆阻器阵列',badge('需要安全评审','warn')+`<div class="acw-gate"><strong>进入条件</strong><ul><li>独立 HardwareConnection owner</li><li>电压、电流、量程与限流</li><li>设备身份、校准与人工确认</li></ul></div>${button('尚未接入',false,true)}`)}
      ${panel('当前可证明的结论',`<div class="acw-warning">只有 Run A 的指定瞬态用例通过。没有 PPA、STA、DRC、LVS、版图后仿真、FPGA 或硬件测量证据。</div>`,'wide')}
    </div>`;

  const pages=[pageOverview,pageArchitecture,pageDesign,pageRun,pageWaveform,pageImplementation];
  const agentMessages=[
    `<div class="acw-agent-msg"><strong>下一步建议</strong>先审查 ARCH-003 的模型适用范围，再创建首次实验。<span class="acw-link">引用：REQ r4 · ARCH-003</span></div>`,
    `<div class="acw-agent-msg"><strong>架构建议</strong>三个模块足以完成首版闭环；不要加入 RTL 控制器。<span class="acw-link">查看 Proposal 差异</span></div>`,
    `<div class="acw-agent-msg"><strong>设计诊断</strong>拓扑检查通过，但 MEM-A 的 golden case 尚未运行。生成网表不代表仿真通过。</div>`,
    `<div class="acw-agent-msg"><strong>运行边界</strong>状态由 ToolRunService 和真实进程返回。我可以解释日志，但不能把当前示意标成成功。</div>`,
    `<div class="acw-agent-msg"><strong>比较假设</strong>Run B 峰值下降与 Ron 增大一致；还需用额外参数点验证是否为单调关系。<span class="acw-link">引用：Run A / Run B</span></div>`,
    `<div class="acw-agent-msg"><strong>阶段门</strong>现有证据不足以声明芯片可制造。需要具体 PDK、DRC、LVS、STA 或硬件结果。</div>`
  ];

  let current=0;
  root.querySelector('#acw-nav').innerHTML='<div class="acw-nav-title">AI 芯片</div>'+names.map((name,index)=>`<button type="button" class="cursor-interaction" data-page="${index}">${name}</button>`).join('')+'<div class="acw-tree"><strong>memristor-pulse</strong><br>▾ requirements<br>▾ architecture<br>▾ models<br>▾ schematics<br>▾ testbenches<br>▾ runs<br>　README.md</div>';

  function render(index){
    current=Math.max(0,Math.min(names.length-1,index));
    picker.selectedIndex=current;
    root.querySelector('#acw-tab-title').textContent=names[current];
    root.querySelectorAll('[data-page]').forEach(button=>button.setAttribute('aria-current',Number(button.dataset.page)===current?'page':'false'));
    screen.innerHTML=pages[current]()+`<div class="acw-next"><button type="button" class="cursor-interaction" data-move="-1" ${current===0?'disabled':''}>← 上一页</button><span>${current+1} / ${names.length}</span><button type="button" class="cursor-interaction" data-move="1" ${current===names.length-1?'disabled':''}>下一页 →</button></div>`;
    agent.innerHTML=agentMessages[current];
    if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});
  }

  function save(){
    if(window.openai&&window.openai.setWidgetState){
      window.openai.setWidgetState({modelContent:{page:names[current]},privateContent:{pageIndex:current}}).catch(()=>{});
    }
  }

  picker.addEventListener('change',()=>{render(picker.selectedIndex);save();});
  root.addEventListener('click',event=>{
    const target=event.target.closest('[data-page],[data-move]');
    if(!target)return;
    if(target.disabled)return;
    render(target.hasAttribute('data-page')?Number(target.dataset.page):current+Number(target.dataset.move));
    save();
  });

  const initial=window.openai&&window.openai.widgetState;
  render(initial&&initial.privateContent&&Number.isInteger(initial.privateContent.pageIndex)?initial.privateContent.pageIndex:0);
  window.addEventListener('openai:set_globals',event=>{
    const state=event.detail&&event.detail.globals&&event.detail.globals.widgetState;
    if(state&&state.privateContent&&Number.isInteger(state.privateContent.pageIndex))render(state.privateContent.pageIndex);
  });
})();
</script>
