<div id="neural-lab-design">
  <div class="design-picker"><span>页面效果示意</span><select aria-label="选择页面" id="lab-page"><option>实验室首页</option><option>神经网络</option><option>器件与模型</option><option>电路设计</option><option>实验配置</option><option>仿真与结果</option><option>芯片设计</option><option>FPGA 与硬件</option><option>实验记录</option></select><span class="design-note">概念设计 · 所有数据为示意</span></div>
  <div class="studio-window">
    <header><span class="brand">CCLink Studio</span><span>线虫忆阻器研究 / 本地工作空间</span><span class="local">免登录 · 本地</span></header>
    <div class="studio-body">
      <aside class="activity"><i data-lucide="files"></i><i data-lucide="globe"></i><div class="active-icon"><i data-lucide="circuit-board"></i></div><i data-lucide="terminal"></i><i data-lucide="bot"></i></aside>
      <nav aria-label="实验室页面" id="lab-nav"></nav>
      <main><div class="tabline"><span id="tab-title">实验室首页</span><span>产品设计预览</span></div><div id="lab-screen" aria-live="polite"></div></main>
    </div>
    <footer><span>神经电路实验室</span><span>示意模型 · 非真实仿真结果</span><span>Studio 工作台</span></footer>
  </div>
</div>
<style>
#neural-lab-design{--lab-bg:light-dark(#f8f9fb,#181b21);--lab-panel:light-dark(#ffffff,#20242c);--lab-sub:light-dark(#eef0f4,#252a33);--lab-text:light-dark(#27313e,#e1e6ef);--lab-muted:light-dark(#657184,#a0adbf);--lab-border:light-dark(#dce1e9,#353d49);--lab-blue:light-dark(#246aca,#72aaff);--lab-green:light-dark(#187954,#6ad2a4);--lab-orange:light-dark(#986216,#e4b671);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--lab-text)}
#neural-lab-design *{box-sizing:border-box}#neural-lab-design button,#neural-lab-design input,#neural-lab-design select{font:inherit;color:inherit}#neural-lab-design .design-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}#neural-lab-design select{background:var(--lab-panel);border:1px solid var(--lab-border);border-radius:5px;padding:7px 10px}#neural-lab-design .design-note{color:var(--lab-muted);font-size:12px}#neural-lab-design .studio-window{background:var(--lab-bg);border:1px solid var(--lab-border);border-radius:9px;overflow:hidden}#neural-lab-design header{display:flex;gap:22px;align-items:center;padding:12px 16px;background:var(--lab-sub);font-size:12px;border-bottom:1px solid var(--lab-border)}#neural-lab-design .brand{font-weight:600}#neural-lab-design .local{margin-left:auto;color:var(--lab-green)}#neural-lab-design .studio-body{display:grid;grid-template-columns:44px 164px minmax(0,1fr)}#neural-lab-design .activity{background:var(--lab-sub);display:flex;flex-direction:column;align-items:center;gap:24px;padding:20px 0;color:var(--lab-muted)}#neural-lab-design .active-icon{color:var(--lab-blue)}#neural-lab-design nav{padding:14px 8px;border-right:1px solid var(--lab-border);background:var(--lab-panel)}#neural-lab-design .nav-head{padding:0 8px 12px;font-size:12px;color:var(--lab-muted)}#neural-lab-design nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:4px;margin:2px 0}#neural-lab-design nav button[aria-current="page"]{background:var(--lab-sub);color:var(--lab-blue)}#neural-lab-design .small-tree{padding:15px 8px;border-top:1px solid var(--lab-border);margin-top:18px;font-size:12px;color:var(--lab-muted);line-height:2}#neural-lab-design main{min-width:0}#neural-lab-design .tabline{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--lab-panel);border-bottom:1px solid var(--lab-border);font-size:12px}#neural-lab-design .tabline span:last-child{color:var(--lab-muted)}#neural-lab-design #lab-screen{padding:20px;min-height:530px}#neural-lab-design h2{font-size:21px;margin:0;font-weight:600}#neural-lab-design h3{font-size:14px;margin:0 0 12px;font-weight:600}#neural-lab-design p{margin:7px 0 18px;color:var(--lab-muted);font-size:12px}#neural-lab-design .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}#neural-lab-design .actions{display:flex;gap:7px;flex-wrap:wrap}#neural-lab-design .action{display:inline-block;padding:6px 10px;border:1px solid var(--lab-border);border-radius:5px;background:var(--lab-panel);font-size:12px}#neural-lab-design .action.primary{background:var(--lab-blue);color:light-dark(#fff,#101827);border-color:transparent}#neural-lab-design .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#neural-lab-design .panel{background:var(--lab-panel);border:1px solid var(--lab-border);border-radius:6px;padding:15px;min-width:0}#neural-lab-design .wide{grid-column:1/-1}#neural-lab-design .split{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px}#neural-lab-design .item{padding:11px 0;border-bottom:1px solid var(--lab-border)}#neural-lab-design .item:last-child{border:0}#neural-lab-design .muted{color:var(--lab-muted);font-size:12px}#neural-lab-design .tag{display:inline-block;padding:2px 7px;border-radius:4px;background:var(--lab-sub);font-size:11px;color:var(--lab-muted)}#neural-lab-design .ok{color:var(--lab-green)}#neural-lab-design .warning{color:var(--lab-orange)}#neural-lab-design .field{margin-bottom:13px}#neural-lab-design .field label{display:block;color:var(--lab-muted);font-size:12px;margin-bottom:5px}#neural-lab-design .value{padding:7px 9px;border:1px solid var(--lab-border);border-radius:4px;background:var(--lab-bg)}#neural-lab-design svg.diagram{display:block;width:100%;height:280px;background:var(--lab-bg);border-radius:4px;color:var(--lab-text)}#neural-lab-design svg text{font:12px -apple-system,sans-serif;fill:var(--lab-text)}#neural-lab-design svg .wire{stroke:var(--lab-muted);stroke-width:1.5;fill:none}#neural-lab-design svg .signal{stroke:var(--lab-blue);stroke-width:2;fill:none}#neural-lab-design svg .reference{stroke:var(--lab-green);stroke-width:2;fill:none;stroke-dasharray:5 4}#neural-lab-design svg .node{fill:var(--lab-panel);stroke:var(--lab-blue);stroke-width:2}#neural-lab-design table{width:100%;border-collapse:collapse;font-size:12px}#neural-lab-design td,#neural-lab-design th{padding:10px 7px;text-align:left;border-bottom:1px solid var(--lab-border);overflow-wrap:anywhere}#neural-lab-design th{color:var(--lab-muted);font-weight:400}#neural-lab-design .timeline{margin-top:14px;padding:10px;background:var(--lab-sub);font-size:12px}#neural-lab-design .track{height:5px;background:var(--lab-border);margin:8px 0}#neural-lab-design .track div{height:100%;width:42%;background:var(--lab-blue)}#neural-lab-design footer{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;background:var(--lab-sub);font-size:11px;color:var(--lab-muted);flex-wrap:wrap}#neural-lab-design .code{font:12px/1.8 ui-monospace,monospace;background:var(--lab-bg);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}#neural-lab-design .flow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#neural-lab-design .flow span{background:var(--lab-sub);padding:9px;border-radius:4px;font-size:12px}#neural-lab-design .empty{padding:30px 15px;text-align:center;background:var(--lab-bg);border:1px dashed var(--lab-border);border-radius:4px}#neural-lab-design .page-next{display:flex;justify-content:space-between;margin-top:15px}#neural-lab-design .page-next button{padding:6px 12px;background:var(--lab-panel);border:1px solid var(--lab-border);border-radius:4px}
@media(max-width:800px){#neural-lab-design .studio-body{grid-template-columns:36px 130px minmax(0,1fr)}#neural-lab-design .split{grid-template-columns:1fr}#neural-lab-design #lab-screen{padding:14px}#neural-lab-design .grid{grid-template-columns:1fr}}
@media(max-width:520px){#neural-lab-design .studio-body{display:block}#neural-lab-design .activity{display:none}#neural-lab-design nav{display:none}#neural-lab-design header{flex-wrap:wrap;gap:5px 12px}#neural-lab-design .local{margin-left:0}#neural-lab-design svg.diagram{height:240px}#neural-lab-design .tabline span:last-child{display:none}}
</style>
<script>
(function(){
const root=document.getElementById('neural-lab-design'),screen=root.querySelector('#lab-screen'),picker=root.querySelector('#lab-page');
const names=['实验室首页','神经网络','器件与模型','电路设计','实验配置','仿真与结果','芯片设计','FPGA 与硬件','实验记录'];
const action=(t,p=false)=>`<span class="action ${p?'primary':''}">${t}</span>`;
const field=(a,b)=>`<div class="field"><label>${a}</label><div class="value">${b}</div></div>`;
const panel=(a,b,c='')=>`<section class="panel ${c}"><h3>${a}</h3>${b}</section>`;
const item=(a,b)=>`<div class="item">${a}<div class="muted">${b}</div></div>`;
const toolbar=(a,b,buttons)=>`<div class="toolbar"><div><h2>${a}</h2><p>${b}</p></div><div class="actions">${buttons||''}</div></div>`;
const table=(heads,rows)=>`<table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const svg=(body,label)=>`<svg class="diagram" viewBox="0 0 500 280" role="img" aria-label="${label}"><title>${label}</title>${body}</svg>`;
const network=()=>{const nodes=[['感觉 A',65,75],['感觉 B',65,200],['中间 A',205,60],['中间 B',205,145],['中间 C',205,225],['运动 A',360,95],['运动 B',360,200]];const edges=[[0,2],[0,3],[1,3],[1,4],[2,5],[3,5],[3,6],[4,6],[2,3],[5,6]];return svg(edges.map(([a,b])=>`<path class="wire" d="M${nodes[a][1]},${nodes[a][2]} L${nodes[b][1]},${nodes[b][2]}"/>`).join('')+nodes.map(([n,x,y],i)=>`<circle class="node" cx="${x}" cy="${y}" r="19" ${i===3?'style="fill:var(--lab-blue)"':''}/><text x="${x}" y="${y+38}" text-anchor="middle">${n}</text>`).join('')+'<text x="18" y="22">局部回路 · 示例连接</text>','神经回路示意，非真实连接组');};
const waveform=()=>svg('<path class="wire" d="M50 25V235H480"/><path class="wire" style="opacity:.2" d="M50 80H480M50 130H480M50 180H480"/><path class="reference" d="M50 190L100 190L125 80L155 60L195 140L240 185L285 190L310 85L340 65L380 145L430 185L480 190"/><path class="signal" d="M50 193L100 193L130 90L160 70L200 150L245 189L285 193L315 95L345 75L385 153L435 189L480 193"/><text x="15" y="25">V</text><text x="42" y="253">0</text><text x="235" y="253">50</text><text x="445" y="253">100 ms</text><text x="80" y="25">实线：电路模型</text><text x="265" y="25">虚线：参考模型</text>','示意电压波形对比，非实测数据');
const circuit=()=>svg('<path class="wire" d="M55 140H140M205 140H280M340 140H430V225H55V165M55 115V60H430V115"/><circle class="node" cx="55" cy="140" r="25"/><text x="55" y="145" text-anchor="middle">V1</text><rect x="140" y="121" width="65" height="38" rx="3" class="node"/><text x="172" y="145" text-anchor="middle">M1</text><rect x="280" y="121" width="60" height="38" rx="3" class="node"/><text x="310" y="145" text-anchor="middle">R1</text><path class="wire" d="M415 115H445M415 165H445M430 115V135M430 145V165"/><circle cx="240" cy="140" r="4" style="fill:var(--lab-blue)"/><text x="240" y="110" text-anchor="middle">测量点 n_out</text><text x="172" y="185" text-anchor="middle">忆阻器</text><text x="310" y="185" text-anchor="middle">负载</text><text x="430" y="190" text-anchor="middle">C1</text><text x="18" y="25">脉冲响应子电路 · 示意</text>','忆阻器脉冲响应电路示意');
const layout=()=>svg('<rect x="65" y="35" width="370" height="215" rx="3" class="wire"/><rect x="85" y="55" width="100" height="175" style="fill:var(--lab-sub);stroke:var(--lab-border)"/><text x="135" y="145" text-anchor="middle">外围控制</text><rect x="210" y="65" width="200" height="125" style="fill:var(--lab-sub);stroke:var(--lab-blue)"/>'+Array.from({length:8},(_,i)=>`<path class="wire" d="M${225+i*24} 70V185"/>`).join('')+Array.from({length:5},(_,i)=>`<path class="wire" d="M215 ${80+i*23}H405"/>`).join('')+'<text x="310" y="215" text-anchor="middle">忆阻器阵列</text><path class="signal" d="M185 95H210M185 125H210M185 155H210"/>','概念芯片分区，非可制造版图');
const pages=[
()=>toolbar('神经电路实验室','从模型到电路，再到可复现实验。',action('新建实验',true)+action('导入工作空间'))+`<div class="grid">${panel('继续研究',item('线虫神经系统 / 忆阻器映射','上次打开：电路设计 · 有未运行的参数修改')+action('打开电路')+item('单器件特性测试','模型与激励已配置 · 等待首次运行'))}${panel('从示例开始',item('忆阻器脉冲响应','修改参数，观察阻值与电流变化')+item('神经元与突触子电路','查看输入刺激和输出响应')+item('神经网络浏览','查看结构与连接属性'))}${panel('最近实验',table(['实验','状态','结果'],[['脉冲响应 · A','已完成（示意）','查看波形'],['参数扫描 · B','失败（示意）','查看求解错误']]),'wide')}${panel('仿真环境','<span class="tag">求解器：尚未选择</span><p>配置工具后启用真实计算；模型文件仍可查看与编辑。</p>'+action('配置环境'),'wide')}</div>`,
()=>toolbar('神经网络','完整结构浏览，局部回路分析。',action('导入网络')+action('定位电路'))+`<div class="split">${panel('连接图',network()+'<div class="timeline">范围：局部回路　｜　实线：连接示意　｜　选中：中间 B</div>')}${panel('选中神经元',field('名称','中间 B（示意）')+field('类型','中间神经元')+field('参数依据','待绑定数据来源')+field('关联电路','neuron-b.circuit')+action('设为刺激点'))}</div><div class="grid" style="margin-top:14px">${panel('网络范围',item('完整网络 / 局部回路','当前显示局部示意；完整数据尚未导入'))}${panel('连接属性',item('化学突触与电突触','分别记录类型、方向与参数，不混用'))}</div>`,
()=>toolbar('器件与模型','确认器件特性，再将模型用于电路。',action('导入模型',true)+action('新建模型'))+`<div class="split">${panel('模型库',table(['模型','格式','状态'],[['忆阻器 · 示例 A','行为模型','待验证'],['神经元 · 示例 B','子电路','待验证'],['阻容元件','内置符号','可编辑']])+ '<div style="margin-top:16px">'+waveform()+'</div>')}${panel('忆阻器 · 示例 A',field('模型版本','v0.1 / 示例')+field('低阻状态','1 kΩ（示意）')+field('高阻状态','100 kΩ（示意）')+field('适用范围','尚未确认')+field('来源与授权','待填写')+action('单器件测试'))}</div>`,
()=>toolbar('电路设计','pulse-response.circuit · 未保存修改',action('保存')+action('配置实验',true))+`<div class="split">${panel('设计画布', '<div class="actions" style="margin-bottom:12px">'+action('选择')+action('连线')+action('添加元件')+action('撤销')+'</div>'+circuit()+'<div class="timeline">元件库：忆阻器 / 电阻 / 电容 / 电源 / 子电路</div>')}${panel('M1 · 忆阻器',field('模型','忆阻器 · 示例 A')+field('初始阻值','10 kΩ（示意）')+field('关联突触','未关联')+field('参数覆盖','使用模型默认值'))}</div><div style="margin-top:14px">${panel('设计检查','<span class="warning">模型适用范围待确认</span><p>连接检查、模型检查与仿真结果分别呈现。</p>')}</div>`,
()=>toolbar('实验配置','脉冲响应 / 实验草案',action('保存配置')+action('检查并运行',true))+`<div class="grid">${panel('输入刺激',field('输入位置','V1 / 输入电源')+field('信号类型','周期脉冲')+field('幅值','0.5 V（示意）')+field('脉宽 / 周期','2 ms / 20 ms（示意）'))}${panel('计算条件',field('仿真方式','时间响应')+field('时长 / 最大步长','100 ms / 0.01 ms（示意）')+field('初始状态','采用器件初始参数')+field('求解器','未配置'))}${panel('观察与比较',field('测量信号','V(n_out), I(M1), R(M1)')+field('参考结果','尚未添加')+field('完成标准','运行结束且输出完整；功能误差标准待定义'))}${panel('运行前检查',item('电路与模型','将固定当次版本及参数快照')+item('仿真环境','求解器未配置，当前不可运行')+item('输出位置','当前工作空间 / experiments'))}</div>`,
()=>toolbar('仿真与结果','脉冲响应 · A / 已完成的示意结果',action('导出数据')+action('比较实验'))+`<div class="grid">${panel('电压波形',waveform(),'wide')}${panel('网络活动',network()+'<div class="timeline">回放位置：42 ms<div class="track"><div></div></div>暂停　｜　上一帧　｜　下一帧</div>')}${panel('运行证据',field('当前状态','已完成（仅为设计示例）')+field('输入快照','模型 v0.1 / 配置 A')+field('参考对比','待绑定真实参考数据')+field('日志','查看求解器输出')+'<p>波形与网络活动同步定位；示意曲线不代表功能验证。</p>')}</div>`,
()=>toolbar('芯片设计','后续规划 · 尚未接入物理设计工具',action('查看电路'))+`<div class="split">${panel('芯片分区预览',layout()+'<div class="timeline">概念分区示意 · 非制造版图</div>')}${panel('设计条件',field('工艺与 PDK','未选择')+field('忆阻器工艺模型','未配置')+field('物理设计工具','未接入')+field('面积 / 功耗','暂无分析结果'))}</div><div class="grid" style="margin-top:14px">${panel('物理验证',item('制造规则检查','未运行')+item('版图与电路一致性','未运行'))}${panel('版图后仿真',item('寄生参数提取','未运行')+item('与原电路对比','暂无结果'))}</div>`,
()=>toolbar('FPGA 与硬件','后续规划 · 无已连接设备',action('配置工具链'))+`<div class="grid">${panel('设备连接','<div class="empty"><i data-lucide="cpu"></i><h3 style="margin-top:12px">尚未连接板卡</h3><div class="muted">板卡型号、通信方式与目标工程待配置</div></div>')}${panel('验证方式',field('数字模型验证','FPGA 运行模型，与软件参考比较')+field('真实器件测试','外部忆阻器电路 + 控制与采样接口')+'<span class="warning">两种验证分别记录，避免混淆结论</span>')}${panel('工程流程','<div class="flow"><span>仿真</span><span>综合</span><span>布局布线</span><span>烧录</span><span>采样</span></div><p>每一步展示工具实际结果；烧录前明确目标设备和文件。</p>','wide')}${panel('采集与比较','<div class="empty">连接设备并完成采集后，显示板上信号与软件参考结果。</div>','wide')}</div>`,
()=>toolbar('实验记录','保留每次实验的输入与结果，支持复现。',action('导出记录'))+panel('实验列表',table(['实验','状态','模型版本','操作'],[['脉冲响应 · A','已完成（示意）','v0.1','查看 / 重跑'],['参数扫描 · B','失败（示意）','v0.1','诊断 / 修改'],['回路刺激 · C','中断（示意）','v0.2','查看部分结果']]))+`<div class="grid" style="margin-top:14px">${panel('选中：脉冲响应 · A',field('绑定输入','电路快照 + 参数 + 激励')+field('计算环境','求解器名称与版本')+field('输出证据','波形、原始数据与运行日志'))}${panel('实验备注', '<div class="code">目的：比较两组初始阻值的响应。\n观察：待填写真实结果。\n结论：未作研究结论。\n下一步：增加参考数据并定义误差标准。</div><p>重跑生成新记录，保留原始结果。</p>')}</div>`
];
let current=0;
root.querySelector('#lab-nav').innerHTML='<div class="nav-head">神经电路实验室</div>'+names.map((n,i)=>`<button type="button" class="cursor-interaction" data-page="${i}">${n}</button>`).join('')+'<div class="small-tree">工作空间文件<br>▾ models<br>▾ circuits<br>▾ experiments<br>　 README.md</div>';
function render(i){current=Math.max(0,Math.min(8,i));picker.selectedIndex=current;root.querySelector('#tab-title').textContent=names[current];root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.page)===current?'page':'false'));screen.innerHTML=pages[current]()+`<div class="page-next"><button type="button" class="cursor-interaction" data-move="-1" ${current===0?'disabled':''}>上一页</button><span class="muted">${current+1} / 9</span><button type="button" class="cursor-interaction" data-move="1" ${current===8?'disabled':''}>下一页</button></div>`;if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});}
function save(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{page:names[current]},privateContent:{pageIndex:current}}).catch(()=>{});}
picker.addEventListener('change',()=>{render(picker.selectedIndex);save();});root.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-move]');if(!b)return;render(b.hasAttribute('data-page')?Number(b.dataset.page):current+Number(b.dataset.move));save();});
const initial=window.openai&&window.openai.widgetState;render(initial&&initial.privateContent&&Number.isInteger(initial.privateContent.pageIndex)?initial.privateContent.pageIndex:0);
window.addEventListener('openai:set_globals',e=>{const s=e.detail&&e.detail.globals&&e.detail.globals.widgetState;if(s&&s.privateContent&&Number.isInteger(s.privateContent.pageIndex))render(s.privateContent.pageIndex);});
})();
</script>
