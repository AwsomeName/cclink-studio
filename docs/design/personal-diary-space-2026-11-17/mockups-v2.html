<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的空间效果图</title>
<style>
  :root {
    --page: #15171b; --bg: #1e1f22; --side: #23252a; --top: #2b2d31; --panel: #26282d;
    --line: #34373d; --text: #e6e6e6; --muted: #9aa0a8; --accent: #3b8eea; --accentbg: #1d3a5c;
    --ok: #3fb37f; --warn: #d9a441; --bad: #e06c6c; --add: #1f3d2c; --del: #4a2326; --status: #1f4f7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  header.doc { max-width: 1120px; margin: 0 auto; padding: 32px 16px 8px; }
  header.doc h1 { margin: 0 0 6px; font-size: 24px; }
  header.doc p { margin: 0; color: var(--muted); }
  nav.toc { max-width: 1120px; margin: 12px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  nav.toc a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  nav.toc a:hover { color: var(--text); border-color: var(--accent); }
  section.shot { max-width: 1120px; margin: 36px auto; padding: 0 16px; }
  section.shot h2 { font-size: 17px; margin: 0 0 4px; }
  section.shot .note { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .win { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); box-shadow: 0 8px 30px #0006; }
  .topbar { display: flex; align-items: center; height: 42px; background: var(--top); padding: 0 12px; gap: 4px; font-size: 13px; }
  .topbar .brand { font-weight: 600; margin-right: 12px; }
  .tab { padding: 0 12px; height: 42px; display: flex; align-items: center; color: var(--muted); }
  .tab.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); font-weight: 600; }
  .tab.pin::before { content: "📌"; font-size: 10px; margin-right: 4px; opacity: .7; }
  .topbar .sp { flex: 1; }
  .body { display: flex; min-height: 520px; }
  .side { width: 168px; background: var(--side); border-right: 1px solid var(--line); padding: 10px 8px; font-size: 13px; flex: none; }
  .side .it { padding: 6px 10px; border-radius: 6px; color: var(--muted); }
  .side .it.on { background: var(--accentbg); color: var(--text); box-shadow: inset 2px 0 var(--accent); }
  .side .sep { border-top: 1px solid var(--line); margin: 8px 4px; }
  .side .grp { font-size: 11px; color: #6f757d; padding: 6px 10px 2px; }
  .main { flex: 1; padding: 20px 28px; min-width: 0; }
  .crumb { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; }
  h3.title { font-size: 22px; margin: 6px 0 14px; }
  .status { height: 24px; background: var(--status); font-size: 12px; display: flex; align-items: center; gap: 14px; padding: 0 12px; }
  .status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .btn { display: inline-block; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13px; margin-right: 6px; }
  .btn.pri { background: #2b74c4; border-color: #2b74c4; }
  .btn.dis { opacity: .45; }
  .btn.sm { padding: 3px 10px; font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); gap: 10px; }
  .row .r { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; background: #2f3238; color: var(--muted); margin-left: 6px; }
  .tag.ai { background: #2a2f4a; color: #9db4ff; }
  .tag.ok { background: #1e3a2c; color: #7fd6a8; }
  .tag.warn { background: #3d3220; color: #f0c674; }
  .tag.bad { background: #43242a; color: #f29b9b; }
  .opt { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 8px 0; display: flex; gap: 10px; align-items: flex-start; }
  .opt.on { border-color: var(--accent); background: #1b2b3d; }
  .radio { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 4px; flex: none; }
  .opt.on .radio { border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--bg); background: var(--accent); }
  .check { width: 14px; height: 14px; border-radius: 3px; border: 2px solid var(--muted); display: inline-block; vertical-align: -2px; margin-right: 6px; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .field { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; align-items: center; margin: 8px 0; }
  .field .k { color: var(--muted); font-size: 13px; }
  .input { background: #1a1b1e; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 13px; }
  .steps { display: flex; gap: 6px; margin: 0 0 16px; font-size: 12px; }
  .steps span { flex: 1; text-align: center; padding: 5px; border-radius: 6px; background: var(--panel); color: var(--muted); }
  .steps span.on { background: var(--accentbg); color: var(--text); }
  .steps span.done { color: var(--ok); }
  .quote { border-left: 3px solid #4a5160; padding: 2px 12px; margin: 8px 0; }
  .quote b { display: block; font-size: 13px; }
  .diff { font: 12px/1.6 ui-monospace, Menlo, monospace; background: #1a1b1e; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .diff .a { background: var(--add); display: block; }
  .diff .d { background: var(--del); display: block; text-decoration: line-through; opacity: .85; }
  .split { display: flex; gap: 16px; }
  .split > * { flex: 1; min-width: 0; }
  .editor { background: #1a1b1e; border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; }
  .editor h4 { margin: 10px 0 4px; font-size: 15px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .toolbar { display: flex; gap: 10px; font-size: 12px; color: var(--muted); padding: 6px 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .img { height: 90px; border-radius: 6px; background: linear-gradient(135deg, #3a4a5c, #2b3440); display: flex; align-items: center; justify-content: center; color: #9fb3c8; font-size: 12px; margin: 6px 0; }
  table.md { border-collapse: collapse; font-size: 12px; margin: 6px 0; }
  table.md td, table.md th { border: 1px solid var(--line); padding: 3px 10px; }
  .chat { width: 300px; border-left: 1px solid var(--line); background: var(--side); padding: 14px; font-size: 13px; flex: none; }
  .bub { background: var(--panel); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
  .bub.me { background: #24384f; margin-left: 30px; }
  .cite { font-size: 12px; color: #9db4ff; display: block; }
  .bar { height: 6px; background: #2f3238; border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .bar i { display: block; height: 100%; width: 55%; background: var(--accent); }
  .modal { position: relative; }
  .overlay { position: absolute; inset: 0; background: #0009; display: flex; align-items: center; justify-content: center; }
  .dialog { width: 560px; background: var(--side); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .cal { display: grid; grid-template-columns: 70px 50px 1fr auto; gap: 0 10px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; font-size: 12px; margin-bottom: 10px; }
  .seg span { flex: 1; text-align: center; padding: 5px 0; color: var(--muted); }
  .seg span.on { background: var(--accentbg); color: var(--text); font-weight: 600; }
  .pcol { width: 290px; flex: none; border-left: 1px solid var(--line); padding: 16px 14px; background: var(--side); font-size: 13px; }
  .prow { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 6px; }
  .prow.cur { box-shadow: inset 2px 0 var(--accent); }
  .prow.sel { background: #1b2b3d; }
  .prow .dot { color: #7fd6a8; font-size: 11px; }
  .prow .none { color: #6f757d; font-size: 11px; }
  .mgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mgrid div { border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; }
  .mgrid div.sel { background: #1b2b3d; border-color: var(--accent); }
  .mgrid div.cur { box-shadow: inset 0 -2px var(--accent); }
  .mgrid small { display: block; color: #7fd6a8; font-size: 10px; }
  .kv { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; font-size: 12px; margin: 6px 0; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .mcal { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; font-size: 11px; }
  .mcal-h { display: flex; justify-content: space-between; padding: 0 4px 4px; }
  .mcal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .mcal-g i { color: var(--muted); font-style: normal; }
  .mcal-g span { position: relative; padding: 2px 0 4px; border-radius: 4px; color: var(--muted); border: 1px solid transparent; }
  .mcal-g span.has { color: var(--text); }
  .mcal-g span.has::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  .mcal-g span.sel { background: #2b74c4; color: #fff; }
  .mcal-g span.today { border-color: var(--accent); }
  .mcal-f { text-align: right; color: var(--muted); margin-top: 4px; }
  @media (max-width: 760px) { .pcol { display: none; } }
  @media (max-width: 760px) { .side, .chat { display: none; } .main { padding: 14px; } .field { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="doc">
  <h1>我的空间 · 第二版效果图</h1>
  <p>依据 product-logic.md（第二版，已确认）。所有正文、路径、时间均为示意数据。</p>
</header>
<nav class="toc" id="toc"></nav>
<main id="shots"></main>

<script>
const NAV = ['今天', '日记', '计划', '定时整理', '↻ 同步', '|', '文件', '会话', '工具']
function side(on, calendar = false) {
  const days = { 2: 0, 9: 0, 16: 1, 17: 1, 18: 1, 19: 1, 20: 1, 21: 1 }
  const cal = calendar ? `<div class="mcal"><div class="mcal-h"><span>‹</span><b>2026 年 11 月</b><span>›</span></div><div class="mcal-g">` +
    ['一','二','三','四','五','六','日'].map(d => `<i>${d}</i>`).join('') + '<span></span>'.repeat(6) +
    Array.from({ length: 30 }, (_, i) => { const d = i + 1; return `<span class="${days[d] ? 'has' : ''} ${d === 20 ? 'sel' : ''} ${d === 22 ? 'today' : ''}">${d}</span>` }).join('') +
    '</div><div class="mcal-f">本月 6 篇</div></div>' : ''
  return '<div class="side" style="display:flex;flex-direction:column"><div><div class="grp">我的空间</div>' + NAV.map(n => n === '|' ? '<div class="sep"></div>' :
    `<div class="it ${n === on ? 'on' : ''}">${n}</div>`).join('') + '</div>' + cal + '</div>'
}
function shell({ nav = '今天', body, chat = '', status = 'ok', firstUse = false, calendar = false }) {
  const st = {
    ok: '<span><i class="dot" style="background:#7fd6a8"></i>AI 就绪 · Codex</span><span><i class="dot" style="background:#7fd6a8"></i>已同步</span>',
    ahead: '<span><i class="dot" style="background:#7fd6a8"></i>AI 就绪 · Codex</span><span><i class="dot" style="background:#f0c674"></i>远端有 2 项更新</span>',
    aiDown: '<span><i class="dot" style="background:#f29b9b"></i>AI 未登录</span><span><i class="dot" style="background:#7fd6a8"></i>已同步 · main</span>',
    syncing: '<span>↻ 同步中…</span>',
    paused: '<span>同步暂停 · 需要你的决定</span>',
    setup: '<span><i class="dot" style="background:#9aa0a8"></i>正在设置</span>',
    syncing: '<span>↻ 同步中…</span>',
    paused: '<span>同步暂停 · 需要你的决定</span>',
    lost: '<span><i class="dot" style="background:#f29b9b"></i>项目目录失联</span>',
  }[status]
  return `<div class="win">
    <div class="topbar"><span class="brand">CCLink Studio</span><span class="tab pin on">我的空间</span><span class="tab">研发日记</span><span class="sp"></span><span class="tab">＋ 新建 / 打开</span><span class="tab">历史项目</span><span class="tab">Studio 设置</span></div>
    <div class="body">${firstUse ? '<div class="side"><div class="grp">我的空间</div><div class="it on">首次使用</div></div>' : side(nav, calendar)}<div class="main">${body}</div>${chat}</div>
    <div class="status"><span>本地 · 我的空间</span>${st}</div>
  </div>`
}
const crumb = (a, right = '') => `<div class="crumb"><span>${a}</span><span>${right}</span></div>`
const steps = (n) => `<div class="steps">${['1 选择目录', '2 同步', '3 AI', '4 核对并确认'].map((s, i) =>
  `<span class="${i + 1 === n ? 'on' : i + 1 < n ? 'done' : ''}">${i + 1 < n ? '✓ ' : ''}${s}</span>`).join('')}</div>`

const SHOTS = [
  ['first-dir', '01 首次使用 · 选择目录', '查看此页不写入任何文件。选已有目录时只读核对并显示识别结果。',
    shell({ firstUse: true, status: 'setup', body: crumb('我的空间 / 首次使用') + '<h3 class="title">设置「我的空间」</h3>' + steps(1) +
      `<div class="opt"><div class="radio"></div><div><b>使用默认目录</b><div class="muted">~/CCLink Studio/我的空间 · 确认后才创建</div></div></div>
       <div class="opt on"><div class="radio"></div><div style="flex:1"><b>选择已有目录</b> <span class="btn sm">选择文件夹…</span>
         <div class="card" style="margin-bottom:0"><div class="field"><span class="k">项目目录</span><span>~/Desktop/woniu-forward</span>
         <span class="k">日记目录</span><span>000-个人计划 <span class="tag">自动识别</span></span>
         <span class="k">日记</span><span>412 篇 · 最近 2026/11/1120_周五.md</span>
         <span class="k">Git</span><span>已是仓库 · origin github.com/…/woniu-forward · main</span></div></div></div></div>
       <div style="margin-top:16px"><span class="btn pri">下一步</span></div>` })],

  ['first-sync', '02 首次使用 · 同步（推荐）', '已有仓库自动带出；新设备可克隆到所选空目录；也可稍后连接。',
    shell({ firstUse: true, status: 'setup', body: crumb('我的空间 / 首次使用') + '<h3 class="title">在设备之间同步</h3>' + steps(2) +
      `<div class="opt on"><div class="radio"></div><div style="flex:1"><b>使用该目录已有的 Git 仓库</b>
        <div class="field"><span class="k">远端</span><span class="input">https://github.com/…/woniu-forward.git</span><span class="k">分支</span><span class="input">main</span>
        <span class="k">认证</span><span><span class="input">HTTPS Token（仅本次使用，不保存）</span></span></div>
        <div class="muted">检查结果：本地与远端一致 · 无未提交改动</div></div></div>
       <div class="opt"><div class="radio"></div><div><b>从已有仓库克隆到空目录</b><div class="muted">新电脑使用；克隆完成后核对日记、附件和任务</div></div></div>
       <div class="opt"><div class="radio"></div><div><b>稍后连接</b><div class="muted">本地照常使用，首页与状态栏显示「未同步」</div></div></div>
       <div style="margin-top:16px"><span class="btn">上一步</span><span class="btn pri">下一步</span></div>` })],

  ['first-ai', '03 首次使用 · AI', 'AI 必选。检测本机运行时与登录，并跑一次短测试；未通过不能完成首次使用，前两步选择保留。',
    shell({ firstUse: true, status: 'setup', body: crumb('我的空间 / 首次使用') + '<h3 class="title">连接 AI</h3>' + steps(3) +
      `<div class="card"><div class="row"><span><b>Codex</b> <span class="tag ok">已安装</span> <span class="tag ok">已登录</span></span><span class="r">当前使用</span></div>
       <div class="row"><span><b>Claude Code</b> <span class="tag">已安装</span> <span class="tag warn">未登录</span></span><span class="btn sm">登录</span></div>
       <div class="row" style="border:0"><span>测试：读取 1 篇示例日记并生成三行摘要</span><span class="r" style="color:#7fd6a8">✓ 通过 · 6 秒</span></div></div>
       <p class="muted">AI 可读取项目内全部日记与计划；只有你要求时才修改已有文件，修改后会给出改动报告并可撤销。</p>
       <div style="margin-top:16px"><span class="btn">上一步</span><span class="btn pri">下一步</span></div>` })],

  ['first-confirm', '04 首次使用 · 核对并确认', '只有点「确认并开始」才写入。列出将新建与不会改动的内容。',
    shell({ firstUse: true, status: 'setup', body: crumb('我的空间 / 首次使用') + '<h3 class="title">核对并确认</h3>' + steps(4) +
      `<div class="field"><span class="k">项目目录</span><span>~/Desktop/woniu-forward</span><span class="k">日记目录</span><span>000-个人计划 · 时区 Asia/Shanghai</span>
       <span class="k">同步</span><span>origin / main</span><span class="k">AI</span><span>Codex</span></div>
       <div class="card"><b>将新建</b><div class="muted">.cclink-studio/workspace-settings.json · 000-个人计划/模板/日记模板.md · 任务「每日起草」「每周复盘」（共享定义）</div>
       <b style="display:block;margin-top:8px">不会改动</b><div class="muted">已有 412 篇日记、附件、计划和仓库历史；不会上传</div></div>
       <div class="card"><b>自动整理（本设备）</b><div class="row"><span><span class="check on"></span>每日起草 · 每天自动生成当天草稿</span><span class="input">07:30</span></div><div class="row" style="border:0"><span><span class="check on"></span>每周复盘 · 自动生成复盘与下周计划</span><span class="input">周日 21:00</span></div><div class="muted">之后可在定时整理中修改。已过 07:30 时，确认后立即生成今天的草稿。</div></div>
       <div style="margin-top:16px"><span class="btn">上一步</span><span class="btn pri">确认并开始</span></div>` })],

  ['today-empty', '05 今天 · 等待自动起草', '每天定时自动生成，用户无需操作；到点前可选择现在起草或先用空白模板。',
    shell({ body: crumb('我的空间 / 今天', '项目设置') + '<h3 class="title">11月21日 周六</h3>' +
      `<div class="card"><b>07:30 自动生成今天的草稿</b> <span class="tag ai">每日起草 · 本机已启用</span><div class="muted">将写入 000-个人计划/2026/11/1121_周六.md · 生成前检查是否已有今天的日记</div>
       <div style="margin:8px 0" class="muted">起草依据：1120_周五.md · 第47周计划.md · 日记模板.md</div>
       <span class="btn">现在起草</span><span class="btn">空白模板</span> <span class="muted" style="font-size:12px">修改时间 ›</span></div>
       <h4>本周计划</h4><div class="row"><span>第47周计划.md</span><span class="r">打开 ›</span></div>
       <h4>同步</h4><div class="row"><span>已同步</span><span class="r">06:58 检查</span></div>` })],

  ['today-drafting', '06 今天 · 起草中', '实时显示 AI 读取的文件与进度，可取消；完成后自动打开预览。',
    shell({ body: crumb('我的空间 / 今天') + '<h3 class="title">11月21日 周六</h3>' +
      `<div class="card"><b>AI 正在自动起草</b> <span class="muted">· 07:30 定时</span> <span class="tag ai">Codex</span><div class="bar"><i></i></div>
       <div class="muted">✓ 读取 1120_周五.md<br>✓ 读取 第47周计划.md<br>✓ 读取 日记模板.md<br>… 正在写「今日待做」</div>
       <div style="margin-top:8px"><span class="btn">取消</span></div></div>` })],
