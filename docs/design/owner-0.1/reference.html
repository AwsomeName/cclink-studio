<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>芯片资料引用范围 · Owner</title><link rel="stylesheet" href="panel.css"><style>.choice{display:block;margin:8px 0;border:1px solid #596574;border-radius:5px;padding:6px 10px;font-size:13px;text-align:left}.pick{color:#b7deff;border-color:#426b88}.casehead{display:flex;align-items:center;gap:10px}.casehead strong{font-size:17px}.casehead small{color:var(--muted)}.msgs{gap:10px}.composer{padding:9px 12px}.tools span{padding-bottom:6px;font-size:13px}.tools .sel{color:#b7dcfa}.focusnote{border-left:3px solid #c59854;background:#302b24;color:#e7c792;padding:8px 13px;font-size:13px}.listback{color:#a9d8fa;text-decoration:none}.sheet .row{padding:10px 0}</style><div class="app"><header class="top"><div class="brand"><svg class="logo" viewBox="0 0 24 23" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="8" width="12" height="12" rx="2"/><rect x="10" y="2" width="12" height="12" rx="2"/></svg>CCLink Studio</div><div class="projects">未打开项目　 ＋</div><span class="global">◈　Owner</span></header><div class="tabbar">独立面板 <span class="tab">▤　芯片资料引用范围</span></div><div class="workspace"><main class="board"><div class="path">Owner <em>/</em> 我的事务 <em>/</em> OW–018</div><div class="hd"><h1>芯片资料引用范围</h1><span id="status" class="pill"></span></div><p class="desc">为第一次读 CPU 源码的人，找一条能跟懂 RISC-V 指令的学习路径。</p><nav class="tools"><button class="sel" id="board">事务看板</button><button id="sources">资料与出处</button><button id="out">交付物</button><button id="settings">事务设置</button></nav><div id="content"></div></main><aside class="chat"><div class="chathead"><strong><span class="dot"></span>Owner 主对话</strong><small>芯片资料引用范围　·　OW–018</small></div><div id="msgs" class="msgs"></div><div class="composer">给这件事务的 Owner 留言…<div><span>本事务主对话</span><span class="send">↑</span></div></div></aside></div><footer class="statusbar">◈　Owner 独立面板 <span>·</span> 设计预览<div class="walk"><label>六步走查　</label><span id="pager"></span></div></footer></div><dialog id="dialog"><h3 id="dt"></h3><div id="db"></div><button class="cta" id="close">返回看板</button></dialog><script src="material.js"></script>
<script>
const $=k=>document.getElementById(k),key='ownerReferenceChoice',talk='ownerReferenceTalk',list='entry.html#list';
const messages=[['你','芯片调研要给同事离线看。请把两份厂商白皮书的关键原文也放进资料包。'],['Owner','目前只有官方链接，没有这两份原文可随包分发的依据。保留离线原文，还是改为链接和自写摘要？'],['你','如果只放链接，同事离线时还能看到什么？'],['Owner','项目对照和我写的摘要仍能离线看；两份白皮书原文需要联网打开。如果必须离线读原文，可以等你提供可随包使用的材料。']];
function put(w,t){return '<div class="message '+(w==='你'?'you':'last')+'"><div class="msghead"><span class="avatar">'+(w==='你'?'你':'O')+'</span>'+w+'</div><p>'+t+'</p></div>'}
function choose(v){if(sessionStorage[key])return;sessionStorage[key]=v;render()}
function modal(t,b){$('dt').textContent=t;$('db').textContent=b;$('dialog').showModal()}
function render(){if(sessionStorage[key]==='material'){renderMaterial();return}const v=sessionStorage[key],ok=v==='links',hold=v==='material',ask=sessionStorage[talk]==='1',pending=!v;
document.querySelector('.path').innerHTML='<a class="listback" href="'+list+'">‹　我的事务</a>　/　OW–018';
document.querySelector('.global').innerHTML='<a class="listback" href="'+list+'">◈　Owner'+(pending?'　·　1 等你':'')+'</a>';
document.querySelector('.desc').textContent='开源芯片调研附件　·　准备一份同事离线也能阅读的资料包。';
$('status').textContent=pending?'等我确认':ok?'进行中':'等我提供资料';$('status').className='pill '+(!ok?'gold':'');
const headline=pending?'两份白皮书，要随包放原文，还是只附链接？':ok?'已改用官方链接，A 正在整理离线摘要':'保留离线原文要求，等待你提供材料';
const rs=pending?[['原来的要求','离线资料包里也能阅读两份白皮书的关键原文。'],['A 已核对','找到了两份官方资料链接；现有资料没有说明能否随包分发原文。'],['为什么问你','改用链接会改变交付：离线能看摘要，但不能打开两份原文。'],['你的选项','① 接受链接＋自写摘要，马上继续。　② 保留原要求，等你提供可用材料。']]:ok?[['你确认了','两份白皮书只附官方链接；资料包保留可离线阅读的自写摘要。'],['Owner 已更新','交付条件已记录；不复制原文和图表，其余芯片项目对照不变。'],['A 当前任务','核对两条链接、写两段摘要，交回资料清单。'],['如何验收','Owner 逐条查链接与出处，检查摘要可离线读，再决定是否交付。']]:[['你确认了','维持离线原文要求；暂不采用链接替代。'],['下一步','等待你提供可随包使用的材料，收到后再由 A 核对。']];
$('content').innerHTML='<section class="now"><div><div class="kicker">OWNER 当前动作</div><h2>'+headline+'</h2><p>'+(pending?'Owner 已查完现有资料；两种做法会交付不同的东西。':ok?'确认已记录；续用原会话，不用再点“继续”。':'决定已记录，尚缺材料。')+'</p></div></section><div class="rail"><span class="done">✓　收集资料</span><span class="'+(pending?'active':'done')+'">'+(pending?'02':'✓')+'　确定引用范围</span><span class="'+(ok?'active':'')+'">03　整理附件</span><span>04　核对交付</span></div><section class="sheet"><div class="sheetheader"><h3>'+(pending?'需要你决定的事':'本次决定与后续工作')+'</h3><small>白皮书 × 2</small></div>'+rs.map(([a,b])=>'<div class="row"><b>'+a+'</b><span>'+b+'</span></div>').join('')+'</section><div class="sub"><b>执行会话 A</b></div><div class="ledger">'+(pending?'上次运行已结束　·　链接已交回，尚未收录原文。':ok?'新一轮运行中　·　沿用同一来源清单和只读范围。':'未启动新运行　·　等待补充材料。')+'</div>';
const thread=messages.slice(0,ask?4:2);if(v)thread.push(['你',ok?'确认：只附官方链接，保留离线摘要，不收录原文。':'确认保留离线原文要求，我来提供可随包使用的材料。'],['Owner',ok?'已按你的决定更新看板。A 接着整理，交回来后我会核对链接和摘要。':'已保留原要求，收到材料后继续。']);$('msgs').innerHTML=(thread.length>3?'<button class="hist" id="hist">↑　查看较早对话</button>':'')+thread.slice(-3).map(m=>put(...m)).join('');if($('hist'))$('hist').onclick=()=>modal('本事务主对话',thread.map(m=>m.join('：')).join('\n\n'));
document.querySelector('.composer').innerHTML=pending?'<div style="margin:0">回复 Owner　·　选一句继续</div>'+(!ask?'<button class="choice" id="ask">先问：只放链接，离线还能看什么？</button>':'')+'<button class="choice pick" id="yes">确认：只附链接，保留离线摘要</button><button class="choice" id="hold">保留原文要求，我来提供材料</button>':'给这件事务的 Owner 留言…<div><span>本事务主对话</span><span class="send">↑</span></div>';if($('ask'))$('ask').onclick=()=>{sessionStorage[talk]='1';render()};if($('yes'))$('yes').onclick=()=>choose('links');if($('hold'))$('hold').onclick=()=>choose('material');
$('board').onclick=render;$('settings').onclick=()=>modal('事务设置',pending?'原约定：资料包包含离线可读的关键原文。尚未变更。':rs[0][1]);$('sources').onclick=()=>modal('资料与出处','示例来源清单：两份厂商白皮书的官方链接。没有附可随包分发的材料证明。');$('out').onclick=()=>modal('交付物','资料包尚未交付。');$('close').onclick=()=>$('dialog').close();document.querySelector('.walk').innerHTML='确认流程　·　设计预览';}
function renderMaterial(){
const i=matIndex(),m=matState(),missing=m.group==='input';
document.querySelector('.path').innerHTML='<a class="listback" href="'+list+'">‹　我的事务</a>　/　OW–018';
document.querySelector('.global').innerHTML='<a class="listback" href="'+list+'">◈　Owner'+(missing?'　·　1 待补料':'')+'</a>';
document.querySelector('.desc').textContent='开源芯片调研附件　·　保留甲、乙两份白皮书的关键原文，供研究小组离线阅读。';
$('status').textContent=m.status;$('status').className='pill '+(missing?'gold':'');
$('content').innerHTML='<section class="now"><div><div class="kicker">OWNER 当前动作</div><h2>'+m.title+'</h2><p>'+m.sub+'</p></div></section><div class="rail"><span class="done">✓　保留原文</span><span class="'+(missing?'active':'done')+'">02　补充材料</span><span class="'+(!missing&&i<4?'active':i===4?'done':'')+'">03　逐份核对</span><span class="'+(i===4?'active':'')+'">04　整理附件</span></div><section class="sheet"><div class="sheetheader"><h3>'+m.card+'</h3><small>示例材料 · OW–018</small></div>'+m.rows.map(([a,b])=>'<div class="row"><b>'+a+'</b><span>'+b+'</span></div>').join('')+(missing?'<div style="padding:8px 16px 12px"><button class="cta" id="attach">'+(i===0?'＋ 添加材料':'＋ 只补乙的使用说明')+'</button></div>':'')+'</section><div class="sub"><b>执行会话 A</b></div><div class="ledger">'+m.run+'</div>';
const h=[['你','保留原文要求，我来提供材料。'],['Owner',materialSteps[0].chat]];if(i>=1)h.push(['你','提交甲摘录、乙摘录和乙使用说明，仅供本事务使用。'],['Owner',materialSteps[1].chat]);if(i>=2)h.push(['Owner',materialSteps[2].chat]);if(i>=3)h.push(['你','我补了乙的新说明，请核对。'],['Owner',materialSteps[3].chat]);if(i===4)h.push(['Owner',m.chat]);$('msgs').innerHTML=(h.length>3?'<button id="hist" class="hist">↑　查看较早对话</button>':'')+h.slice(-3).map(z=>put(...z)).join('');if($('hist'))$('hist').onclick=()=>modal('本事务主对话',h.map(z=>z.join('：')).join('\n\n'));
document.querySelector('.composer').innerHTML='给这件事务的 Owner 留言…<div><span>本事务主对话</span><span class="send">↑</span></div>';
const advance=()=>{if(matIndex()!==i)return;sessionStorage.ownerMaterialStep=i+1;render()};
if(missing)$('attach').onclick=()=>{modal('添加材料 · 仅限本事务','');$('db').innerHTML='<p>以下为设计走查的示例文件，不读取本机目录。</p>'+ (i===0?'甲摘录.pdf　／　乙摘录.pdf　／　乙使用说明.pdf':'乙补充说明.pdf')+'<p>提交只代表 Owner 收到文件，不代表通过核对。</p><button class="cta" id="submit">提交示例材料</button>';$('submit').onclick=()=>{$('dialog').close();advance()}};
$('settings').onclick=()=>modal('原交付条件','保留两段原文与出处，只用于研究小组离线资料包。');$('sources').onclick=()=>modal('材料清单',m.rows.map(z=>z.join('：')).join('\n'));$('out').onclick=()=>modal('交付物','资料包尚未交付。');$('board').onclick=render;$('close').onclick=()=>$('dialog').close();
document.querySelector('.walk').innerHTML=[1,3].includes(i)?'<button id="receipt">设计走查：查看下一份核对回执 →</button>':'补材料流程　·　设计预览';if($('receipt'))$('receipt').onclick=advance;
}
render();
</script></html>
