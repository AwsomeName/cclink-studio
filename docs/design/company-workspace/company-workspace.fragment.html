<script>
  ;(function () {
    const root = document.getElementById('company-workspace-design')
    const pages = [
      ['overview', '公司总览', 'layout-dashboard'],
      ['projects', '业务项目', 'folder-kanban'],
      ['finance', '财务', 'receipt-text'],
      ['operations', '运营', 'send'],
      ['knowledge', '资料与会话', 'files'],
    ]
    const defaults = {
      page: 'overview',
      projectTab: 'work',
      financeTab: 'review',
      knowledgeTab: 'files',
      taskPhase: 'blocked',
      linkedTrial: false,
      draftOpened: false,
      receiptOpened: false,
      billConfirmed: false,
      publishing: 'idle',
      selectedStep: '',
      showAgent: true,
      toast: '',
      userRequest: '',
      overlay: '',
    }
    const initial = window.openai && window.openai.widgetState
    const privateInitial = initial && initial.privateContent
    function compatible(saved) {
      const next = Object.assign({}, defaults)
      if (!saved || typeof saved !== 'object') return next
      ;[
        'page',
        'projectTab',
        'financeTab',
        'knowledgeTab',
        'taskPhase',
        'publishing',
        'selectedStep',
        'userRequest',
      ].forEach(function (k) {
        if (typeof saved[k] === 'string') next[k] = saved[k]
      })
      ;['linkedTrial', 'draftOpened', 'receiptOpened', 'billConfirmed', 'showAgent'].forEach(
        function (k) {
          if (typeof saved[k] === 'boolean') next[k] = saved[k]
        },
      )
      if (
        !['overview', 'projects', 'project', 'task', 'finance', 'operations', 'knowledge'].includes(
          next.page,
        )
      )
        next.page = 'overview'
      if (!['blocked', 'ready', 'plan', 'draft', 'accepted'].includes(next.taskPhase))
        next.taskPhase = 'blocked'
      if (!['idle', 'plan', 'unknown', 'verified'].includes(next.publishing))
        next.publishing = 'idle'
      if (!next.linkedTrial) next.taskPhase = 'blocked'
      if (next.publishing !== 'idle' && next.taskPhase !== 'accepted') next.publishing = 'idle'
      return next
    }
    const variants = ['cw-navigation', 'cw-inbox'].map(function (id) {
      return {
        el: document.getElementById(id),
        state: compatible(privateInitial && privateInitial[id]),
        design: { density: '舒适' },
      }
    })
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      })
    }
    function icon(name) {
      return '<i data-lucide="' + name + '" aria-hidden="true"></i>'
    }
    function action(label, cmd, primary, disabled) {
      return (
        '<button type="button" data-action="' +
        cmd +
        '"' +
        (primary ? ' class="cw-main-action"' : '') +
        (disabled ? ' disabled' : '') +
        '>' +
        label +
        '</button>'
      )
    }
    function link(label, cmd) {
      return (
        '<button type="button" class="cw-link" data-action="' + cmd + '">' + label + '</button>'
      )
    }
    function status(label, tone) {
      return '<span class="cw-status" data-tone="' + (tone || '') + '">' + label + '</span>'
    }
    function taskStatus(s) {
      return {
        blocked: '需要补资料',
        ready: '待开始',
        plan: '计划待接受',
        draft: '待验收',
        accepted: '已验收',
      }[s.taskPhase]
    }
    function publicationStatus(s) {
      return {
        idle: '待发布',
        plan: '范围待确认',
        unknown: '提交结果未知',
        verified: '已发布 · 结果已核验',
      }[s.publishing]
    }
    function heading(kicker, title, subtitle) {
      return (
        '<div class="cw-pagehead"><div class="cw-kicker">' +
        kicker +
        '</div><h1>' +
        title +
        '</h1><p>' +
        subtitle +
        '</p></div>'
      )
    }
    function facts(s) {
      return (
        '<div class="cw-facts"><div><span class="cw-muted cw-small">9 月已确认收入</span><span class="cw-value">¥3,000.00</span></div><div><span class="cw-muted cw-small">9 月已确认支出</span><span class="cw-value">¥' +
        (s.billConfirmed ? '1,820.40' : '1,640.40') +
        '</span></div><div><span class="cw-muted cw-small">净流入</span><span class="cw-value">¥' +
        (s.billConfirmed ? '1,179.60' : '1,359.60') +
        '</span></div></div>'
      )
    }
    function needs(s) {
      let html = ''
      if (s.taskPhase !== 'accepted')
        html +=
          '<article class="cw-item"><div class="cw-row"><strong>产品介绍稿：' +

      if (s.publishing === 'plan')
        body +=
          '<div class="cw-info"><h3>本次发布范围</h3><p>平台：CSDN<br>账号：示例公司（演示）<br>原稿：产品介绍稿.md · 已验收 v1<br>图片：用户选定的 2 张示例图片<br>目标：单篇文章公开提交并核验结果</p><p class="cw-muted cw-small">出现验证码、法律声明、账号变化或未知后果时交给你处理。</p>' +
          action('开始执行（演示）', 'startPublish', true) +
          '</div>'
      if (s.publishing === 'unknown')
        body +=
          '<div class="cw-info"><h3>提交结果未知，已停止写入</h3><p>示例执行在一次提交后未取得可靠回执。保留原账号和草稿，仅允许查询结果。</p>' +
          action('只读检查结果（演示）', 'verifyPublish', true) +
          '</div>'
      if (s.publishing === 'verified')
        body +=
          '<div class="cw-info"><div class="cw-row"><h3>公开结果核验通过</h3>' +
          status('示例回执', 'good') +
          '</div><p class="cw-small">原账号、标题、正文和 2 张图片一致。</p><p class="cw-muted cw-small">核验时间：2026-10-14 10:30（演示）</p>' +
          action('查看结果证据', 'publicEvidence') +
          '</div>'
      body +=
        '<section class="cw-section"><h2>发布执行计划</h2>' +
        opsSteps(s) +
        '</section><div class="cw-item"><div class="cw-row"><strong>CCLink 更新说明</strong>' +
        status('草稿已保存') +
        '</div><p class="cw-muted cw-small">另一条示例内容 · 尚未公开发布，保存不等于发布成功。</p></div>'
      return body
    }
    function knowledge(s) {
      let body = heading(
        '公司 / 资料与会话',
        '资料与会话',
        '由你选择关联；AI 建议与确认的决策分开展示。',
      )
      body += localTabs(
        [
          ['files', '资料'],
          ['sessions', '相关会话'],
          ['decisions', '决策'],
        ],
        s.knowledgeTab,
        'knowledgeTab',
      )
      if (s.knowledgeTab === 'files')
        body +=
          '<article class="cw-item"><strong>产品规格.md</strong><p class="cw-muted cw-small">项目文件 · 已关联 AR 眼镜一代</p>' +
          link('查看内容 →', 'specPreview') +
          '</article><article class="cw-item"><strong>试戴记录-v2.md</strong><p class="cw-muted cw-small">项目文件 · ' +
          (s.linkedTrial ? '已关联 AR 眼镜一代' : '尚未关联') +
          '</p>' +
          (s.linkedTrial
            ? link('查看内容 →', 'trialPreview')
            : action('关联到业务项目（演示）', 'attachTrial', true)) +
          '</article>'
      if (s.knowledgeTab === 'sessions')
        body +=
          '<article class="cw-item"><strong>眼镜定位讨论</strong><p class="cw-muted cw-small">已有会话 · 用户选定关联 · 内容与身份保留原归属</p>' +
          link('查看会话摘要与出处 →', 'sessionPreview') +
          '</article><p class="cw-muted cw-small">其他工作空间会话由你明确选择资料后关联；不会默认扫描全部历史。</p>'
      if (s.knowledgeTab === 'decisions')
        body +=
          '<article class="cw-item"><div class="cw-row"><strong>介绍稿优先说明真实试戴体验</strong>' +
          status('用户已确认', 'good') +
          '</div><p class="cw-muted cw-small">来源：眼镜定位讨论 · 对应业务：AR 眼镜一代</p>' +
          link('查看决策来源 →', 'sessionPreview') +
          '</article><article class="cw-item"><strong>AI 建议：为试戴招募准备问卷</strong><p class="cw-muted cw-small">待你决定，不会自动成为任务或对外发送。</p>' +
          action('查看建议', 'suggestionPreview') +
          '</article>'
      return body
    }
    function overlay(s) {
      const entries = {
        draft: [
          '产品介绍稿.md · 演示产物 v1',
          '<p><strong>AR 眼镜一代产品介绍</strong></p><p>规格部分引用产品规格.md。试戴体验引用用户选择的试戴记录-v2.md。</p><p class="cw-muted">此处是产品交互用的示例稿件。实际产品必须保存真实文件，并校验具体版本后进入验收。</p>',
        ],
        receipt: [
          '测试服务收据.pdf · 演示原件',
          '<p>交易日期：2026-09-27<br>交易对方：示例测试服务商<br>金额：¥180.00<br>用途：研发测试服务</p><p class="cw-muted">示例原件索引与流水关联。本效果稿没有真实收据文件。</p>',
        ],
        export: [
          '9 月代账交付包 · 范围预览',
          '<p>已确认账目.csv<br>确认与修改记录.csv<br>月度汇总.json<br>交付说明.md<br>关联凭证原件</p><p class="cw-muted">效果稿不生成或发送真实财务文件。</p>',
        ],
        backup: [
          '完整备份范围',
          '<p>账目 SQLite、原始资料、关联与修改历史、校验信息。</p><p class="cw-muted">实际恢复验证失败时拒绝覆盖现有数据。</p>',
        ],
        public: [
          '平台结果证据 · 演示',
          '<p>示例公开地址：example.invalid/articles/ar-glasses-demo<br>原账号、标题、正文、两张图片一致。</p><p class="cw-muted">此地址与回执均为示意，没有实际发布或访问平台。</p>',
        ],
        spec: [
          '产品规格.md · 示意',
          '<p>业务项目：AR 眼镜一代<br>产品定位、规格条目与测试边界由用户资料提供。</p>',
        ],
        trial: [
          '试戴记录-v2.md · 示意',
          '<p>记录测试条件、使用体验、问题与观察时间。此效果稿不包含真实试戴结论。</p>',
        ],
        session: [
          '眼镜定位讨论 · 关联会话示意',
          '<p>已关联现有会话。决策“优先说明真实试戴体验”保留来源，并由用户确认。</p>',
        ],
        suggestion: [
          '待决定的 AI 建议',
          '<p>准备试戴招募问卷。需要你先确定问题与招募范围，再创建工作。</p>',
        ],
      }
      const entry = entries[s.overlay]
      return entry
        ? '<section class="cw-info" aria-label="' +
            entry[0] +
            '"><div class="cw-row"><h3>' +
            entry[0] +
            '</h3>' +
            action('收起', 'closeOverlay') +
            '</div>' +
            entry[1] +
            '</section>'
        : ''
    }
    function nav(s, className) {
      const active = ['project', 'task'].includes(s.page) ? 'projects' : s.page
      return (
        '<nav class="' +
        className +
        '" aria-label="公司功能">' +
        pages
          .map(function (it) {
            return (
              '<button type="button" data-action="' +
              it[0] +
              '"' +
              (active === it[0] ? ' aria-current="page"' : '') +
              '>' +
              (className === 'cw-nav' ? icon(it[2]) : '') +
              it[1] +
              '</button>'
            )
          })
          .join('') +
        '</nav>'
      )
    }
    function agent(s) {
      const context =
        s.page === 'finance'
          ? '9 月经营账 / 测试服务记录'
          : s.page === 'operations'
            ? 'AR 眼镜一代 / 产品介绍发布'
            : s.page === 'overview'
              ? '公司本周工作'
              : 'AR 眼镜一代 / 稿件准备'
      const note =
        s.page === 'finance'
          ? '这笔 ¥180.00 仍需你核对。AI 建议只填写待核对信息，确认金额后才进入统计。'
          : s.publishing === 'unknown'
            ? '发布结果未知。当前先检查原账号和同一文章的结果，不重复提交。'
            : s.taskPhase === 'accepted'
              ? '介绍稿已验收。你可以查看发布范围，也可以继续补充这个业务的下一项工作。'
              : !s.linkedTrial
                ? '介绍稿需要试戴记录。当前没有这份材料的关联，可以先补资料再准备稿件。'
                : '资料已齐。下一步可以读取选定资料，准备稿件，并交给你验收。'
      return (
        '<aside class="cw-agent"><div class="cw-agent-head">' +
        icon('sparkles') +
        'AI 协作</div><div class="cw-agent-context">当前上下文<br><strong>' +
        context +
        '</strong></div><div class="cw-agent-message"><p>' +
        note +
        '</p></div><div class="cw-agent-sources"><div class="cw-agent-source">' +
        icon('folder') +
        ' 当前公司工作空间</div><div class="cw-agent-source">' +
        icon('file-text') +
        ' 选定资料与来源</div><div class="cw-agent-source">' +
        icon('circle-check') +
        ' 具体产物与完成条件</div></div><div class="cw-actions">' +
        action(
          s.page === 'finance'
            ? '查看待核对记录'
            : s.publishing === 'unknown'
              ? '检查发布结果'
              : '打开当前工作',
          s.page === 'finance' ? 'finance' : s.publishing === 'unknown' ? 'operations' : 'task',
          true,
        ) +
        '</div><div class="cw-agent-input"><label>交代下一项工作<textarea data-input="request" maxlength="400" placeholder="例如：根据试戴资料准备介绍稿">' +
        esc(s.userRequest) +
        '</textarea></label>' +
        action('准备工作草案', 'requestDraft') +
        '</div><p class="cw-muted cw-small">任务范围随本次工作固定；切页面不改变正在执行的授权。</p></aside>'
      )
    }
    function persist() {
      if (!window.openai || !window.openai.setWidgetState) return
      const privateContent = {}
      variants.forEach(function (v) {
        const saved = Object.assign({}, v.state)
        delete saved.toast
        delete saved.overlay
        privateContent[v.el.id] = saved
      })
      window.openai
        .setWidgetState({
          modelContent: {
            designPrototype: true,
            topic: '公司工作空间',
            use: '个人经营与 AI 协作',
            requiredDomains: ['财务', '项目管理', '运营'],
            lastView: variants.map(function (v) {
              return {
                layout: v.el.dataset.layout,
                page: v.state.page,
                task: taskStatus(v.state),
                publishing: publicationStatus(v.state),
              }
            }),
          },
          privateContent: privateContent,
        })
        .catch(function () {})
    }
    function render(v) {
      const s = v.state
      const activeElement = document.activeElement
      const previousAction = v.el.contains(activeElement) ? activeElement.dataset.action : ''
      const renderer = {
        overview: function () {
          return overview(v)
        },
        projects: function () {
          return projects(s)
        },
        project: function () {
          return project(s)
        },
        task: function () {
          return task(s)
        },
        finance: function () {
          return finance(s)
        },
        operations: function () {
          return operations(s)
        },
        knowledge: function () {
          return knowledge(s)
        },
      }[s.page]
      v.el.dataset.agent = s.showAgent ? 'visible' : 'hidden'
      v.el.style.setProperty('--cw-space', v.design.density === '紧凑' ? '10px' : '16px')
      v.el.innerHTML =
        '<header class="cw-titlebar"><span class="cw-brand">CCLink Studio</span><span class="cw-workspace">' +
        icon('building-2') +
        '<strong>示例公司</strong><span class="cw-muted cw-small">公司工作空间</span></span>' +
        action(s.showAgent ? '收起 AI' : '展开 AI', 'toggleAgent') +
        '</header><div class="cw-body"><div class="cw-rail" aria-hidden="true"><div>' +
        icon('building-2') +
        '<span>公司</span></div><div>' +
        icon('files') +
        '<span>文件</span></div><div>' +
        icon('messages-square') +
        '<span>会话</span></div><div>' +
        icon('globe') +
        '<span>浏览</span></div><div>' +
        icon('terminal') +
        '<span>终端</span></div></div><aside class="cw-sidebar"><div class="cw-sidebar-title">公司经营</div>' +
        nav(s, 'cw-nav') +
        '<div class="cw-side-bottom"><span class="cw-muted">当前业务</span><p>' +
        link('AR 眼镜一代', 'project') +
        '</p><p class="cw-muted">本地 · 个人使用</p></div></aside><main class="cw-main">' +
        (v.el.dataset.layout === 'inbox' ? nav(s, 'cw-topnav') : '') +
        (s.toast ? '<div class="cw-toast" role="status">' + esc(s.toast) + '</div>' : '') +
        renderer() +
        overlay(s) +
        '</main>' +
        agent(s) +
        '</div><footer class="cw-footer"><span>交互演示 · 数据与执行结果均为示意</span><span>未连接真实账目或平台</span></footer>'
      if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 16, height: 16 } })
      if (previousAction) {
        const candidate =
          Array.from(v.el.querySelectorAll('button[data-action]')).find(function (button) {
            return button.dataset.action === previousAction && !button.disabled
          }) ||
          v.el.querySelector('.cw-main .cw-main-action:not(:disabled)') ||
          v.el.querySelector('button[aria-current="page"]')
        if (candidate) candidate.focus({ preventScroll: true })
      }
    }
    variants.forEach(function (v) {
      render(v)
      v.el.addEventListener('input', function (event) {
        if (event.target.dataset.input === 'request') v.state.userRequest = event.target.value
      })
      v.el.addEventListener('click', function (event) {
        const button = event.target.closest('button[data-action]')
        if (!button || !v.el.contains(button) || button.disabled) return
        const cmd = button.dataset.action
        const s = v.state
        s.toast = ''
        s.overlay = ''
        if (
          [
            'overview',
            'projects',
            'project',
            'task',
            'finance',
            'operations',
            'knowledge',
          ].includes(cmd)
        )
          s.page = cmd
        if (cmd.startsWith('projectTab:')) s.projectTab = cmd.split(':')[1]
        if (cmd.startsWith('financeTab:')) s.financeTab = cmd.split(':')[1]
        if (cmd.startsWith('knowledgeTab:')) s.knowledgeTab = cmd.split(':')[1]
        if (cmd.startsWith('step:')) {
          const selected = cmd.split(':')[1]
          s.selectedStep = s.selectedStep === selected ? '' : selected
        }
        if (cmd === 'toggleAgent') s.showAgent = !s.showAgent
        if (cmd === 'attachTrial') {
          s.linkedTrial = true
          s.taskPhase = 'ready'
          s.toast = '已关联示例试戴资料。工作现在可以开始准备。'
        }
        if (cmd === 'preparePlan') s.taskPhase = 'plan'
        if (cmd === 'runDraft' && s.linkedTrial) {
          s.taskPhase = 'draft'
          s.draftOpened = false
          s.toast = '示例产物已准备，等待你查看并验收。'
        }
        if (cmd === 'openDraft') {
          s.draftOpened = true
          s.overlay = 'draft'
        }
        if (cmd === 'acceptDraft' && s.draftOpened && s.taskPhase === 'draft') {
          s.taskPhase = 'accepted'
          s.toast = '已验收示例稿件 v1，尚未公开发布。'
        }
        if (cmd === 'openReceipt') {
          s.receiptOpened = true
          s.overlay = 'receipt'
        }
        if (cmd === 'confirmBill' && s.receiptOpened && !s.billConfirmed) {
          s.billConfirmed = true
          s.toast = '示例记录已确认，汇总增加 ¥180.00。'
        }
        if (cmd === 'summary') {
          s.page = 'finance'
          s.financeTab = 'summary'
        }
        if (cmd === 'projectSpending') {
          s.page = 'project'
          s.projectTab = 'spending'
        }
        if (cmd === 'publishPlan' && s.taskPhase === 'accepted') s.publishing = 'plan'
        if (cmd === 'startPublish' && s.taskPhase === 'accepted' && s.publishing === 'plan') {
          s.publishing = 'unknown'
          s.toast = '示例提交结果未知：保留现场，仅允许核验。'
        }
        if (cmd === 'verifyPublish' && s.publishing === 'unknown') {
          s.publishing = 'verified'
          s.toast = '示例公开结果已核验；没有再次提交。'
        }
        const overlays = {
          exportPreview: 'export',
          backupPreview: 'backup',
          publicEvidence: 'public',
          specPreview: 'spec',
          trialPreview: 'trial',
          sessionPreview: 'session',
          suggestionPreview: 'suggestion',
        }
        if (overlays[cmd]) s.overlay = overlays[cmd]
        if (cmd === 'newProject') {
          const input = v.el.querySelector('[data-input="projectName"]')
          const name = input && input.value.trim()
          s.toast = name
            ? '项目草案：“' + name + '”。下一步填写目标与交付物；演示未保存真实项目。'
            : '请先填写项目名称。'
        }
        if (cmd === 'requestDraft') {
          s.toast = s.userRequest.trim()
            ? '工作草案：“' +
              s.userRequest.trim() +
              '”。下一步确认资料范围、产物与完成条件；演示未启动真实 AI。'
            : '请先写下一句话目标。'
        }
        render(v)
        persist()
      })
      if (globalThis.Tweak) {
        const tweak = new globalThis.Tweak({
          container: v.el,
          onChange: function () {
            render(v)
          },
        })
        tweak.addSelect(v.design, 'density', { options: ['舒适', '紧凑'], label: '信息密度' })
      }
    })
    window.addEventListener('openai:set_globals', function (event) {
      const incoming = event.detail && event.detail.globals && event.detail.globals.widgetState
      if (!incoming || !incoming.privateContent) return
      variants.forEach(function (v) {
        const next = compatible(incoming.privateContent[v.el.id])
        if (next.page === v.state.page) {
          next.toast = v.state.toast
          next.overlay = v.state.overlay
        }
        v.state = next
        render(v)
      })
    })
  })()
</script>
