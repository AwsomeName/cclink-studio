<!DOCTYPE html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动投稿 · CCLink Studio 方案示意</title>
<style>
:root{color-scheme:dark;--bg:#191c20;--rail:#20242a;--card:#24292f;--rule:#38414a;--text:#f1f3f5;--dim:#adb7c2;--blue:#8fceff;--green:#92dabe;--amber:#f3c683}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.top{height:46px;background:#2c3036;display:flex;align-items:center;gap:15px;border-bottom:1px solid #111820;padding:0 20px;font-size:13px}.lights{letter-spacing:3px;color:#7b838a}.brand{letter-spacing:.03em;font-weight:650}.project{padding:3px 12px;border:1px solid #537288;border-radius:5px;color:#c7e7ff}.right{margin-left:auto;color:var(--dim)}.layout{display:grid;grid-template-columns:192px 1fr;min-height:calc(100vh - 74px)}aside{background:var(--rail);border-right:1px solid var(--rule);padding:25px 12px}.aside-name{font-size:16px;font-weight:650;margin:0 10px 24px}.slabel{color:var(--dim);font-size:12px;margin:20px 10px 7px}.side{padding:8px 12px;color:#c5ced7;margin:3px 0;border-radius:4px}.selected{background:#2b404f;border-left:3px solid #6dbff7;color:white;padding-left:9px}.side i{font-style:normal;width:26px;display:inline-block;color:#9eafbc}.aside-line{border-top:1px solid var(--rule);margin:16px 8px}.shell{min-width:0}.tabbar{background:#23272c;color:#a8b3bc;padding:0 22px;display:flex;align-items:stretch;height:39px;gap:16px;font-size:13px;border-bottom:1px solid var(--rule)}.tabbar span{padding:6px 4px}.tabbar .active{border-top:2px solid #71bbf2;color:white;background:var(--bg);padding:4px 13px}main{padding:26px clamp(18px,3vw,52px) 32px;max-width:1580px;margin:auto}.crumb,.over,.meta,small{color:var(--dim);font-size:13px}.crumb{margin-bottom:10px}.heading{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.heading h1{margin:0;font-size:34px;font-weight:650;letter-spacing:.01em}.tag{border:1px solid #53636f;border-radius:4px;color:#bdd5e7;padding:2px 8px;font-size:12px}.switch{display:flex;gap:8px;flex-wrap:wrap;margin:21px 0 24px;border-bottom:1px solid var(--rule)}.switch a{padding:8px 12px 9px;border-bottom:2px solid transparent;color:var(--dim)}.switch a[aria-current=page]{border-color:#85caff;color:var(--blue)}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(282px,1fr);gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:20px 22px;margin-bottom:16px}h2{font-size:21px;margin:4px 0 10px;font-weight:620}h3{font-size:16px;margin:0 0 12px}.lead{margin:0;color:#cdd4dc;line-height:1.7}.cyan{color:var(--blue)}.good{color:var(--green)}.amber{color:var(--amber)}.evidence{list-style:none;margin:12px 0 0;padding:0}.evidence li,.kv{display:flex;gap:14px;align-items:baseline;border-top:1px solid var(--rule);padding:10px 0}.evidence li:last-child,.kv:last-child{padding-bottom:0}.evidence b{flex:1;font-size:14px;font-weight:550}.evidence span:first-child{font-size:12px;font-family:Menlo,monospace;color:var(--blue)}.evidence em{font-size:12px;font-style:normal;color:var(--green)}.kv{justify-content:space-between;font-size:14px}.kv>span{color:var(--dim)}.kv b{font-weight:550;text-align:right}.art{background:#192c37;border:1px solid #395668;border-radius:6px;margin:16px 0 12px;position:relative;overflow:hidden}.art canvas{display:block;width:100%;height:125px}.art label{position:absolute;left:12px;bottom:7px;font-size:11px;letter-spacing:.05em;color:#b0d1df}.copy{background:#1e2227;padding:12px 14px;border-radius:4px;color:#dbe1e8;margin:12px 0 2px}.copy p{margin:4px 0}.stamp{color:var(--dim);font-size:12px}.primary{background:#a0d8ff;color:#122b3c;border:0;border-radius:4px;padding:8px 15px;font-weight:600;cursor:pointer}.ghost{border:1px solid #53616e;color:#e7ebef;background:transparent;border-radius:4px;padding:7px 12px;cursor:pointer}.controls{margin:15px 0 2px;display:flex;flex-wrap:wrap;gap:8px}.callout{background:#322d25;border:1px solid #61543e;border-radius:6px;padding:13px 16px;color:#f8d399;margin:13px 0 0}.callout.info{color:#bde0fb;background:#243544;border-color:#425d70}.flow{border-left:1px solid #53616e;margin:15px 0 0 5px;padding-left:19px}.event{position:relative;margin:0 0 15px}.event:before{content:"";position:absolute;left:-24px;top:7px;border-radius:50%;background:var(--green);width:8px;height:8px}.event:last-child:before{background:var(--amber)}body[data-scene=recover] .event:nth-child(3):before{background:var(--amber)}body[data-scene=recover] .event:last-child:before{background:var(--dim)}.primary:disabled,.ghost:disabled{opacity:.55;cursor:default}.event b{font-weight:550}.event p{font-size:13px;color:var(--dim);margin:2px 0}.status{background:#15567a;color:#f3faff;display:flex;gap:20px;padding:4px 16px;min-height:28px;font-size:12px}.status .right{color:#dceef8}.sel{font:13px Menlo,monospace;color:var(--blue)}.over{letter-spacing:.04em}.note{margin-top:10px;color:var(--blue);font-size:13px}.note:empty{display:none}
@media(max-width:1120px){.layout{grid-template-columns:152px 1fr}.grid{grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr)}main{padding:20px}.card{padding:16px}.top{gap:10px}}
@media(max-width:840px){.layout{display:block}aside{display:none}.grid{grid-template-columns:1fr}.tabbar{overflow:hidden;white-space:nowrap}.heading h1{font-size:27px}.status{position:static}.status .right{display:none}.switch a{padding:7px}.evidence li{flex-wrap:wrap}.evidence b{min-width:120px}.lights{display:none}.top{padding:0 12px}}
</style>
<body><header class="top"><span class="lights" aria-hidden="true">●●●</span><span class="brand">CCLink Studio</span><span class="project">▦　眼镜研发公司</span><span class="right">本地工作空间</span></header>
<div class="layout"><aside><div class="aside-name">公司经营</div><div class="slabel">工作台</div><div class="side"><i>⌂</i>项目首页</div><div class="side"><i>▤</i>业务项目</div><div class="side selected"><i>↑</i>推广</div><div class="side"><i>◇</i>客户与售后</div><div class="side"><i>¥</i>公司账目</div><div class="aside-line"></div><div class="slabel">当前业务</div><div class="side">AI 眼镜 · 镜腿改版</div></aside>
<div class="shell"><div class="tabbar"><span>公司经营</span><span class="active">自动投稿</span><span>试装记录.md</span></div><main><div class="crumb">公司经营　/　推广　/　AI 眼镜</div><div class="heading"><h1>自动投稿</h1><span class="tag">方案示意 · 虚构样例</span></div>
<nav class="switch" aria-label="切换独立样例"><a href="#prepare">素材与成稿</a><a href="#authorize">冻稿与授权</a><a href="#unknown">回执未知</a><a href="#review">平台审核</a><a href="#recover">中断恢复</a></nav><div id="work"></div></main></div></div>
<footer class="status"><b>▦　AI 眼镜</b><span>本地工作空间</span><span class="right">界面原型　·　按钮演示不连接账号</span></footer>
<script>
const card=(text)=>'<section class="card">'+text+'</section>';
const kv=(k,v)=>'<div class="kv"><span>'+k+'</span><b>'+v+'</b></div>';
const list=(rows)=>'<ul class="evidence">'+rows.map(([a,b,c])=>'<li><span>'+a+'</span><b>'+b+'</b><em>'+c+'</em></li>').join('')+'</ul>';
const event=(head,body)=>'<div class="event"><b>'+head+'</b><p>'+body+'</p></div>';
const action=(s,msg,primary=true)=>'<button class="'+(primary?'primary':'ghost')+'" data-msg="'+msg+'">'+s+'</button>';
const note='<div class="note" role="status"></div>';
function preparation(){return [card('<div class="over">本地原稿　/　修订 03</div><h2>镜腿连接器改版后，合盖还会顶住吗？</h2><p class="lead">试装记录与三张配图已选入本稿。公开文案保留样机批次、测试条件和未测项。</p><div class="art"><canvas aria-label="镜腿连接器与外壳位置线描示意"></canvas><label>配图位置示意　·　非实拍</label></div><div class="copy"><span class="stamp">原稿摘录</span><p>本次只试装了一副样机。改版件合盖后，我们观察了连接器处的接触痕迹。反复开合后的表现还要继续测。</p></div>')+card('<h3>选入的材料</h3>'+list([['记录','试装记录.md · 本批样机','已核对'],['图 1','改版前接触位置.jpg','实拍'],['图 2','改版后合盖.jpg','实拍'],['图 3','拆盖观察.jpg','实拍']])),card('<div class="over">本次投稿范围</div><h2>知乎 · 专栏文章</h2>'+kv('目标账号','样机实验室')+kv('材料公开范围','注明批次的实测图文')+kv('配图顺序','图 1 → 图 2 → 图 3')+kv('当前稿件','本地可编辑')+kv('公开提交授权','尚未授权')+'<div class="controls">'+'<a class="primary" href="#authorize">核对冻稿预览</a>'+'</div>'+note)+card('<h3>给编辑的提醒</h3><p class="lead">“量产版已经解决”缺少量产测试记录。原稿仅采用本副样机的观察，原始板图留在工程目录。</p>')]}
function authorization(){return [card('<div class="over">待核对的冻结稿　/　修订 03</div><h2>镜腿连接器改版后，合盖还会顶住吗？</h2><div class="copy"><span class="stamp">本例全文</span><p>本次只试装了一副样机。改版件合盖后，我们观察了连接器处的接触痕迹。反复开合后的表现还要继续测。</p></div>'+list([['图 1','改版前接触位置.jpg','首句后'],['图 2','改版后合盖.jpg','第二句后'],['图 3','拆盖观察.jpg','文末']]))+card('<h3>发布前将执行</h3><p class="lead">在目标账号内找回本篇独立草稿，核验三图与全文，保存，再提交一次。中断回到原任务，提交后只核验结果。</p>'),card('<div class="over">本次公开授权</div><h2>知乎 · 专栏文章</h2>'+kv('目标账号','样机实验室 · sample09')+kv('平台草稿','专栏草稿 · 尾号 0719')+kv('读者范围','公开')+kv('平台字段','标题按冻稿；保留已核验设置')+kv('影响范围','一个账号 · 一篇 · 一次')+'<div class="controls">'+action('授权本稿并执行一次','示例已授权。真实任务将先核对目标和草稿，再提交一次。')+'</div>'+note)+card('<h3>只想准备图文？</h3><p class="lead">只授权把本稿写入同账号草稿，公开发布留到以后决定。</p><div class="controls">'+action('仅准备平台草稿','示例已选择只准备，允许上传、填稿和保存。公开提交授权为零。',false)+'</div>'+note)]}
const scenarios={
unknown:{channel:'微博 · 图文',n:'WB-07',title:'已派发一次，平台回执未知',desc:'提交时页面发生跳转。已有一次派发记录，尚未取得与本稿匹配的远端结果。',state:'结果待核验',why:'管理页没有唯一匹配的作品。',next:'核验发布结果',reply:'只读查找同账号、同正文与三图的作品。样例未提供新回执，结果仍未知。',events:[['正文与三图已回读','原生编辑现场可验证；此平台没有可核验草稿编号。'],['公开授权已核对','本账号、本稿及当前三图；允许一次提交。'],['一次提交已派发','页面跳转；请求回执未能和唯一作品对应。'],['等待读取公开结果','仅允许在原任务查结果；找不到仍保留未知。']],account:'样机实验室 · 尾号 0712',draft:'临时编辑现场',count:'1 次',auth:'已用于本次派发',gen:'第 2 代 · 只读'},
review:{channel:'头条 · 微头条',n:'TT-08',title:'平台已收稿，正在审核',desc:'同账号管理页显示本篇标题、三图和“审核中”。现在能确认平台已收稿，公开页仍待核验。',state:'等待平台审核',why:'同稿管理记录可见，公开结果还未返回。',next:'复查审核结果',reply:'示例管理页仍显示审核中。当前任务保持等待，提交次数仍为 1。',events:[['原微头条草稿已核对','原账号、草稿编号、完整正文及三图一致。'],['字段与保存已核验','提交前已回读首发、配乐和作品声明的实际选项。'],['一次提交已派发','管理页出现本稿；标题和三图相符。'],['管理页显示审核中','等待公开页，以本次平台证据为准。']],account:'样机实验室 · 尾号 0812',draft:'微头条 · 尾号 4108',count:'1 次',auth:'已用于本次派发',gen:'第 1 代 · 只读'},
recover:{channel:'知乎 · 专栏文章',n:'ZH-09',title:'重启后，先找回原账号与草稿',desc:'上次在第 2 张图上传后中断。原任务已恢复显示；要先对账第 2 张图，再决定下一步。',state:'原稿对账中',why:'图 2 的上传已派发，平台是否保留仍未知。',next:'检查原稿与图片',reply:'此样例尚未取得第 2 张图的唯一匹配。保留图 1 的证据，并让用户对照图 2。',events:[['原任务与上次执行已找到','启动新一代运行；旧页面的写入凭证已失效。'],['同账号与独立草稿已找回','账号标识、草稿编号及平台作者相符。'],['图 1 已回读，图 2 待对账','只有证明图 2 确实缺失，才可重新进入该图上传。'],['图 3、保存与公开提交未开始','对账完成后，从原任务的首个未完成动作继续。']],account:'样机实验室 · 尾号 0903',draft:'专栏草稿 · 尾号 0719',count:'0 次',auth:'仅准备图文',gen:'第 2 代 · 对账'}};
function scenario(s){return [card('<div class="over">'+s.channel+'　/　原发布任务 '+s.n+'</div><h2>'+s.title+'</h2><p class="lead">'+s.desc+'</p><div class="callout'+(s===scenarios.recover?' info':'')+'">'+s.why+'</div>')+card('<h3>执行计划与证据</h3><div class="flow">'+s.events.map(e=>event(...e)).join('')+'</div>'),card('<div class="over">本稿核验</div><h2>镜腿连接器改版实测</h2>'+kv('任务状态','<span class="amber">'+s.state+'</span>')+kv('平台账号',s.account)+kv('稿件锚点',s.draft)+kv('冻结版本','修订 03 · 三张图')+kv('提交派发',s.count)+kv('授权范围',s.auth)+kv('当前运行',s.gen)+'<div class="controls">'+action(s.next,s.reply)+'</div>'+note)+card('<h3>公司推广中的显示</h3><p class="lead">“'+s.state+'”来自原任务。点开该行回到同一任务查看最后证据。</p>')]}
function draw(){let c=document.querySelector('canvas');if(!c)return;let w=c.clientWidth,h=125,d=devicePixelRatio;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);x.strokeStyle='#2b4250';for(let i=0;i<w;i+=18){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}for(let i=0;i<h;i+=18){x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke()}x.save();x.translate(w/2-3,54);x.scale(Math.min(1,w/470),Math.min(1,w/470));let path=(pts,color,width,fill)=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.strokeStyle=color;x.lineWidth=width;x.lineJoin='round';if(fill){x.closePath();x.fillStyle=fill;x.fill()}x.stroke()};path([[-184,-9],[-98,-20],[84,-16],[152,1],[179,18],[174,25],[147,17],[78,0],[-95,0],[-184,10],[-184,-9]],'#a7d8e7',2,'#354e5c');path([[-151,0],[-100,-10],[82,-8],[139,6]],'#5d8f9e',1);path([[-28,-28],[-28,7],[5,7],[5,-28],[-28,-28]],'#f2c37f',2);path([[5,-28],[33,-40],[87,-40]],'#ebbf7d',1);x.font='11px "PingFang SC",sans-serif';x.fillStyle='#f1d5b1';x.fillText('连接器位置',91,-37);x.restore()}
function render(){let k=location.hash.slice(1);if(!scenarios[k]&&k!=='authorize')k='prepare';for(const a of document.querySelectorAll('nav a')){if(a.hash==='#'+k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}const cols=k==='prepare'?preparation():k==='authorize'?authorization():scenario(scenarios[k]);document.body.dataset.scene=k;document.querySelector('#work').innerHTML='<div class="grid"><div>'+cols[0]+'</div><div>'+cols[1]+'</div></div>';draw()}addEventListener('hashchange',render);addEventListener('resize',draw);document.addEventListener('click',e=>{let b=e.target.closest('[data-msg]');if(b){b.closest('.card').querySelector('.note').textContent=b.dataset.msg;if(location.hash==='#authorize')document.querySelectorAll('[data-msg]').forEach(el=>el.disabled=true)}});render()
</script></body></html>
