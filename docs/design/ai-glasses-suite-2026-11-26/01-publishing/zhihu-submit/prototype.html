.linkcard{display:flex;gap:12px;align-items:center;border:1px solid #bfe1cd;background:var(--green-bg);border-radius:8px;padding:12px 14px;margin:12px 0}

.timeline{margin:0;padding:0;list-style:none}

.diffline{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:start;padding:8px 0;border-top:1px solid #eef2f4;font-size:12.5px}

const $ = s => document.querySelector(s)
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

/* 稿件版本：v3 已审；working = 工作区文件含 2 处未审改动 */
const srcIssues = (src=S.src) => src==='existing' ? [
  !S.fixes.ext && {k:'ext', text:'图 2 引用外链 img.example.com/…，未收为工作空间批准副本', fix:'收为批准副本'},

].filter(Boolean) : []
const verIssues = () => S.src==='reviewed' && S.ver==='working' ? ['第 5 段：“两天试戴里没有出现新的压痕” 改为 “彻底解决了压痕问题”（无对应实测）','第 7 段：每天佩戴 4 小时 改为 6 小时（与试装记录不符）'] : []
const acctOk = () => S.acct && S.checks[S.acct].s==='match'
const anchorOk = () => S.anchor==='new' || (DRAFTS.find(d=>d.id===S.anchor)||{}).ok
const readyToAuth = () => acctOk() && !srcIssues().length && !verIssues().length && anchorOk()
const verLabel = () => S.src==='reviewed' ? (S.ver==='v3' ? '修订 v3（已审）' : '工作区当前文件（含未审改动）') : (srcIssues().length ? '手写版（待处理 '+srcIssues().length+' 项）' : '手写版 r2（已处理外链与图注）')
const fp = () => S.src==='reviewed' ? '3f9a…c21' : '8b02…e7d'

/* ---------- 示意配图（非实拍） ---------- */
function fig(n, w=640){
  const h = Math.round(w*0.5)
  const sc = w/640
  const base = `<rect width="640" height="320" fill="#eef2f4"/><g stroke="#cfd8dd">${Array.from({length:16},(_,i)=>`<line x1="${i*40}" y1="0" x2="${i*40}" y2="320"/>`).join('')}</g>`
  const frame = `<path d="M60 150 C120 110 250 105 330 120 L560 130 C590 132 600 150 590 162 L340 168 C250 170 120 180 60 185 Z" fill="#3c5566" stroke="#22394a" stroke-width="3"/>`
  let mark = ''
  if(n===1) mark = `<rect x="300" y="112" width="58" height="46" rx="6" fill="#d98b3a" stroke="#7a4a14" stroke-width="3"/><circle cx="352" cy="120" r="22" fill="none" stroke="#c0392b" stroke-width="4"/><text x="380" y="92" font-size="18" fill="#a23b2f" font-family="PingFang SC,sans-serif">接触</text>`
  if(n===2) mark = `<rect x="282" y="112" width="58" height="46" rx="6" fill="#d98b3a" stroke="#7a4a14" stroke-width="3"/><line x1="346" y1="100" x2="346" y2="176" stroke="#24704f" stroke-width="3" stroke-dasharray="6 5"/><text x="356" y="92" font-size="18" fill="#24704f" font-family="PingFang SC,sans-serif">留出缝隙</text>`
  if(n===3) mark = `<rect x="140" y="70" width="380" height="190" rx="10" fill="#3c5566" stroke="#22394a" stroke-width="3"/><rect x="250" y="130" width="120" height="70" rx="8" fill="#d98b3a" stroke="#7a4a14" stroke-width="3"/><text x="330" y="292" font-size="18" fill="#24704f" font-family="PingFang SC,sans-serif">外侧近景 · 未见新磨损</text>`
  const lbl = `<text x="16" y="306" font-size="14" fill="#7d8b95" font-family="PingFang SC,sans-serif">图 ${n} · 示意图，非实拍</text>`
  return `<svg viewBox="0 0 640 320" width="${w}" height="${h}" role="img" aria-label="图 ${n} 示意图">${base}${n===3?'':frame}${mark}${lbl}</svg>`
}

/* ---------- 渲染工具 ---------- */
const chip = (t, c='') => `<span class="chip ${c}">${t}</span>`
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`
const card = (title, body, right='') => `<section class="card">${title?`<div class="bar"><h2>${title}</h2>${right}</div>`:''}${body}</section>`
const STEPS = [['pick','选稿','原稿与版本'],['account','选账号','核对实际身份'],['preview','平台预览','正文·图·字段·草稿'],['authorize','授权','只存草稿或提交一次'],['run','执行计划','随真实事件变化'],['result','结果与恢复','审核·未知·作品链接']]
function stepper(cur){
  const idx = STEPS.findIndex(s=>s[0]===cur)
  return `<nav class="stepper" aria-label="发布步骤">${STEPS.map(([k,t,s],i)=>`<a href="#${k}" class="${k===cur?'on':i<idx?'ok':''}"><span class="n">${i<idx?'✓':i+1}</span><span class="t">${t}<small>${s}</small></span></a>`).join('')}</nav>`
}
function header(title, sub, extra=''){
  return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="row">${extra}<span class="mark">设计原型 · 示例数据</span></div></div>`
}
function taskChip(){
  if(!S.run) return chip('本地任务未创建','o')
  return chip('原任务 ZH-12','b')
}
function summaryCard(){
  const a = S.acct ? ACCTS[S.acct] : null
  return card('本次发布', `<div class="pad">
    ${kv('原稿', esc(SOURCES[S.src].name))}
    ${kv('版本', verLabel())}
    ${kv('平台', '知乎 · 专栏文章')}
    ${kv('账号', a ? `${a.label} <small>· ${acctOk()?'url_token '+a.token:'身份未通过'}</small>` : '未选择')}
    ${kv('远端草稿', S.anchor==='new' ? '新建独立草稿' : '已有草稿 '+DRAFTS.find(d=>d.id===S.anchor).tail)}
    ${kv('授权', S.authorizedScope ? (S.authorizedScope==='draft'?chip('只存草稿 · 提交上限 0','b'):chip('公开提交 1 次','v')) : chip('尚未授权','o'))}
  </div>`)
}

function charCount(){return BLOCKS.reduce((n,b)=>n+(b.t==='p'||b.t==='h'?b.x.length:b.t==='ul'?b.x.join('').length:0),0)}

/* ---------- 2. 选账号 ---------- */

      </span>
      <span style="display:grid;gap:6px;justify-items:end">${st}

      </span>

  const sel = S.acct ? ACCTS[S.acct] : null

    <div class="pad" style="border-top:1px solid var(--line)"><small>“核对实际身份”会在该账号自己的浏览器窗口（独立 Profile）读取知乎当前登录者的 url_token 与显示名，只读，不写入任何内容。显示名可能重名，以 url_token 为准。</small></div>`,
    `<a href="#home" class="muted">管理账号</a>`)

    : notes.s==='expired' ? `<div class="callout a">研发手记的会话已失效。登录只在它自己的窗口完成，Studio 不接触密码和验证码。<div class="actions"><button data-act="relogin" data-v="notes">打开研发手记的登录窗口</button></div></div>` : ''

/* ---------- 3. 平台预览 ---------- */
function renderZhihu(useAlt){
  const a = ACCTS[S.acct||'lab']
  const out = BLOCKS.map(b => {
    if(b.t==='p') return `<p>${esc(useAlt && b.alt ? b.alt : b.x)}</p>`
    if(b.t==='h') return `<h2>${esc(b.x)}</h2>`
    if(b.t==='ul') return `<ul>${b.x.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`
    const noCap = S.src==='existing' && !S.fixes.cap && b.n===3
    return `<figure class="${S.focusImg===b.n?'hl':''}" id="zfig${b.n}"><span class="pin">${b.n}</span>${fig(b.n)}${noCap?'<figcaption style="color:#c0392b">（缺图注）</figcaption>':`<figcaption>${esc(b.cap)}</figcaption>`}</figure>`
  }).join('')
  return `<div class="sim-banner">按知乎专栏样式模拟的预览；以执行后从知乎回读的结果为准</div><article class="zh"><h1>${esc(ART_TITLE)}</h1><div class="author"><span class="avatar">${a.av}</span><span><b>${a.name}</b><br>知乎 · /people/${a.token}</span></div>${out}</article>`
}
function mdSource(){
  const lines = []
  lines.push('# '+ART_TITLE, '')
  BLOCKS.forEach(b=>{
    if(b.t==='p'){
      if(S.src==='reviewed' && S.ver==='working' && b.alt) lines.push(`<span class="del">${esc(b.x)}</span>\n<span class="ins">${esc(b.alt)}</span>`,'')
      else lines.push(esc(b.x),'')
    }
    if(b.t==='h') lines.push('## '+esc(b.x),'')
    if(b.t==='ul') lines.push(...b.x.map(x=>'- '+esc(x)),'')
    if(b.t==='img'){
      const ext = S.src==='existing' && b.n===2 && !S.fixes.ext
      lines.push(`![图 ${b.n}](${ext?'https://img.example.com/u/7c1e.jpg':'img/'+esc(b.file)})`)
      if(!(S.src==='existing' && b.n===3 && !S.fixes.cap)) lines.push('*'+esc(b.cap)+'*')
      lines.push('')
    }
  })
  return lines.join('\n')
}

const ST = {

function vRun(){

  R.forEach(r=>{ let g = groups.find(x=>x.name===r.g); if(!g){g={name:r.g,rows:[]};groups.push(g)} g.rows.push(r) })
  const cur = curRow()
  const gstate = rows => rows.every(r=>r.st==='skipped') ? ['本次不执行',''] : rows.some(r=>r.st==='wait') ? ['等待你处理','a'] : rows.some(r=>r.st==='unknown') ? ['结果未知','r'] : rows.some(r=>r.st==='platform') ? ['等待平台','a'] : rows.every(r=>['done','skipped','reconciled'].includes(r.st)) ? ['已完成','g'] : rows.some(r=>r.st!=='todo'&&r.st!=='skipped') ? ['进行中','b'] : ['未开始','']

    const ev = r.st==='done'||r.st==='reconciled' ? `<div class="ev">证据：${esc(r.evShown||r.ev)}</div>` : r.note ? `<div class="ev ${['wait','platform'].includes(r.st)?'w':['unknown','failed'].includes(r.st)?'r':''}">${esc(r.note)}</div>` : ''

    return `<div class="step ${cur===r?'cur':''}" data-act="toggle-step">
      <span class="owner ${r.o}">${r.o==='S'?'Studio':r.o==='A'?'Agent':'用户'}</span>

      <span class="st">${chip(t,c)}</span></div>`
  }
  const plan = groups.map(g=>{
    const [t,c] = gstate(g.rows)
    const doneN = g.rows.filter(r=>['done','reconciled'].includes(r.st)).length
    const open = !g.rows.every(r=>['done','skipped','reconciled'].includes(r.st)) || g.rows.includes(cur) || S.run.expandAll

      ${((S.run.collapsed||{})[g.name]===undefined ? open : !S.run.collapsed[g.name]) ? g.rows.map(stepHtml).join('') : ''}</div>`
  }).join('')
  const a = ACCTS[S.acct]
  const right = card('原任务 ZH-12', `<div class="pad">
      ${kv('当前操作', cur ? esc(cur.act) : '无')}
      ${kv('执行者', cur ? (cur.st==='wait'?'等你处理（用户）':cur.o==='S'?'Studio':cur.o==='A'?'Agent':'用户') : '—')}

      <div class="actions">

      </div>

/* 执行模拟：每次推进一个真实事件 */
function startRun(){
  const scope = S.scope
  if(S.run && S.authorizedScope==='draft' && scope==='publish'){
    S.run.scope='publish'
    S.run.rows.forEach(r=>{ if(r.st==='skipped'){ r.st='todo'; r.note='' } })
    S.run.finished=false
    S.run.banner={c:'b',t:'已追加公开授权（同一原任务）。从“复核发布目标与有界授权”继续；图片与正文不重做。'}
    S.authorizedScope='publish'
  } else {
    S.run = {rows:buildRows(scope, S.anchor), gen:1, dispatch:0, scope, finished:false, banner:null, collapsed:{}}
    S.authorizedScope = scope
  }
  S.result.kind = null
  location.hash = 'run'
}
function advance(){
  if(!S.run || S.run.finished) return false
  const R = S.run.rows
  const blocking = R.find(r=>['wait','unknown','platform'].includes(r.st))
  if(blocking){ toast('“'+blocking.act+'” 等待处理，计划不会越过它'); return false }
  const active = R.find(r=>['running','verifying'].includes(r.st))
  if(active){
    if(active.id==='publish.dispatch'){
      active.st='done'; S.run.dispatch=1
      applyOutcome(S.demoOutcome); return false
    }
    active.st='done'
    if(active.skipWhenSame) active.evShown = active.ev
    return true
  }
  const next = R.find(r=>r.st==='todo')
  if(!next){ finishRun(); return false }
  if(S.run.banner && ['g','b'].includes(S.run.banner.c)) S.run.banner = null
  next.st = next.o==='A' ? 'running' : 'verifying'
  return true
}
function finishRun(){
  S.run.finished = true
  if(S.run.scope==='draft'){ S.result.kind='draft'; S.run.banner={c:'g',t:'平台草稿已保存并复核；提交 0 次。'} }
  else if(!S.result.kind) S.result.kind='published'
}
function applyOutcome(kind){
  const R = S.run.rows
  const pubs = R.filter(r=>r.g==='核验文章结果')
  if(kind==='published'){
    pubs.forEach(r=>r.st='done'); S.result.kind='published'; S.run.finished=true
    S.run.banner={c:'g',t:'已找到并核验唯一公开作品。'}
  } else if(kind==='review'){
    pubs.forEach(r=>{ r.st='platform'; r.note = r.id==='publication.verify' ? '回执：文章 ID '+NEW_DRAFT_TAIL+'。管理页显示“审核中”（11:42 观察）。公开页尚不可读。' : '审核中，公开页尚不可读' })
    S.result.kind='review'; S.run.finished=true
    S.run.banner={c:'a',t:'知乎已收稿，正在审核。提交派发 1 次，不会再次提交。'}
  } else {
    pubs.forEach(r=>{ r.st = r.id==='publication.verify' ? 'unknown' : 'todo'; if(r.id==='publication.verify') r.note='点击后页面跳转，没有拿到与本稿匹配的回执。只允许只读核验。' })
    S.result.kind='unknown'; S.run.finished=true
    S.run.banner={c:'r',t:'已派发 1 次，回执未知。保留这次提交记录；后续只读核验，不会重发。'}
  }
}
let autoTimer = null
function autoplay(stopAtPublish=true){
  clearInterval(autoTimer)
  autoTimer = setInterval(()=>{
    const R = S.run && S.run.rows
    if(!R){clearInterval(autoTimer);return}
    const nx = R.find(r=>['running','verifying','todo'].includes(r.st))
    if(stopAtPublish && nx && nx.id==='publish.dispatch' && nx.st==='todo' && !S.run.pubPause){ S.run.pubPause=true; clearInterval(autoTimer); render(); toast('即将执行唯一一次提交。在演示面板选结果后继续'); return }
    const moved = advance()
    render()
    if(!moved) clearInterval(autoTimer)
  }, 140)
}
function inject(kind){
  if(!S.run || S.run.finished){ toast('先开始执行'); return }
  const R = S.run.rows
  clearInterval(autoTimer)
  if(kind==='login'){
    const r = R.find(x=>x.id==='page.inspect')
    if(r.st==='done'){ toast('账号已核验通过；登录失效会在下一次页面检查时出现'); return }
    R.forEach(x=>{ if(R.indexOf(x)<R.indexOf(r) && x.st!=='done') x.st='done' })
    r.st='wait'; r.note='知乎显示登录页：样机实验室的会话已失效。只在该账号自己的窗口登录，Studio 不接触密码与验证码。'
    r.actions=[{k:'open-login',t:'打开样机实验室登录窗口'},{k:'relogged',t:'我已登录，重新核验',p:true}]
  }
  if(kind==='crash'){
    const d = R.find(x=>x.id==='asset.2.dispatch')
    if(d.st==='done'){ toast('图 2 已核验；请在图 2 上传前演示中断'); return }
    R.forEach(x=>{ if(R.indexOf(x)<R.indexOf(d)) x.st = x.st==='skipped'?'skipped':'done' })
    d.st='unknown'; d.note='上传已派发后窗口重建，图 2 是否落到知乎草稿未知。'
    S.run.gen += 1
    const v = R.find(x=>x.id==='asset.2.verify')
    v.st='wait'; v.note='第 '+S.run.gen+' 代：已重新握手、旧写入许可失效；已重读原草稿，账号与图 1 仍一致。自动对账未找到与图 2 唯一对应的图片。请在可见页面的同一草稿里看一下。'
    v.actions=[{k:'img2-present',t:'草稿里有图 2'},{k:'img2-missing',t:'确认图 2 缺失',p:true}]
    S.run.banner={c:'a',t:'第 '+(S.run.gen-1)+' 代在图 2 上传时中断。不会盲目重传：先确认图 2 是否已在草稿里。'}
  }
  if(kind==='captcha'){
    const p = R.find(x=>x.id==='publish.preflight')
    if(p.st==='skipped'){ toast('本次只存草稿，没有提交步骤'); return }
    if(p.st==='done'){ toast('已过提交前复核'); return }
    R.forEach(x=>{ if(R.indexOf(x)<R.indexOf(p) && x.st!=='skipped') x.st='done' })
    p.st='wait'; p.note='知乎弹出安全验证。请在可见页面完成；完成后 Studio 重新读取页面，再派发唯一一次提交。'
    p.actions=[{k:'captcha-done',t:'我已完成验证',p:true}]
  }
  render()
}
function rowAction(k){
  const R = S.run.rows
  if(k==='open-login'){ toast('打开样机实验室自己的浏览器窗口（原型演示）'); return }
  if(k==='relogged'){ const r=R.find(x=>x.id==='page.inspect'); r.st='verifying'; r.note=''; r.actions=[]; toast('重新读取知乎页面身份…') }
  if(k==='img2-present'){ const d=R.find(x=>x.id==='asset.2.dispatch'); d.st='reconciled'; d.evShown='已对账：用户指认后 main 复核平台图片地址与加载，图 2 已在草稿中，不再上传'; const v=R.find(x=>x.id==='asset.2.verify'); v.st='done'; v.evShown='用户指认 + 主进程复核：图 2 地址、顺序、加载一致'; v.actions=[]; v.note=''; S.run.banner={c:'g',t:'图 2 已对账。从图 3 继续；上传派发次数未增加。'} }
  if(k==='img2-missing'){ const d=R.find(x=>x.id==='asset.2.dispatch'); d.st='todo'; d.note='已确认缺失：允许在第 '+S.run.gen+' 代重新上传图 2 一次'; const v=R.find(x=>x.id==='asset.2.verify'); v.st='todo'; v.actions=[]; v.note=''; S.run.banner={c:'b',t:'确认图 2 缺失后，才重新进入图 2 上传。'} }
  if(k==='captcha-done'){ const p=R.find(x=>x.id==='publish.preflight'); p.st='verifying'; p.note=''; p.actions=[] }
  render()
}

    <li><b>两个已登记的知乎账号</b>（例：公司号 A、另一个号 B），各自在自己的窗口登录过；记录两者的 url_token。</li>
    <li><b>一篇获准公开的稿</b>：稿件生成审好的 v3（3 张图、3 条图注），以及一份手写 Markdown（含 1 张外链图、1 处缺图注）。</li>
    <li><b>负责人对“账号 A + 这篇稿”的公开发布授权</b>，口头或书面。没有授权时只做到第 8 步。</li></ol></div>`) +
  card('从选稿到授权', `<div class="pad accept"><ol>
    ${st('在稿件生成审稿后点“用这篇稿发布”','发布页顶部是这篇稿，版本 v3，3 图 3 图注；未打开任何浏览器','','pick')}
    ${st('改选手写 Markdown','外链图、缺图注被逐条列出，“下一步：授权”不可用；处理后保存为新修订才可继续','任何问题被静默忽略即失败','pick')}
    ${st('在账号 B 的窗口登录成另一个知乎号，回来点 B 的“核对实际身份”','B 显示“身份不一致”并给出本次读到的 url_token，B 不可选；A 仍可选','B 被选中或自动改用 A 即失败','account')}
    ${st('选 A，进入平台预览，在工作区文件里改一句再回来','“发哪一版”出现未审改动差异，不能冻结；改回 v3 可继续','','preview')}
    ${st('逐个打开“知乎预览 / 正文与转换 / 配图 / 平台字段 / 远端草稿”','三张图在原段落之后，图注逐条可见；字段表写清谁处理、怎么核；草稿列表只列 A 的草稿，标题不同的草稿不可选','','preview')}
    ${st('授权页先不选任何一项','开始按钮不可用；两个选项互斥','','authorize')}
  </ol></div>`) + `</div><div>` +
  card('执行与结果', `<div class="pad accept"><ol start="7">
    ${st('选“只存知乎草稿”并开始；中途在图 2 上传时关闭 Studio 窗口再打开','执行计划按真实事件逐行变化；重开后为新代次，图 2 显示“结果未知 → 等你确认”，确认前图 3 不开始','图 2 被直接重传或计划显示全部完成即失败','run')}
    ${st('等待草稿完成，在知乎创作中心打开该草稿','标题、全文、三图及位置与预览一致；Studio 提交次数为 0；提交与公开核验行显示“本次不执行”','','result')}
    ${st('（获授权后）在结果页点“授权公开提交一次”','同一原任务从“提交前复核”继续，图片不重传；派发 1 次','','authorize')}
    ${st('看结果：已公开','给出可打开的作品链接；作者为 A 的 url_token；全文与三图核验通过；来源与时间可见','只有链接、缺全文或图的核验，必须分别标出缺项','result')}
    ${st('若知乎显示审核中','结果页写明管理页原文“审核中”与观察时间；推广首页该行同样显示；点行回到同一任务；复查是只读的','','result')}
    ${st('若点过提交却没有回执（可在提交后立刻断网复现）','提交记录保持 1 次；只读核验可重复执行；无命中仍是“结果未知”；整个界面没有重发入口；重启后记录仍在','派发次数增加即失败（严重）','result')}
  </ol></div>`) +
  card('记录', `<div class="pad"><small>每次验收记录：Studio 版本、日期、脱敏任务 ID、账号 url_token 尾号、图数、派发次数、人工介入点与耗时、是否有开发者救场。“执行计划随真实事件变化”和“一次提交取得公开证据”分开判定；没经历审核时该分支标“未实测”。</small></div>`) + `</div></div>`
}

/* ---------- 演示面板 ---------- */
function demoPanel(route){
  const seg = (name, cur, opts) => `<div class="seg">${opts.map(([k,t])=>`<button class="${cur===k?'on':''}" data-act="${name}" data-v="${k}">${t}</button>`).join('')}</div>`
  let h = `<p>快速跳转</p><div class="seg">${[['home','推广首页'],['pick','选稿'],['account','账号'],['preview','预览'],['authorize','授权'],['run','执行'],['result','结果'],['accept','验收']].map(([k,t])=>`<button data-go="${k}">${t}</button>`).join('')}</div>`
  if(route==='account') h += `<p>研发手记窗口的情况</p>${seg('demo-notes', S.checks.notes.s, [['stale','待核对'],['expired','需重新登录'],['mismatch','登成别人']])}`
  if(route==='run' && S.run){
    h += `<p>模拟真实执行事件</p><div class="seg"><button data-act="adv">推进 1 个事件</button><button data-act="auto">连续推进</button></div>`
    h += `<p>注入异常</p><div class="seg"><button data-act="inj" data-v="login">登录失效</button><button data-act="inj" data-v="crash">图 2 上传时窗口中断</button><button data-act="inj" data-v="captcha">提交前安全验证</button></div>`
    if(S.run.scope==='publish') h += `<p>提交后的平台结果</p>${seg('demo-outcome', S.demoOutcome, [['published','公开成功'],['review','审核中'],['unknown','无回执']])}`
  }
  if(route==='result' && S.result.kind==='unknown') h += `<p>只读核验会找到</p>${seg('demo-verify', S.demoVerify, [['none','无命中'],['two','两篇候选'],['one','唯一匹配']])}`
  if(route==='pick'||route==='preview') h += `<p>原稿来源</p>${seg('demo-src', S.src, [['reviewed','刚审好的稿'],['existing','手写 Markdown']])}`
  h += `<p style="margin-top:8px"><button data-act="reset">重置原型</button></p>`
  $('#demo-in').innerHTML = h
}

/* ---------- 路由 ---------- */
const VIEWS = {home:vHome, pick:vPick, account:vAccount, preview:vPreview, authorize:vAuthorize, run:vRun, result:vResult, public:vPublic, accept:vAccept}
function route(){ const k = location.hash.slice(1); return VIEWS[k] ? k : 'pick' }
function render(){
  const r = route()
  $('#main').innerHTML = VIEWS[r]()
  const names = {home:'推广首页',pick:'文章发布',account:'文章发布',preview:'文章发布',authorize:'文章发布',run:'文章发布',result:'文章发布',public:'文章发布',accept:'真人验收路径'}
  $('#crumb').innerHTML = `公司项目 / AI 眼镜 / 推广 / <b>${names[r]}</b>${S.run&&!['home','accept'].includes(r)?' / 原任务 ZH-12':''}`
  $('#nav-home').classList.toggle('on', r==='home'); $('#nav-pub').classList.toggle('on', !['home','accept'].includes(r))
  demoPanel(r)
  if(r==='preview' && S.focusImg){ const el=document.getElementById('zfig'+S.focusImg); if(el) el.scrollIntoView({block:'center'}) }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act]')
  if(!t) return
  if(t.tagName==='INPUT') return
  if(t.dataset.go){ if(t.dataset.go!==route()) { location.hash = t.dataset.go; window.scrollTo(0,0) } else render(); return }
  const a = t.dataset.act, v = t.dataset.v
  if(a==='toast') return toast(v)
  if(a==='src'){ S.src=v; S.ver='v3' }
  if(a==='fix'){ S.fixes[v]=true; toast(v==='ext'?'已把外链图下载为工作空间批准副本（原型演示）':'在编辑器补上图 3 图注并保存（原型演示）') }
  if(a==='check'){ S.checks[v].s='checking'; render(); setTimeout(()=>{ const was = S.checks[v]; S.checks[v] = v==='lab' ? {s:'match',at:'刚刚 · 11:31'} : {s: was.mode||'mismatch', at:'刚刚 · 11:31'}; if(S.acct===v && S.checks[v].s!=='match') S.acct=null; render() }, 700); return }
  if(a==='acct'){ S.acct=v }
  if(a==='relogin'){ toast('打开研发手记自己的窗口；登录由你完成（原型演示）') }
  if(a==='demo-notes'){ S.checks.notes = {s:v, at:'11-26 18:05', mode:v==='stale'?'mismatch':v}; if(S.acct==='notes') S.acct='lab' }
  if(a==='tab'){ S.tab=v; S.focusImg=0 }
  if(a==='focus'){ S.tab='render'; S.focusImg=+v }
  if(a==='ver-v3'){ S.ver='v3' }
  if(a==='start'){ startRun(); return }
  if(a==='adv'){ clearInterval(autoTimer); advance() }
  if(a==='auto'){ autoplay(true); return }
  if(a==='inj'){ inject(v); return }
  if(a==='rowact'){ rowAction(v); return }
  if(a==='toggle-step'){ if(e.target.closest('button')) return; t.classList.toggle('open'); return }
  if(a==='toggle-group'){ const c=S.run.collapsed; const isOpen=!!t.nextElementSibling && t.nextElementSibling.classList.contains('step'); c[v]=isOpen }
  if(a==='expand-all'){ S.run.expandAll=!S.run.expandAll; S.run.collapsed={} }
  if(a==='demo-outcome'){ S.demoOutcome=v; const p=S.run&&S.run.rows.find(r=>r.id==='publish.dispatch'); if(p&&p.st==='done'&&!S.run.finished) applyOutcome(v) }
  if(a==='demo-verify'){ S.demoVerify=v }
  if(a==='demo-src'){ S.src=v; S.ver='v3' }
  if(a==='rkind'){ S.result.kind=v; S.result.verifyState='idle'; S.result.claimed=null; if(!S.run){ S.scope = v==='draft'?'draft':'publish'; S.run={rows:buildRows(S.scope,S.anchor),gen:1,dispatch:v==='draft'?0:1,scope:S.scope,finished:true,collapsed:{}}; S.run.rows.forEach(r=>{ if(r.st==='todo') r.st='done' }); if(v!=='draft'&&v!=='published') applyOutcome(v); S.authorizedScope=S.scope } else if(v!=='draft' && S.run.scope==='publish'){ S.run.dispatch=1; applyOutcome(v) } }
  if(a==='recheck-review'){ S.result.lastReviewCheck='11:58'; toast('只读复查：管理页仍显示“审核中”（11:58）') }
  if(a==='ro-verify'){ S.result.verifyState = S.demoVerify==='one' ? 'one' : S.demoVerify; S.result.claimed=null; if(S.demoVerify==='one'){ toast('找到唯一匹配：作者、全文、三图复核通过'); setTimeout(()=>{ S.result.kind='published'; if(S.run) applyOutcome('published'); render() }, 900) } }
  if(a==='claim'){ S.result.claimed=v; render(); setTimeout(()=>{ if(v==='A'){ S.result.kind='published'; if(S.run) applyOutcome('published') } else { S.result.verifyState='claimB'; S.result.claimed=null } render() }, 900); return }
  if(a==='upgrade'){ S.scope='publish'; location.hash='authorize'; return }
  if(a==='reset'){ location.hash='pick'; location.reload(); return }
  render()
})
document.addEventListener('change', e => {
  const t = e.target
  if(t.dataset.act==='ver'){ S.ver=t.value; render() }
  if(t.dataset.act==='anchor'){ S.anchor=t.value; render() }
  if(t.dataset.act==='scope'){ S.scope=t.value; render() }
})
addEventListener('hashchange', render)
if(innerWidth>1200) $('#demo').open = true
render()
</script>
</body>
