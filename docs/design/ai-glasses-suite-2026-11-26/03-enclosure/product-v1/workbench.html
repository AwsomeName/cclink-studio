['选外形','Blender','选定一个外形','两款都保持 90 × 60 × 26 mm，只有四角弧度不同。','比较外形并选择要继续的版本。','目标是以同一参数模板生成两份可编辑 Blender 方案，保存选中版本。','生成候选、保存 .blend 和参数版本。','本地工程与现有文件访问权限。','已选外形 + 对应 .blend（目标）','锁定外形，转入 CAD'],
['转入 CAD','基准与尺寸','把外形带入 CAD','核对单位、方向和底面基准，允许 FreeCAD 按相同参数重建实体。','确认尺寸一致，底面朝下，保留选定轮廓。','对照毫米尺寸、圆角和底面中心；不一致时暂停重建。','传递参数与参照、CAD 模板重建及形状比对。','已有 FreeCADCmd 探测和本地执行边界。','毫米参数 + 参照外形 + 重建实体（目标）','确认基准，进入结构设计'],
['改结构','FreeCAD','调整壳体结构','外形已经锁定。改变壁厚时，向内收缩内腔，外宽和安装孔位置保持不变。','选择壁厚，核对底厚、柱高与安装孔位置。','重建内腔和四个带导孔的安装柱，回显内腔宽度。','可编辑的底壳模板、参数重算和新的核验项。','已有 FreeCAD 后端和 STEP 回读基础。','可编辑底壳 .FCStd（目标）','确认结构，查看导出'],
['导出 STEP','产物与回读','导出工程 STEP','核对所选外形与壁厚，下载对应的 FreeCAD 实体样例。','核对零件、尺寸、单位及新文件名。','正式实现应独占写入新文件，重新导入核验并自动打开。','把模板结果接入通用 STEP 导出与结果卡。','已有受限修改的独占写入、核验和 STEP 查看。','base-版本-壁厚.step','下载此配置的样例 STEP']];
const state={page:0,open:0,variant:'B',wall:2,unit:'mm',brief:'给桌面传感器做一个平放的圆角底壳。长 90、宽 60、高 26 mm，内部用四个安装柱固定电路板。'};
const datum=()=>dataset[state.variant+state.wall],radius=()=>state.variant==='A'?6:14;
function view(title,rev,tag){return '<div class="viewer"><div class="viewer-head"><strong>'+title+'</strong><small>'+rev+'</small></div><div class="view-mode">'+tag+'</div><canvas class="big" aria-label="'+title+'三维示意"></canvas><div class="strip"><span>底面中心为原点　·　Z 向上</span><span>尺寸单位　mm</span></div></div>'}
function field(label,value){return '<div class="field">'+label+'<strong>'+value+'</strong></div>'}
function render(){
 const {page:p,variant:k,wall:t}=state,data=pages[p];
 $('nav').replaceChildren(...pages.map((row,i)=>{let b=document.createElement('button');b.className='flow '+(i===p?'current':i<p?'done':'');b.disabled=i>state.open;b.innerHTML='<span class="circle">'+(i<p?'✓':i+1)+'</span><span>'+row[0]+'<small>'+row[1]+'</small></span>';b.onclick=()=>{state.page=i;render()};return b}));
 for(const [id,i] of [['heading',2],['desc',3],['person',4],['auto',5],['need',6],['reuse',7],['file',8],['next',9]])$(id).textContent=data[i];
 $('crumb').textContent='产品研发　/　桌面设备底壳　/　'+(p+1)+' / 5';
 $('back').disabled=p===0;$('next').disabled=false;$('announce').textContent='';
 const art=$('art'),inputs=$('inputs');
 if(p===1){art.innerHTML='<div class="gridcards">'+['A','B'].map(a=>'<button class="option '+(a===k?'selected':'')+'" data-v="'+a+'" aria-pressed="'+(a===k)+'"><canvas aria-label="方案 '+a+' 轮廓"></canvas><div class="opcap"><b>'+a+'　'+(a==='A'?'紧凑圆角':'宽圆角')+'</b><span>'+(a===k?'✓ 已选':'选择')+'</span></div></button>').join('')+'</div>';art.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(state.variant!==b.dataset.v){state.variant=b.dataset.v;state.open=1;state.unit='mm'}render()})}
 else {art.innerHTML=view(p===0?'设计范围':p===2?'外形与重建轮廓':p===3?'底壳 · 内部结构':'底壳 · STEP 回读样例',p===0?'90 × 60 × 26 mm':'BASE / '+k+'　·　R'+radius(),p===2?'外形基准叠合示意':p===0?'参考体积':'轴测视图')}
 if(p===0){inputs.innerHTML='<h3><label for="brief">外形描述</label></h3><textarea id="brief"></textarea><div class="review">样例模板　·　圆角直壁底壳；预置两款外形。编辑文字不会调用 AI。</div>';$('brief').value=state.brief;$('brief').oninput=e=>{state.brief=e.target.value;state.open=0;$('next').disabled=!state.brief.trim()};$('next').disabled=!state.brief.trim()}
 if(p===1){inputs.innerHTML='<h3>外形版本 '+k+'</h3><div class="fields">'+field('尺寸范围','90 × 60 × 26 mm')+field('垂直边圆角','R'+radius()+' mm')+field('固定基准','底面中心')+'</div>'}
 if(p===2){inputs.innerHTML='<h3>CAD 交接核对</h3><div class="fields"><label>解释输入单位<select id="unit"><option>mm</option><option>cm</option></select></label>'+field('原外形宽度','60 mm')+field('解释后的宽度',state.unit==='mm'?'60 mm':'600 mm')+field('外形圆角','R'+radius()+' mm')+'</div><div class="review '+(state.unit==='mm'?'':'warn')+'">'+(state.unit==='mm'?'尺寸与基准匹配，可以重建。':'缩放差 10 倍。请恢复 mm 后重建。')+'</div>';$('unit').value=state.unit;$('unit').onchange=e=>{state.unit=e.target.value;state.open=2;render()};$('next').disabled=state.unit!=='mm'}
 if(p===3){inputs.innerHTML='<h3>内腔与安装柱</h3><div class="fields"><label>侧壁厚度<select id="wall"><option value="2">2 mm</option><option value="3">3 mm</option></select></label>'+field('内腔宽度',(60-2*t)+' mm')+field('底厚 / 柱高','2 / 4 mm')+field('导孔中心距','54 × 30 mm')+'</div>';$('wall').value=t;$('wall').onchange=e=>{state.wall=Number(e.target.value);state.open=3;render()}}
 if(p===4){inputs.innerHTML='<h3>base-'+k+'-'+t+'mm.step</h3><div class="fields">'+field('回读尺寸','90 × 60 × 26 mm')+field('封闭实体','1 个')+field('实体体积',datum().volume+' mm³')+'</div><div class="review">此样例已由本机 FreeCAD 导出并重新导入，基础与 BOP 检查通过。</div>'}
 redraw()
}
function paint(canvas,mesh,kind,k){
 const c=canvas.getContext('2d'),w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;
 const ratio=window.devicePixelRatio||1;canvas.width=w*ratio;canvas.height=h*ratio;c.setTransform(ratio,0,0,ratio,0,0);
 const inside=kind==='structure'||kind==='export',sine=inside?.89:.532,cosine=Math.sqrt(1-sine*sine);
 const cx=w*.49,cy=h*(inside?.56:kind==='small'?.62:.64),scale=Math.min(w/(kind==='small'?142:157),h/(inside?110:kind==='small'?106:88));
 const project=([x,y,z])=>[cx+scale*(.853*x+.522*y),cy+scale*(.522*sine*x-.853*sine*y-cosine*z),.522*cosine*x-.853*cosine*y+sine*z];
 const line=(a,b,color,lineWidth=1,dash=[])=>{c.save();c.beginPath();c.moveTo(...a.slice(0,2));c.lineTo(...b.slice(0,2));c.strokeStyle=color;c.lineWidth=lineWidth;c.setLineDash(dash);c.stroke();c.restore()};
 c.fillStyle='#e2e5dd';c.fillRect(0,0,w,h);
 for(let i=-200;i<=200;i+=10){line(project([i,-200,-1]),project([i,200,-1]),'#ccd4c9',.65);line(project([-200,i,-1]),project([200,i,-1]),'#ccd4c9',.65)}
 const [vertices,faces]=mesh,projected=vertices.map(project);
 const tris=faces.map(f=>{const [a,b,d]=f.map(i=>vertices[i]),u=b.map((v,i)=>v-a[i]),v=d.map((s,i)=>s-a[i]);let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const len=Math.hypot(...n)||1;n=n.map(x=>x/len);return {f,n,z:f.reduce((t,i)=>t+projected[i][2],0)}}).sort((a,b)=>a.z-b.z);
 for(const {f,n} of tris){if(n[0]*.522*cosine-n[1]*.853*cosine+n[2]*sine<-.003)continue;
 const light=.7+.29*n[2]-.12*n[0]-.2*n[1];let rgb=kind==='brief'?[155,170,159]:k==='A'?[160,174,175]:[119,153,138];
 if((kind==='structure'||kind==='export')&&n[2]>.98&&vertices[f[0]][2]<2.01)rgb=[102,135,121];
 c.fillStyle=c.strokeStyle='rgb('+rgb.map(x=>Math.min(250,Math.round(x*light))).join(',')+')';c.lineWidth=.68;c.beginPath();f.forEach((i,j)=>{let [x,y]=projected[i];if(j)c.lineTo(x,y);else c.moveTo(x,y)});c.closePath();c.fill();c.stroke()}
 function contour(z,dx,r,col,dash=[]){const pts=[];for(let q=0;q<4;q++){const corners=[[45-dx-r,30-dx-r],[-45+dx+r,30-dx-r],[-45+dx+r,-30+dx+r],[45-dx-r,-30+dx+r]],cc=corners[q];for(let i=0;i<=12;i++){const a=(q+i/12)*Math.PI/2;pts.push(project([cc[0]+r*Math.cos(a),cc[1]+r*Math.sin(a),z]))}}c.save();c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.strokeStyle=col;c.lineWidth=1.2;c.setLineDash(dash);c.stroke();c.restore()}
 const r=k==='A'?6:14;contour(26,0,r,kind==='handoff'?'#b56d36':'#567567',kind==='handoff'?[6,3]:[]);
 if(kind==='structure'||kind==='export'){contour(26,state.wall,r-state.wall,'#547063');}
 if(kind==='small'||w<360)return;
 function dimension(a,b,txt){const p=project(a),q=project(b);line(p,q,'#536c60');for(const n of [p,q])line([n[0]-2,n[1]+4],[n[0]+2,n[1]-4],'#536c60');const x=(p[0]+q[0])/2,y=(p[1]+q[1])/2;c.font='11px Menlo, monospace';const tw=c.measureText(txt).width;c.fillStyle='#e0e5dc';c.fillRect(x-tw/2-4,y-7,tw+8,15);c.fillStyle='#34463b';c.fillText(txt,x-tw/2,y+4)}
 dimension([-45,-38,0],[45,-38,0],'90 mm');dimension([52,-30,0],[52,30,0],'60 mm');
}
function redraw(){const p=state.page,k=state.variant;if(p===1){document.querySelectorAll('.option').forEach(b=>paint(b.querySelector('canvas'),dataset[b.dataset.v+'-skin'],'small',b.dataset.v));return}
 const cv=document.querySelector('.big');if(cv)paint(cv,p<3?dataset[(p===0?'A':k)+'-skin']:datum().mesh,['brief','','handoff','structure','export'][p],p===0?'A':k)}
$('back').onclick=()=>{if(state.page){state.page--;render()}};
$('next').onclick=async()=>{if(state.page!==4){state.open=Math.max(state.open,state.page+1);state.page++;render();return}
 try{const bytes=Uint8Array.from(atob(datum().step),v=>v.charCodeAt(0)),raw=new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')));const url=URL.createObjectURL(await raw.blob());const a=document.createElement('a');a.href=url;a.download='base-'+state.variant+'-'+state.wall+'mm.step';a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);$('announce').textContent='已向浏览器发起样例下载。'}catch{$('announce').textContent='当前浏览器无法解压样例，请使用支持 gzip 解压的桌面浏览器。'}};
window.addEventListener('resize',redraw);render();
</script></html>
