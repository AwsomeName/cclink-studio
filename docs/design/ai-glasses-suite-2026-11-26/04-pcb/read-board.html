<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>读懂我的板 · CCLink Studio</title><style>
*{box-sizing:border-box}body{margin:0;color:#e9edea;background:#171b1e;font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:10px 4vw;background:#292e32;border-bottom:1px solid #41494d;font-size:13px;color:#c5ced0;display:flex;justify-content:space-between}main{max-width:1080px;margin:auto;padding:5vh 28px}small, .muted{color:#a4b1af}h1{margin:6px 0;font-size:clamp(25px,4vw,38px)}h2{font-size:21px;margin:0 0 10px}p{margin:0 0 14px}button,a{font:inherit}button{color:#d6e1df;border:1px solid #515d61;background:#242c30;border-radius:5px;padding:7px 15px;cursor:pointer}button[aria-pressed=true]{color:#c2f6df;border-color:#79bc9d;background:#25463b}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #b8e7dc}button:hover{border-color:#b2c5c1}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:23px 0 14px}.panel{padding:22px;background:#202629;border:1px solid #3d4749;border-radius:8px;margin:12px 0}.route{display:grid;grid-template-columns:1fr auto 1.1fr auto 1fr;gap:8px;align-items:center;padding:28px 18px;background:#152421;border:1px solid #345447;border-radius:6px;text-align:center}.route strong{font-size:20px;display:block;color:#c1efda}.route span{display:block;font-size:13px;color:#aec2b9}.arrow{color:#89c4a6;font-size:20px}summary{cursor:pointer;color:#c1e4d4}details p{margin:12px 0 0}a{color:#a8d7ec}.foot{margin-top:20px;font-size:13px}.file{font:13px ui-monospace,monospace;letter-spacing:.02em}.prompt{font-size:18px;color:#c4d4cf}dialog{background:#263034;color:#eef4f0;max-width:580px;border:1px solid #698074;border-radius:8px;padding:25px}dialog::backdrop{background:#0009}dialog p{margin:12px 0}code{color:#c6e8d7}@media(max-width:620px){main{padding:22px 14px}.panel{padding:13px}.route{grid-template-columns:1fr;gap:2px;padding:13px}.arrow{transform:rotate(90deg)}.choices button{padding:6px 10px}}
</style><header><b>CCLink Studio　 /　电路板设计</b><span>交互方案示意</span></header><main><small class="file">power_audio.SchDoc　 /　音频部分</small><h1>数字声音怎样变成扬声器能用的信号？</h1><p class="prompt">先看两颗芯片各做什么，再回到图纸看引脚。</p><div class="choices" aria-label="选择要读的部分"><button data-id="0" aria-pressed="true">U9 · 转换声音</button><button data-id="1" aria-pressed="false">U5 · 驱动扬声器</button><button data-id="2" aria-pressed="false">它们怎么连？</button></div><section class="panel" aria-live="polite"><h2 id="title"></h2><p id="copy"></p><div class="route" id="route"></div><p class="foot muted" id="note"></p><button id="check">看依据</button></section><details class="panel" id="quiz"><summary>合上讲解后试一试</summary><p>如果要找“数字声音从哪里进来”，你会在原理图里找哪颗芯片、哪个引脚？</p><details><summary>对照答案</summary><p>找 U9（CS4344）的 1 脚 SDIN。旁边的 AOUTL、AOUTR 则是左右声道的模拟输出。</p></details></details><p class="foot muted">按真实元件及引脚记录重绘，布局为教学示意。若只有生产图层，先读板边、连接器和位号；信号去向需对应原理图或引脚表。</p></main><dialog><small>读图依据</small><h2 id="dt"></h2><p id="de"></p><div id="link"></div><p><button id="close">返回讲解</button></p></dialog>
<script>
const cards=[
{title:'U9 把数字声音转换成模拟音频',copy:'音乐在这里还是一串数字。U9 把它变成左右声道各自连续变化的电信号，供后面的音频电路使用。',steps:[['数字声音','SDIN · 1 脚'],['数模转换','U9 · CS4344'],['左右声道','AOUTL · 7 脚 / AOUTR · 10 脚']],note:'箭头说明这颗芯片的功能。这里画到 U9 的输出脚为止。',evidence:'本地原理图中，U9 的型号记录为 CS4344，对应符号列出 SDIN、AOUTL、AOUTR。Cirrus Logic 手册说明它执行立体声数模转换。',url:'https://statics.cirrus.com/pubs/proDatasheet/CS4344-45-48_F2.pdf',src:'Cirrus Logic 原厂手册'},
{title:'U5 让音频信号有能力推动扬声器',copy:'扬声器需要电流才能振动发声。U5 是功率放大器，接收模拟音频，再用电源提供的能量驱动负载。下面以左声道为例。',steps:[['模拟输入','INL+ / INL−'],['功率放大','U5 · PAM8404KGR'],['左声道输出','OUTL+ / OUTL−']],note:'输入和输出的“+ / −”各是一对引脚。图上可据此寻找接线。',evidence:'本地原理图的 U5 符号上有 INL+（20 脚）、INL−（19 脚）、OUTL+（2 脚）和 OUTL−（5 脚）。Diodes 将该型号系列列为模拟输入的扬声器功放。',url:'https://www.diodes.com/part/view/PAM8404',src:'Diodes 原厂器件页'},
{title:'要回答板上怎么接，先沿着一条线看',copy:'先在原图找到 U9 的 AOUTL，再沿导线或同名网络标签，记录它经过的元件和最后到达的引脚。若走到跨页标签，就查对应图页。',steps:[['起点已知','U9 · AOUTL'],['沿原图追线','导线 / 标签 / 中间元件'],['终点待核对','记录元件位号和引脚']],note:'本示意已核对两颗芯片的型号与引脚，尚未验证它们之间的板级连线。',evidence:'原理图能证明哪些引脚相连；原厂手册解释每颗芯片能做什么。当前示意只有元件与引脚级依据。要确认这块板的实际路径，需要在原图核对导线，或取得同一修订的网表。',url:null}];
const el=id=>document.getElementById(id);let index=0;function show(i){index=i;const c=cards[i];document.querySelectorAll('[data-id]').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));el('title').textContent=c.title;el('copy').textContent=c.copy;el('note').textContent=c.note;el('route').replaceChildren();c.steps.forEach(([a,b],n)=>{if(n){const ar=document.createElement('div');ar.className='arrow';ar.textContent='→';el('route').append(ar)}const d=document.createElement('div'),strong=document.createElement('strong'),s=document.createElement('span');strong.textContent=a;s.textContent=b;d.append(strong,s);el('route').append(d)})}document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(Number(b.dataset.id)));el('check').onclick=()=>{const c=cards[index];el('dt').textContent=c.title;el('de').textContent=c.evidence;el('link').replaceChildren();if(c.url){const a=document.createElement('a');a.href=c.url;a.target='_blank';a.rel='noopener';a.textContent=c.src;el('link').append(a)}document.querySelector('dialog').showModal()};el('close').onclick=()=>document.querySelector('dialog').close();show(0);
</script></html>
