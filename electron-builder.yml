appId: com.cclink.studio
productName: CCLink Studio 开源版
directories:
  buildResources: resources
  output: dist
files:
  # 正式包只接收构建输出与运行时 package manifest。生产依赖由 electron-builder
  # 根据 package.json 自动收集，避免把本机缓存、工作空间状态、凭证或设计资料带入 ASAR。
  - out/**
  - package.json
asar: true
asarUnpack:
  # node-pty：native .node 需要从真实文件路径加载，不能留在 asar 内
  - node_modules/node-pty/**
  # agent-device：helper APK 需真实文件路径供 adb install；daemon entry + import.meta 解析需出 asar
  - node_modules/agent-device/android-snapshot-helper/dist/**
  - node_modules/agent-device/dist/**
  - node_modules/yaml/**
  # occt-import-js：OpenCascade wasm 运行时需要随 STEP/STP 转换后端一起可读
  - node_modules/occt-import-js/dist/**
extraResources:
  - from: resources/scrcpy-server.jar
    to: scrcpy-server.jar
    filter:
      - '**/*'
  # 应用商店源配置：打包后需要真实文件路径
  - from: resources/store-sources.json
    to: store-sources.json
  # 能力验证页面：page.goto('file://...') 需要真实文件路径，不能留在 asar 内
  - from: out/main/test-page.html
    to: test-page.html
mac:
  icon: resources/icon.png
  target:
    - dmg
  category: public.app-category.productivity
  # Local builds use ad-hoc signing. The OSS Release workflow overrides this identity
  # with its protected Developer ID.
  identity: '-'
# 开源壳不内置生产更新源；商业版更新源与发布配置由 cclink-dev 构建层注入。
