<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img"><rect width="1600" height="820" fill="#f5f3ee"/><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><text x="80" y="80" font-size="22" font-weight="500" fill="#687984" >CCLink Studio / 协作方式示意</text><text x="80" y="167" font-size="56" font-weight="650" fill="#1c2d40" >从资料到可修改的成果</text><text x="80" y="221" font-size="25" font-weight="400" fill="#687984" >在一个工作空间里展开协作</text><rect x="80" y="294" width="330" height="300" rx="22" fill="#ffffff" stroke="#d9dedf"/><text x="108" y="365" font-size="46" font-weight="550" fill="#427de4" >01</text><text x="108" y="430" font-size="31" font-weight="600" fill="#1c2d40" >材料归位</text><text x="108" y="490" font-size="22" font-weight="400" fill="#687984" >打开本地资料</text><text x="108" y="528" font-size="22" font-weight="400" fill="#687984" >浏览参考网页</text><text x="420" y="457" font-size="28" font-weight="400" fill="#427de4" >→</text><rect x="450" y="294" width="330" height="300" rx="22" fill="#ffffff" stroke="#d9dedf"/><text x="478" y="365" font-size="46" font-weight="550" fill="#427de4" >02</text><text x="478" y="430" font-size="31" font-weight="600" fill="#1c2d40" >说明任务</text><text x="478" y="490" font-size="22" font-weight="400" fill="#687984" >明确目标与范围</text><text x="478" y="528" font-size="22" font-weight="400" fill="#687984" >提供需要参考的材料</text><text x="790" y="457" font-size="28" font-weight="400" fill="#427de4" >→</text><rect x="820" y="294" width="330" height="300" rx="22" fill="#ffffff" stroke="#d9dedf"/><text x="848" y="365" font-size="46" font-weight="550" fill="#427de4" >03</text><text x="848" y="430" font-size="31" font-weight="600" fill="#1c2d40" >工具协作</text><text x="848" y="490" font-size="22" font-weight="400" fill="#687984" >Agent 读取或修改文档</text><text x="848" y="528" font-size="22" font-weight="400" fill="#687984" >在授权范围内操作网页</text><text x="1160" y="457" font-size="28" font-weight="400" fill="#427de4" >→</text><rect x="1190" y="294" width="330" height="300" rx="22" fill="#ffffff" stroke="#d9dedf"/><text x="1218" y="365" font-size="46" font-weight="550" fill="#427de4" >04</text><text x="1218" y="430" font-size="31" font-weight="600" fill="#1c2d40" >检查保存</text><text x="1218" y="490" font-size="22" font-weight="400" fill="#687984" >核对事实并修改表达</text><text x="1218" y="528" font-size="22" font-weight="400" fill="#687984" >把成果保存在文件里</text><rect x="80" y="650" width="1440" height="76" rx="18" fill="#e7edf5" stroke="none"/><text x="800" y="698" font-size="27" font-weight="500" fill="#395979" text-anchor="middle">打开材料 → 明确范围 → Agent 协助 → 检查并保存</text><text x="80" y="785" font-size="20" font-weight="400" fill="#687984" >Agent 需配置运行时与模型服务。网页操作以本次授权及站点条件为准。</text></g></svg>