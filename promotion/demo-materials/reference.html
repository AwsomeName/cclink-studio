<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作参考资料</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#203243;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:20px 32px;border-bottom:1px solid #dcded8;display:flex;justify-content:space-between;font-size:13px;color:#60737f}main{max-width:760px;margin:62px auto;padding:0 34px}.label{font-size:12px;letter-spacing:2px;color:#396fce}h1{font-size:40px;line-height:1.35;font-weight:650;letter-spacing:-1px;margin:20px 0}p{font-size:17px;line-height:1.95;color:#52636b}h2{font-size:23px;margin-top:34px}.quote{padding:22px;border-left:3px solid #4279dd;background:#eef2f5}.note{font-size:12px;color:#697d84;margin-top:38px}.line{height:1px;background:#dcded8;margin:28px 0}</style></head>
<body><header><span>创作手记</span><span>演示参考网页</span></header><main><div class="label">RESEARCH NOTES / 01</div><h1>让资料有出处<br>让观点有来处</h1><p>一篇文章的开始，往往是几个网页、一份笔记和一些尚未成形的想法。把它们放在同一处，更容易看清哪些是事实，哪些是自己的判断。</p><div class="line"></div><h2>先整理材料，再组织表达</h2><p>为参考资料写一句摘要，记下值得追问的问题。回到自己的草稿，把信息组织成读者能够理解的顺序。</p><p class="quote">先说清要解决什么问题，再选择值得放进文章的材料。</p><h2>把修改留在文件里</h2><p>完成初稿之后，继续核对事实、补充例子、调整措辞。让每次讨论都能落到具体的文档修改上。</p><p class="note">本页为 CCLink Studio 宣传截图专用演示材料，由项目方原创。</p></main></body></html>
